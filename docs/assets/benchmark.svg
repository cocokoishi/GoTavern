<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1180" viewBox="0 0 1000 1180" role="img" aria-labelledby="benchmarkTitle benchmarkDesc">
<title id="benchmarkTitle">GoTavern vs SillyTavern (Node) - paired benchmark, ubuntu26</title>
<desc id="benchmarkDesc">Cold start to first /version 200: SillyTavern 9,878 ms, GoTavern 189 ms (52.26-fold faster); Steady-state memory (RSS): SillyTavern 1,245 MB, GoTavern 38.6 MB (32.23-fold lighter); GET /version latency: SillyTavern 63.67 ms, GoTavern 0.250 ms (254.5-fold faster); GET / latency (HTML shell): SillyTavern 9.06 ms, GoTavern 1.26 ms (7.20-fold faster). For timing rows a lower value is faster; for memory a lower value is lighter. Degree of improvement is per row, each drawn against its own zero-based axis whose maximum is printed on the row. Methodology and provenance are stated in the README section below the figure and in docs/assets/benchmark.svg.provenance.md.</desc>

  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070b14"/>
      <stop offset="1" stop-color="#0b1322"/>
    </linearGradient>
    <radialGradient id="auroraCyan" cx="82%" cy="-6%" r="62%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.17"/>
      <stop offset="0.55" stop-color="#22d3ee" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auroraViolet" cx="8%" cy="106%" r="58%">
      <stop offset="0" stop-color="#7c6cf0" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#7c6cf0" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#7c6cf0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dotgrid" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#94a3b8" opacity="0.07"/>
    </pattern>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a5f3fc"/>
      <stop offset="0.55" stop-color="#66ccff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="ratioGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eaf9ff"/>
      <stop offset="1" stop-color="#7fe9ff"/>
    </linearGradient>
    <linearGradient id="amberBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="0.55" stop-color="#f6b545"/>
      <stop offset="1" stop-color="#e2912b"/>
    </linearGradient>
    <linearGradient id="cyanBar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#c8f7ff"/>
      <stop offset="0.45" stop-color="#7fe9ff"/>
      <stop offset="1" stop-color="#229ed9"/>
    </linearGradient>
    <linearGradient id="hairlineFade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#94a3b8" stop-opacity="0"/>
      <stop offset="0.12" stop-color="#94a3b8" stop-opacity="0.26"/>
      <stop offset="0.88" stop-color="#94a3b8" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#94a3b8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="cardSheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="topRule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.7"/>
      <stop offset="0.5" stop-color="#66ccff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
    <filter id="barShadow" x="-10%" y="-40%" width="120%" height="220%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
    <filter id="goGlow" x="-60%" y="-120%" width="220%" height="340%">
      <feGaussianBlur stdDeviation="4.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="blur"/>
      </feMerge>
    </filter>
  </defs>

