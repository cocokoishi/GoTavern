    .verdict { font: 700 13px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 1.4px; fill: #6ee7f9; }
    .footer { font: 400 12px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #9aa4b0; }
    .hairline { stroke: #30363d; stroke-opacity: 0.55; stroke-width: 1; }
    .tick { stroke: #30363d; stroke-opacity: 0.55; stroke-width: 1; }
    .bar-pinned { fill: #f59e0b; }
    .bar-go { fill: #22b8cf; }
  </style>
