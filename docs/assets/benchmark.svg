<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="benchmarkTitle benchmarkDesc">
<title id="benchmarkTitle">GoTavern paired benchmark: faster on every timing row, lighter on memory</title>
<desc id="benchmarkDesc">Cold start to first /version 200: SillyTavern (Node) 14,515 ms, GoTavern 165 ms (87.97-fold faster); Steady-state memory (RSS): SillyTavern (Node) 915 MB, GoTavern 40.5 MB (22.60-fold lighter); GET /version latency: SillyTavern (Node) 65.55 ms, GoTavern 0.429 ms (152.9-fold faster); GET / latency (HTML shell): SillyTavern (Node) 13.78 ms, GoTavern 8.59 ms (1.60-fold faster). Lower is better in every row; each row is drawn against its own zero-based axis whose maximum is printed at the axis end. Memory is decimal MB (1 MB = 1,000,000 bytes); every other value is milliseconds. Source: tests/perf/q22-baseline.json, run 42012475880 at commit f1396ce.</desc>

  <style>
    .page { fill: #0d1117; }
    .kicker { font: 400 12px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 1.6px; fill: #9aa4b0; }
    .headline { font: 700 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #f0f6fc; }
    .headline-accent { font: 700 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #6ee7f9; }
    .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #c9d1d9; }
    .legend { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #c9d1d9; }
    .legend-note { font: 400 12px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #9aa4b0; }
    .row-label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #f0f6fc; }
    .row-note { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #c9d1d9; }
    .row-exact { font: 400 12px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #9aa4b0; }
    .subject-tag { font: 400 12px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 0.8px; fill: #9aa4b0; }
    .value { font: 600 15px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .value-pinned { fill: #f0f6fc; }
    .value-go { fill: #6ee7f9; }
    .axis-tick { font: 400 12px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #9aa4b0; }
