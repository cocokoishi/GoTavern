<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="benchmarkTitle benchmarkDesc">
<title id="benchmarkTitle">GoTavern paired benchmark: faster on every timing row, lighter on memory</title>
<desc id="benchmarkDesc">Cold start to first /version 200: SillyTavern (Node) 14,629 ms, GoTavern 163 ms (89.75-fold faster); Steady-state memory (RSS): SillyTavern (Node) 1,145 MB, GoTavern 39.8 MB (28.73-fold lighter); GET /version latency: SillyTavern (Node) 65.47 ms, GoTavern 0.403 ms (162.4-fold faster); GET / latency (HTML shell): SillyTavern (Node) 13.75 ms, GoTavern 8.28 ms (1.66-fold faster). Lower is better in every row; each row is drawn against its own zero-based axis whose maximum is printed at the axis end. Memory is decimal MB (1 MB = 1,000,000 bytes); every other value is milliseconds. Source: tests/perf/q22-baseline.json, run 41777492725 at commit 4fd8ed7.</desc>

  <style>
    .page { fill: #ffffff; }
    .kicker { font: 400 12px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 1.6px; fill: #57606a; }
    .headline { font: 700 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1f2328; }
    .headline-accent { font: 700 36px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #0b5f7a; }
    .subtitle { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #424a53; }
    .legend { font: 500 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #424a53; }
    .legend-note { font: 400 12px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #57606a; }
    .row-label { font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1f2328; }
    .row-note { font: 400 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #424a53; }
    .row-exact { font: 400 12px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #57606a; }
    .subject-tag { font: 400 12px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 0.8px; fill: #57606a; }
    .value { font: 600 15px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .value-pinned { fill: #1f2328; }
    .value-go { fill: #0b5f7a; }
    .axis-tick { font: 400 12px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #57606a; }
