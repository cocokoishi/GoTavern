    .verdict { font: 700 13px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 1.4px; fill: #0b5f7a; }
    .footer { font: 400 12px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #57606a; }
    .hairline { stroke: #d0d7de; stroke-opacity: 0.9; stroke-width: 1; }
    .tick { stroke: #d0d7de; stroke-opacity: 0.9; stroke-width: 1; }
    .bar-pinned { fill: #b45309; }
    .bar-go { fill: #0e7490; }
  </style>
