<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="benchmarkTitle benchmarkDesc">
<title id="benchmarkTitle">GoTavern paired benchmark: faster on every timing row, lighter on memory</title>
<desc id="benchmarkDesc">Cold start to first /version 200: SillyTavern (Node) 14,515 ms, GoTavern 165 ms (87.97-fold faster); Steady-state memory (RSS): SillyTavern (Node) 915 MB, GoTavern 40.5 MB (22.60-fold lighter); GET /version latency: SillyTavern (Node) 65.55 ms, GoTavern 0.429 ms (152.9-fold faster); GET / latency (HTML shell): SillyTavern (Node) 13.78 ms, GoTavern 8.59 ms (1.60-fold faster). Lower is better in every row; each row is drawn against its own zero-based axis whose maximum is printed at the axis end. Memory is decimal MB (1 MB = 1,000,000 bytes); every other value is milliseconds. Source: tests/perf/q22-baseline.json, run 42012475880 at commit f1396ce.</desc>

  <style>
    .page { fill: #ffffff; }
    .kicker { font: 400 14px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 1.6px; fill: #57606a; }
    .headline { font: 700 40px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1f2328; }
    .headline-accent { font: 700 40px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #0b5f7a; }
    .subtitle { font: 400 15px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #424a53; }
    .legend { font: 500 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #424a53; }
    .legend-note { font: 400 13px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #57606a; }
    .row-label { font: 600 20px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #1f2328; }
    .row-note { font: 400 14px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; fill: #424a53; }
    .row-exact { font: 400 14px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #57606a; }
    .subject-tag { font: 400 13px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 0.8px; fill: #57606a; }
    .value { font: 600 18px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; }
    .value-pinned { fill: #1f2328; }
    .value-go { fill: #0b5f7a; }
    .axis-tick { font: 400 14px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #57606a; }
    .ratio { font: 700 32px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #0b5f7a; }
    .verdict { font: 700 14px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; letter-spacing: 1.4px; fill: #0b5f7a; }
    .footer { font: 400 13px ui-monospace, "SF Mono", "SFMono-Regular", Menlo, Consolas, "Liberation Mono", monospace; fill: #57606a; }
    .hairline { stroke: #d0d7de; stroke-opacity: 0.9; stroke-width: 1; }
    .tick { stroke: #d0d7de; stroke-opacity: 0.9; stroke-width: 1; }
    .bar-pinned { fill: #bc4c00; }
    .bar-go { fill: #0969da; }
  </style>
<rect class="page" x="0" y="0" width="1200" height="675"/>
<text class="kicker" x="48" y="42">PAIRED BENCHMARK &#183; ONE GITHUB RUNNER &#183; BOTH SERVERS FROM THE SAME CHECKOUT</text>
<text class="headline" x="48" y="84">Faster. <tspan class="headline-accent">Lighter.</tspan></text>
