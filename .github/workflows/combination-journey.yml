name: Combination journey differential

# THE COMBINATION JOURNEY (GOAL §9's highest-priority scenario; GOAL §12's "character x preset x helper passes as
# a combination").
#
# ONE deterministic browser journey per subject, in ONE continuous session over ONE generated tree, composes:
#   staged Spec-V3 card -> opened through the roster -> committed complex preset planted pre-boot and SELECTED
#   through the frontend control -> complex world book (before/after/depth slots) selected through the persisted
#   settings path -> author's note through the authors-note module -> chat/global/character variables written
#   through the pinned 酒馆助手 bridge and injected -> a Quick Reply created through the extension's published API
#   and EXECUTED -> a CHARACTER-SCOPED regex stored in the card and ALLOWED through the regex extension's own
#   state -> a STREAMED turn through a recording peer -> a second turn proving the rewritten reply is history ->
#   preset/WI knob-off CONTROL turns (the harness must move when its knobs move, AGENTS 50) -> swipe / regenerate
#   / continue / branch -> page RELOAD with a resumed turn -> a GROUP turn and back -> a final turn -> disk state.
# A second invocation over the SAME tree (`--after-restart`) is a NEW process reading what the first wrote. A third
# (`--handback`, under run-against-pinned.mjs) is PINNED NODE over the GoTavern-written tree, which must read the
# journey's chat and continue it.
#
# Judge: tests/browser/compare-combination-journey.mjs (byte-oriented per-capture equality; two-subject asymmetry
# fails even when each leg's own steps are green; absent restart/handback legs are NOT-OBSERVED and REFUSED, never
# passed).
#
# TEETH: tests/browser/combination-journey-gate-selftest.mjs runs the synthetic profile suite (one planted case per
# design-section-6 row, no browser) AND, when the two real drive legs are supplied, the live mutation suite over
# them. Each planted case must fire its NAMED guard, with the target guard proved green in the unmutated pair
# first; the run prints "[selftest] N/N planted case(s) produced their NAMED red". The count is NOT hardcoded here
# because it moves when a design row gains a case: the step requires N == N and the release evidence records it.
#
# THE RELEASE RAIL (M6b). This workflow writes the release-evidence document at the ARTIFACT ROOT as
# release-evidence.json (the release verifier reads exactly that member, artifact-evidence.mjs:21). The release
# manifest requires this gate's run to carry it with kind=combination-journey-evidence, pegged to the candidate
# head SHA, profile=e03e04, interactingScenario=true and tier=full -- so a legacy profile=none run, or a fast /
# medium dispatch, cannot satisfy the rail. A bounded fail-closed step also executes
# tests/browser/extensions/e03e04-kit-selftest.mjs in the same run, and a SHA-pinned verifier refuses a
# well-formed but wrong head SHA (the comparator's artifact verifier checks only the SHA FORMAT).
#
# TIER LADDER (a scheduled trigger is deliberately NOT wired yet: a schedule would be a nightly rail, not a
# same-SHA release gate). Every tier stages all three books; only the block count and the extension batch narrow:
#   fast   (12 blocks / 3 extensions)   branch or push-time (legacy profile=none) and cheap dispatches. NARROWED:
#                                       it cannot support a release claim -- the rail requires tier=full.
#   medium (60 / 10)                    same-SHA qualification dispatches. NARROWED as well.
#   full   (120 / 22)                   THE ONLY RELEASE-ADMISSIBLE TIER: the release dispatch is
#                                       `profile=e03e04 tier=full` and its evidence is what the manifest rail reads.
#
# WHAT A GREEN RUN WOULD NOT PROVE: a real provider (the peer is an in-process recording backend, AGENTS 22);
# multi-user; a real user's card/preset prose (committed derivations only, AGENTS 56); text-completion
# instruct/context templates are not on a chat-completion wire; the group fan-out is recorded, not asserted to a
# number.

on:
  workflow_dispatch:
    inputs:
      # THE E03+E04 PROFILE (task-14, docs/alpha16/first-scenario-design.md). `none` keeps the legacy journey
      # (committed preset-a derivation, journey 3-slot book, tavern-helper only) so a push keeps its previous
      # behaviour byte-identically; the RELEASE dispatch is `profile=e03e04 tier=full`, and its
      # release-evidence.json is what the manifest rail inspects.
      profile:
        description: 'Scenario profile (none = legacy journey; e03e04 = generated 120-block/nested-books/22-extension profile, required for the release rail)'
        type: choice
        options: ['none', 'e03e04']
        default: 'none'
      tier:
        description: 'Profile tier: fast (12 blocks, 3 extensions) / medium (60, 10) are NARROWED; full (120, 22) is the only release-admissible tier'
        type: choice
        options: ['fast', 'medium', 'full']
        default: 'full'
      seed:
        description: 'Deterministic recipe seed for the generated profile'
        type: string
        default: 'e03e04-alpha16'
      extension_tier:
        description: 'Extension cost tier; empty = follow the block tier'
        type: choice
        options: ['', 'fast', 'medium', 'full']
        default: ''
  push:
    branches: [main]
    paths:
      - 'tests/browser/combination-journey-*'
      - 'tests/browser/extensions/combination-journey-kit.mjs'
      - 'tests/browser/extensions/extension-install-batch.mjs'
      - 'tests/browser/extensions/e03e04-profile-kit.mjs'
      - 'tests/browser/extensions/e03e04-kit-selftest.mjs'
      - 'tests/browser/compare-combination-journey.mjs'
      - 'tests/browser/combination-journey-gate-selftest.mjs'
      - 'tests/browser/fixtures/real/preset-a.json'
      - 'tests/browser/preset-kit.mjs'
      - 'tests/browser/worldinfo-slots-kit.mjs'
      - 'tests/browser/regex-kit.mjs'
      - 'tests/browser/group-chat-fixture.mjs'
      - 'tests/browser/q20-leg-runtime.mjs'
      - 'tests/browser/q20-persistence-drive.mjs'
      - 'tests/browser/run-against-pinned.mjs'
      - '.github/workflows/combination-journey.yml'

permissions:
  contents: read

concurrency:
  # C6 (M6b): an EVIDENCE run must not be cancelled by a later dispatch on the same ref. The legacy journey
  # (profile=none, which is what the push trigger runs) keeps its previous behaviour -- a newer push cancels the
  # older run -- while any profile=e03e04 dispatch is never cancelled.
  group: combination-journey-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ (inputs.profile || 'none') == 'none' }}

env:
  PINNED_BASELINE_COMMIT: 06bde939fb1e9c4c8d8641d810f0a916b5bce127

jobs:
  combination-journey:
    # ubuntu-24.04, NOT 22.04: the browser workflows pin this image because the Playwright chromium build the harness
    # downloads is validated against its glibc; the other long browser jobs in this repository use the same label.
    runs-on: ubuntu-24.04
    # SIZED FROM THE LEGS: five browser runs (two drives, two restart legs, one pinned hand-back) at ~5-7 minutes each
    # on the measured local shape, plus one comparator and one teeth proof. 60 minutes is the backstop that fails a
    # wedged browser instead of holding the runner; the probe's own per-step deadlines are the first line.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/checkout-pinned
        with:
          commit: ${{ env.PINNED_BASELINE_COMMIT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache the pinned server's node_modules
        id: cache-pinned-modules
        uses: actions/cache@v4
        with:
          path: .reference/SillyTavern/node_modules
          key: ${{ runner.os }}-pinned-node-modules-${{ env.PINNED_BASELINE_COMMIT }}-${{ hashFiles('.reference/SillyTavern/package-lock.json') }}

      - name: Cache the harness node_modules
        id: cache-harness-modules
        uses: actions/cache@v4
        with:
          path: tests/browser/node_modules
          key: ${{ runner.os }}-harness-node-modules-${{ hashFiles('tests/browser/package-lock.json') }}

      - name: Cache the Playwright browser download
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('tests/browser/package-lock.json') }}

      - name: Install the pinned server's dependencies
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-pinned-modules.outputs.cache-hit }}" = "true" ]; then
            echo "pinned server node_modules: CACHE HIT for ${{ env.PINNED_BASELINE_COMMIT }} -- install SKIPPED"
          else
            echo "pinned server node_modules: cache MISS -- npm ci from the pinned checkout"
            (cd .reference/SillyTavern && npm ci --no-audit --no-fund)
          fi

      - name: Install the browser harness
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-harness-modules.outputs.cache-hit }}" = "true" ]; then
            echo "tests/browser/node_modules: CACHE HIT -- npm ci SKIPPED"
          else
            (cd tests/browser && npm ci --no-audit --no-fund)
          fi
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            (cd tests/browser && npx playwright install-deps chromium)
          else
            (cd tests/browser && npx playwright install --with-deps chromium)
          fi

      - name: Run the e03e04 kit self-test (bounded, fail-closed)
        if: ${{ (inputs.profile || 'none') == 'e03e04' }}
        timeout-minutes: 10
        # C9 (M6b): design section 6 required the kit selftest to observe its contract before the scenario was wired
        # into CI; until now it was only a push path filter. It needs no browser and no network, so its green is
        # evidence in THIS run; a red exits nonzero and fails the job (no continue-on-error).
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/combination-journey"
          mkdir -p "$work"
          node tests/browser/extensions/e03e04-kit-selftest.mjs 2>&1 | tee "$work/e03e04-kit-selftest.log"

      - name: Build the subject binary
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p .browser-bin
          go build -trimpath -o .browser-bin/gotavern ./cmd/gotavern
          echo "GOTAVERN_BINARY=${PWD}/.browser-bin/gotavern" >> "$GITHUB_ENV"

      - name: Resolve the scenario profile arguments
        id: scenario
        # THE ARGUMENTS BOTH LEGS RECEIVE, in one place. With profile=none the probe gets NO profile flag and behaves
        # exactly as before this workflow gained inputs; the comparator gets no --expect-profile either.
        run: |
          set -euo pipefail
          profile='${{ inputs.profile || 'none' }}'
          tier='${{ inputs.tier || 'full' }}'
          seed='${{ inputs.seed || 'e03e04-alpha16' }}'
          extension_tier='${{ inputs.extension_tier || '' }}'
          if [ -z "$extension_tier" ]; then extension_tier="$tier"; fi
          if [ "$profile" = "e03e04" ]; then
            probe_args="--profile e03e04 --tier $tier --seed $seed --extension-tier $extension_tier"
            comparator_args="--expect-profile e03e04"
          else
            probe_args=""
            comparator_args=""
            extension_tier=""
          fi
          {
            echo "PROFILE=$profile"
            echo "TIER=$tier"
            echo "SEED=$seed"
            echo "EXTENSION_TIER=$extension_tier"
            echo "PROBE_PROFILE_ARGS=$probe_args"
            echo "COMPARATOR_PROFILE_ARGS=$comparator_args"
          } >> "$GITHUB_ENV"
          echo "profile=$profile tier=$tier seed=$seed extension_tier=$extension_tier"
          echo "probe args: ${probe_args:-(none: legacy journey)}"

      - name: Seed the pinned extension batch (one install, copied into each leg)
        if: ${{ (inputs.profile || 'none') == 'e03e04' }}
        # ONE network install of the E04 set into a scratch data root; every leg then copies from it through
        # GOTAVERN_EXTENSION_SEED_ROOT (install-pinned-extension.mjs), so a 22-extension profile does not pay 44 clones
        # and the pin cannot move between legs. The helper is the same `installExtensionBatch` the probe calls.
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/combination-journey"
          mkdir -p "$work"
          node tests/browser/extensions/extension-install-batch.mjs \
            --seed-out "$work/extension-seed" --tier "$EXTENSION_TIER" \
            | tee "$work/extension-seed.json"
          echo "GOTAVERN_EXTENSION_SEED_ROOT=$work/extension-seed/default-user/extensions" >> "$GITHUB_ENV"

      - name: Record the five legs
        id: legs
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/combination-journey"
          mkdir -p "$work/legs"
          echo "failures=0" >> "$GITHUB_OUTPUT"
          record_failure() {
            echo "::error::$1"
            echo "failures=1" >> "$GITHUB_OUTPUT"
          }
          # EVERY LEG'S OWN STDOUT GOES TO A FILE IN THE ARTIFACT. Dispatch 42173399186 was diagnosed only from
          # `gh run view --log`; the artifact carried reports but no leg logs because the job failed before the
          # comparator (and the upload step then ran too late to include them). The leg log is captured beside the
          # report, and its tail is surfaced in the job log on failure so the red is readable without downloading.
          #
          # `-e` IS INHERITED, NOT DISABLED: this step's shell is the runner's Linux default `bash -e {0}`, and
          # `set -uo pipefail` does NOT clear it. Dispatch 42182251438 proved the consequence: `"$@" > "$log" 2>&1`
          # as a SIMPLE command aborted the whole step on the first failing leg, so no pinned/restart/hand-back leg
          # ran, no tail printed, and the leg-failure counter was never consumed as the cause. The invocation is now
          # the CONDITION of an `if`, where `-e` does not apply, and every leg is attempted by construction.
          run_leg() {
            label="$1"; shift
            log="$work/legs/$label.leg.log"
            if "$@" > "$log" 2>&1; then
              echo "recorded the $label leg (log: $label.leg.log)"
            else
              status=$?
              echo "::group::$label leg log tail"
              tail -n 120 "$log" || true
              echo "::endgroup::"
              record_failure "the $label leg failed to drive (exit $status; full log in $label.leg.log)"
            fi
          }
          # THE ORDER IS THE CLAIM: a restart leg runs over the tree its drive leg wrote, and the hand-back leg
          # reads the GoTavern tree after the GoTavern restart leg has continued it.
          go_tree="$work/tree-gotavern"
          pinned_tree="$work/tree-pinned"
          rm -rf "$go_tree" "$pinned_tree"
          mkdir -p "$go_tree" "$pinned_tree"
          probe_args=($PROBE_PROFILE_ARGS)

          run_leg gotavern-drive node tests/browser/combination-journey-probe.mjs \
            --data-root "$go_tree" --report "$work/legs/go-drive.json" --nonce "cj-${GITHUB_RUN_ID:-local}" "${probe_args[@]}"
          run_leg pinned-drive node tests/browser/run-against-pinned.mjs combination-journey-probe.mjs -- \
            --data-root "$pinned_tree" --report "$work/legs/pinned-drive.json" --nonce "cj-${GITHUB_RUN_ID:-local}" "${probe_args[@]}"
          run_leg gotavern-restart node tests/browser/combination-journey-probe.mjs \
            --data-root "$go_tree" --report "$work/legs/go-restart.json" --nonce "cj-${GITHUB_RUN_ID:-local}" --after-restart "${probe_args[@]}"
          run_leg pinned-restart node tests/browser/run-against-pinned.mjs combination-journey-probe.mjs -- \
            --data-root "$pinned_tree" --report "$work/legs/pinned-restart.json" --nonce "cj-${GITHUB_RUN_ID:-local}" --after-restart "${probe_args[@]}"
          run_leg pinned-handback node tests/browser/run-against-pinned.mjs combination-journey-probe.mjs -- \
            --data-root "$go_tree" --report "$work/legs/pinned-handback.json" --nonce "cj-${GITHUB_RUN_ID:-local}" --handback "${probe_args[@]}"
          for report in go-drive pinned-drive go-restart pinned-restart pinned-handback; do
            if [ ! -s "$work/legs/$report.json" ]; then
              record_failure "the $report leg wrote no report"
            fi
          done
          echo "artefacts at $work/legs"

      - name: Consume the leg-failure counter
        # THE COUNTER WAS WRITTEN AND NEVER READ BEFORE THIS STEP: five legs could fail to drive and the job still
        # proceeded to the comparator, where the failures presented as a mismatch (or, worse, as NOT-OBSERVED guards
        # that a later reader could mistake for a narrowed run). A drive failure is a HARNESS FAILURE: fail here, by
        # name, before the comparator is asked to judge bytes that were never recorded.
        if: ${{ always() }}
        run: |
          set -euo pipefail
          failures='${{ steps.legs.outputs.failures }}'
          if [ -z "$failures" ]; then failures=1; fi
          if [ "$failures" != "0" ]; then
            echo "::error::HARNESS FAILURE: at least one leg failed to drive (leg-failure counter = $failures); the comparator's verdict would not be evidence"
            exit 1
          fi
          echo "leg-failure counter = $failures: every leg drove"

      - name: Compare the subjects
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/combination-journey"
          comparator_args=($COMPARATOR_PROFILE_ARGS)
          node tests/browser/compare-combination-journey.mjs \
            "$work/legs/go-drive.json" "$work/legs/pinned-drive.json" \
            --restart "$work/legs/go-restart.json" "$work/legs/pinned-restart.json" \
            --handback "$work/legs/pinned-handback.json" \
            "${comparator_args[@]}" \
            --out "$work/legs/comparison.json" 2>&1 | tee "$work/legs/compare.log"

      - name: Prove the gate has teeth
        # Runs the synthetic profile suite (no browser, each design-section-6 defect must fire a NAMED red) AND, when
        # the two real legs are supplied, the live mutation suite over them.
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/combination-journey"
          node tests/browser/combination-journey-gate-selftest.mjs \
            "$work/legs/go-drive.json" "$work/legs/pinned-drive.json" 2>&1 | tee "$work/legs/selftest.log"

      - name: Write the evidence identity
        # THE ARTIFACT MUST SAY WHICH TREE/PROFILE IT MEASURED (design section 9.3): kind, schemaVersion, head SHA,
        # pinned SHA, profile, tier, seed, extension tier, and the sha256 of every leg file it ships. Written even on a
        # failed run, so a red artifact is still attributable.
        if: ${{ always() }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/combination-journey"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const crypto = require("node:crypto");
            const work = process.env.RUNNER_TEMP + "/combination-journey";
            const labels = ["go-drive", "pinned-drive", "go-restart", "pinned-restart", "pinned-handback"];
            const documents = {};
            for (const label of labels) {
              const file = path.join(work, "legs", label + ".json");
              if (!fs.existsSync(file)) continue;
              documents[label] = { path: file, sha256: crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex") };
            }
            const identity = {
              kind: "combination-journey-evidence",
              schemaVersion: 1,
              headSha: process.env.GITHUB_SHA || null,
              pinnedSha: process.env.PINNED_BASELINE_COMMIT || null,
              profile: process.env.PROFILE || "none",
              tier: process.env.TIER || null,
              seed: process.env.SEED || null,
              extensionTier: process.env.EXTENSION_TIER || null,
              documents,
            };
            fs.mkdirSync(path.join(work, "legs"), { recursive: true });
            fs.writeFileSync(path.join(work, "legs", "identity.json"), JSON.stringify(identity, null, 2) + "\n");
            console.log(JSON.stringify(identity, null, 2));
          '

      - name: Verify the evidence identity (fail-closed)
        # A wrong head SHA, a wrong pinned SHA, a missing field or a digest that does not match the shipped bytes is a
        # REFUSAL (nonzero), never a warning. The verifier re-derives every document digest from the files on disk.
        if: ${{ always() }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/combination-journey"
          node tests/browser/compare-combination-journey.mjs --verify-artifact "$work/legs/identity.json"

      - name: Write the release evidence document (artifact root)
        if: ${{ always() && (inputs.profile || 'none') == 'e03e04' }}
        # C2 (M6b): the RELEASE verifier reads exactly release-evidence.json at the ARTIFACT ROOT
        # (scripts/release-governance/artifact-evidence.mjs:21); legs/identity.json is only the in-workflow
        # identity. Written even on a failed run, so a red artifact stays attributable and the gate reports WHY
        # (verdict, failed guards, missing legs, teeth result) rather than "missing evidence".
        env:
          LEG_FAILURES: ${{ steps.legs.outputs.failures }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/combination-journey"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const crypto = require("node:crypto");
            const work = process.env.RUNNER_TEMP + "/combination-journey";
            const labels = ["go-drive", "pinned-drive", "go-restart", "pinned-restart", "pinned-handback"];
            const readJson = (file) => { try { return JSON.parse(fs.readFileSync(file, "utf8")); } catch { return null; } };
            const readText = (file) => { try { return fs.readFileSync(file, "utf8"); } catch { return ""; } };
            const digest = (file) => crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
            const documents = {};
            for (const label of labels) {
              const file = path.join(work, "legs", label + ".json");
              if (!fs.existsSync(file)) continue;
              documents[label] = { path: "legs/" + label + ".json", sha256: digest(file) };
            }
            const comparison = readJson(path.join(work, "legs", "comparison.json"));
            const selftestLog = readText(path.join(work, "legs", "selftest.log"));
            const planted = /\[selftest\]\s+(\d+)\/(\d+) planted case\(s\) produced their NAMED red/.exec(selftestLog);
            const teethOk = Boolean(planted) && Number(planted[1]) === Number(planted[2]) && Number(planted[2]) > 0;
            const kitLog = readText(path.join(work, "e03e04-kit-selftest.log"));
            const kitOk = /RESULT: PASS/.test(kitLog);
            const failedGuards = Array.isArray(comparison?.failedGuards) ? comparison.failedGuards : [];
            const guards = comparison?.guards && typeof comparison.guards === "object" ? comparison.guards : {};
            const verdict = typeof comparison?.verdict === "string" ? comparison.verdict : null;
            const legFailures = Number(process.env.LEG_FAILURES ?? "1");
            const allRecorded = labels.every((label) => Boolean(documents[label]));
            const profile = process.env.PROFILE || "none";
            const ok = profile === "e03e04"
              && allRecorded
              && legFailures === 0
              && verdict === "match"
              && failedGuards.length === 0
              && teethOk
              && kitOk;
            const evidence = {
              schemaVersion: 1,
              kind: "combination-journey-evidence",
              headSha: process.env.GITHUB_SHA || null,
              pinnedSha: process.env.PINNED_BASELINE_COMMIT || null,
              profile,
              interactingScenario: profile === "e03e04",
              tier: process.env.TIER || null,
              seed: process.env.SEED || null,
              extensionTier: process.env.EXTENSION_TIER || null,
              run: { workflow: process.env.GITHUB_WORKFLOW || null, runId: process.env.GITHUB_RUN_ID || null, runAttempt: process.env.GITHUB_RUN_ATTEMPT || null },
              verdict,
              guards: { total: Object.keys(guards).length, failedCount: failedGuards.length, failed: failedGuards },
              documents,
              legs: {
                allRecorded,
                failures: legFailures,
                restartRecorded: Boolean(documents["go-restart"]) && Boolean(documents["pinned-restart"]),
                handbackRecorded: Boolean(documents["pinned-handback"]),
              },
              teeth: { ok: teethOk, planted: planted ? planted[1] + "/" + planted[2] : null, cases: planted ? Number(planted[2]) : null, log: "legs/selftest.log" },
              kit: { ok: kitOk, log: "e03e04-kit-selftest.log" },
              ok,
              notes: [
                "release-evidence.json is written at the ARTIFACT ROOT because the release verifier reads exactly that member (artifact-evidence.mjs:21).",
                "The release manifest requires profile=e03e04, interactingScenario=true and tier=full; a legacy profile=none run does not write this document and cannot satisfy the rail.",
                "ok is true only when all five legs were recorded, the comparator verdict is match with zero failed guards, the gate self-test observed every planted red, and the kit self-test passed.",
              ],
            };
            fs.writeFileSync(path.join(work, "release-evidence.json"), JSON.stringify(evidence, null, 2) + "\n");
            console.log(JSON.stringify(evidence, null, 2));
          '

      - name: Verify the release evidence (head SHA pinned, planted cases)
        if: ${{ always() && (inputs.profile || 'none') == 'e03e04' }}
        # C5 (M6b): the comparator artifact verifier checks the head SHA FORMAT only -- its planted case uses
        # "Z".repeat(40), which fails the hex regex rather than the equality -- so a WELL-FORMED wrong SHA would
        # pass it. The release verifier pins the embedded head SHA to the checked-out GITHUB_SHA
        # (artifact-evidence.mjs:131-133 does the same against the candidate). This step enforces that here, and
        # runs planted cases on EVERY run so the guard is proved able to fail instead of being decoration.
        env:
          EVIDENCE: ${{ runner.temp }}/combination-journey/release-evidence.json
          REQUIRE_EVIDENCE: '1'
        run: |
          set -euo pipefail
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const crypto = require("node:crypto");
            const work = process.env.RUNNER_TEMP + "/combination-journey";
            const labels = ["go-drive", "pinned-drive", "go-restart", "pinned-restart", "pinned-handback"];
            const sha = process.env.GITHUB_SHA;
            const pinned = process.env.PINNED_BASELINE_COMMIT;
            function validate(evidence, expectSha, verifyDigests) {
              const problems = [];
              if (!evidence || typeof evidence !== "object") { problems.push("evidence is not an object"); return problems; }
              if (evidence.schemaVersion !== 1) problems.push("schemaVersion is not 1");
              if (evidence.kind !== "combination-journey-evidence") problems.push("kind is not combination-journey-evidence");
              if (!/^[0-9a-f]{40}$/.test(String(evidence.headSha))) problems.push("headSha is not a 40-hex commit");
              if (evidence.headSha !== expectSha) problems.push("headSha does not equal the checked-out GITHUB_SHA");
              if (evidence.pinnedSha !== pinned) problems.push("pinnedSha does not equal PINNED_BASELINE_COMMIT");
              if (evidence.profile !== "e03e04") problems.push("profile is not e03e04");
              if (evidence.interactingScenario !== true) problems.push("interactingScenario is not true");
              if (evidence.tier !== "full") problems.push("tier is not full (the release rail requires full)");
              if (evidence.ok !== true) problems.push("ok is not true");
              if (evidence.legs?.allRecorded !== true) problems.push("legs.allRecorded is not true");
              if (evidence.teeth?.ok !== true) problems.push("teeth.ok is not true");
              if (evidence.kit?.ok !== true) problems.push("kit.ok is not true");
              for (const label of labels) {
                const doc = evidence.documents?.[label];
                if (!doc || typeof doc.sha256 !== "string" || !/^[0-9a-f]{64}$/.test(doc.sha256)) {
                  problems.push("documents." + label + " has no 64-hex digest");
                  continue;
                }
                if (verifyDigests) {
                  const file = path.join(work, "legs", label + ".json");
                  if (!fs.existsSync(file)) { problems.push("the " + label + " leg file is absent"); continue; }
                  const actual = crypto.createHash("sha256").update(fs.readFileSync(file)).digest("hex");
                  if (actual !== doc.sha256) problems.push("documents." + label + " does not match the shipped bytes");
                }
              }
              return problems;
            }
            const goodDocuments = Object.fromEntries(labels.map((label) => [label, { path: "legs/" + label + ".json", sha256: "a".repeat(64) }]));
            const good = {
              schemaVersion: 1,
              kind: "combination-journey-evidence",
              headSha: sha,
              pinnedSha: pinned,
              profile: "e03e04",
              interactingScenario: true,
              tier: "full",
              seed: "e03e04-alpha16",
              extensionTier: "full",
              verdict: "match",
              guards: { total: 100, failedCount: 0, failed: [] },
              documents: goodDocuments,
              legs: { allRecorded: true, failures: 0, restartRecorded: true, handbackRecorded: true },
              teeth: { ok: true, planted: "N/N", cases: 1, log: "legs/selftest.log" },
              kit: { ok: true, log: "e03e04-kit-selftest.log" },
              ok: true,
            };
            const planted = [];
            const expectAccept = (name, value) => planted.push([name, validate(value, sha, false).length === 0, validate(value, sha, false).join("; ")]);
            const expectRefuse = (name, value, needle) => {
              const problems = validate(value, sha, false);
              planted.push([name, problems.length > 0 && (!needle || problems.some((problem) => problem.includes(needle))), problems.join("; ")]);
            };
            expectAccept("planted-accepts-a-correct-document", good);
            expectRefuse("planted-refuses-a-well-formed-wrong-head-sha", { ...good, headSha: "b".repeat(40) }, "headSha");
            expectRefuse("planted-refuses-a-malformed-head-sha", { ...good, headSha: "Z".repeat(40) }, "headSha");
            expectRefuse("planted-refuses-a-legacy-profile-none-document", { ...good, profile: "none", interactingScenario: false }, "profile");
            expectRefuse("planted-refuses-a-fast-tier-document", { ...good, tier: "fast" }, "tier");
            expectRefuse("planted-refuses-an-ok-false-document", { ...good, ok: false }, "ok");
            expectRefuse("planted-refuses-missing-library-digests", { ...good, documents: { ...goodDocuments, "go-drive": undefined } }, "digest");
            let plantedFailures = 0;
            for (const [name, passed, detail] of planted) {
              console.log((passed ? "ok   " : "FAIL ") + name + (passed ? "" : " -- " + detail));
              if (!passed) plantedFailures += 1;
            }
            console.log("[planted] " + (planted.length - plantedFailures) + "/" + planted.length + " planted case(s) behaved as required");
            if (plantedFailures > 0) { console.error("::error::m6b/planted: the head-SHA verifier did not refuse what it must refuse"); process.exit(1); }
            if (process.env.REQUIRE_EVIDENCE === "1") {
              if (!fs.existsSync(process.env.EVIDENCE)) {
                console.error("::error::m6b/evidence: release-evidence.json is absent from the artifact root, so the release rail would read no document (fail closed)");
                process.exit(1);
              }
              const evidence = JSON.parse(fs.readFileSync(process.env.EVIDENCE, "utf8"));
              const problems = validate(evidence, sha, true);
              if (problems.length > 0) {
                for (const problem of problems) console.error("::error::m6b/evidence: " + problem);
                console.error("::error::m6b/evidence: the release evidence does not satisfy the rail (fail closed)");
                process.exit(1);
              }
              console.log("release evidence: headSha == GITHUB_SHA, profile=e03e04, interactingScenario=true, tier=full, digests match the shipped legs");
            }
          '

      - name: Upload reports, comparison, identity, release evidence and teeth logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # FIXED NAME: a reader (and the release verifier, and the scheduled aggregate) finds the evidence without
          # guessing a run-specific artifact name; release-evidence.json is written at the artifact ROOT because
          # scripts/release-governance/artifact-evidence.mjs reads exactly that member (EVIDENCE_MEMBER).
          name: combination-journey-evidence
          path: |
            ${{ runner.temp }}/combination-journey/legs/*.json
            ${{ runner.temp }}/combination-journey/legs/*.log
            ${{ runner.temp }}/combination-journey/extension-seed.json
            ${{ runner.temp }}/combination-journey/release-evidence.json
            ${{ runner.temp }}/combination-journey/e03e04-kit-selftest.log
          if-no-files-found: warn
          retention-days: 14
