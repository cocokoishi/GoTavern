name: zz gofmt diff (temporary)
on:
  push:
    branches: ['lane/docs-goal']
permissions:
  contents: read
jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Print the exact gofmt rewrite
        run: |
          gofmt -d internal/fixtures/documents_test.go || true
          echo "-----RENDERED FORM START-----"
          gofmt internal/fixtures/documents_test.go || true
          echo "-----RENDERED FORM END-----"