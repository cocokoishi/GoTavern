name: zz gofmt diff (temporary)
on:
  push:
    branches: ['lane/docs-goal']
permissions:
  contents: read
jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the docs gate only, findings to a file
        run: |
          set -uo pipefail
          mkdir -p /tmp/out
          go test ./internal/fixtures/ -run 'TestEvidenceLedgerIsConsistent' -count=1 -v > /tmp/out/ledger.log 2>&1 || true
          awk '/evidence ledger docs.goal-scorecard.md is inconsistent/{f=1;next} f&&/documents_test.go:/{exit} f' /tmp/out/ledger.log > /tmp/out/ledger-findings.txt || true
          wc -l /tmp/out/ledger-findings.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gate-diag
          path: /tmp/out/