name: zz gofmt diff (temporary)
on:
  push:
    branches: ['lane/docs-goal']
permissions:
  contents: read
jobs:
  show:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt + vet + the package tests
        run: |
          set -uo pipefail
          gofmt -l internal/fixtures/ || true
          mkdir -p /tmp/out
          gofmt internal/fixtures/documents_test.go > /tmp/out/formatted.go
          diff -u internal/fixtures/documents_test.go /tmp/out/formatted.go > /tmp/out/gofmt.diff || true
          go vet ./internal/fixtures/ > /tmp/out/vet.log 2>&1 || true
          go test ./internal/fixtures/ -run 'TestPinnedCommitStringsMatchThePin|TestDocumentsConsistencyGateCanGoRed|TestDocumentsEncodingGateCanGoRed|TestMojibakeSweepOfEveryDocument|TestEvidenceLedgerIsConsistent|TestEvidenceLedgerGateCanGoRed|TestCitationAncestryGateCanGoRed|TestDocumentGateCoversTheContract|TestAgentsRuleNumbersAreStable|TestAgentsRulesStayShortEnoughToStayNumbered|TestAgentsRuleGateCanGoRed' -count=1 -v > /tmp/out/test.log 2>&1 || true
          tail -5 /tmp/out/vet.log; grep -E '^(--- )?(FAIL|PASS|ok)' /tmp/out/test.log | head -30
      - uses: actions/upload-artifact@v4
        with:
          name: gate-diag
          path: /tmp/out/