name: GoTavern drop-in qualification

# THE USER'S OWN PATH, ON EVERY PUSH TO MAIN, AGAINST THE BINARY THAT PUSH BUILT.
#
# WHY THIS WORKFLOW EXISTS. `scripts/qualify-dropin.sh` -- unpack a release-shaped archive into a STOCK
# SillyTavern tree and prove it boots there -- existed and worked, but only ONE workflow ran it
# (`release-qualification.yml`, job `qualify-dropin-linux`), and only on a `v*` tag or a manual dispatch.
# So it was answerable only for a release someone had already decided to cut, and the last time it ran it
# was measuring an archive built from an older commit: run 40153128342, recorded in
# docs/dropin-qualification.md. Between that run and the commit this gate was written for, three P0 fixes
# landed (P0-A provider transport, P0-B unbounded startup waits, P0-C ambiguous auto-update resolution),
# and NONE of them could be shown to keep the drop-in path working, because nothing re-ran it. AGENTS.md
# 23, 34 and 38 make the shipped shape, in a stock tree, the thing a release claim rests on; a gate that
# runs only when a release is already being cut cannot fail a commit.
#
# WHAT IT DOES
#   1. builds the linux/amd64 binary FROM THIS COMMIT and assembles an archive around it with
#      `release.yml`'s build-job staging (gotavern, LICENSE, THIRD_PARTY_NOTICES.txt, start.sh,
#      src/tokenizers, BUILD-INFO.txt) and release.yml's own packer (`tar -czf ... -C stage .`);
#   2. asserts the archive's LAYOUT by name and by mode before anything boots, so a staging change in
#      release.yml cannot silently stop being what this gate tests;
#   3. runs `scripts/qualify-dropin.sh` for BOTH layouts it supports and BOTH config modes it supports:
#        cwd-root     CWD = the tree      (the documented "put the binary in your directory" path)
#        foreign-cwd  binary in the tree, CWD elsewhere
#      and, for each, `--config full` (the pristine pinned config) and `--config minimal` (a used,
#      trimmed config, which is the only input that exercises the boot-time config rewrite, P0-C's
#      mechanism);
#   4. each scenario builds a stock tree from the vendored pinned baseline, unpacks the archive over it,
#      boots with a HARD 30 s readiness bound that POLLS `/version` (never a fixed sleep: AGENTS 33),
#      runs the API smoke through the real CSRF handshake, asserts boot mutated no extension repository
#      and no pre-existing user file, stops gracefully, RESTARTS, and re-reads the chat;
#   5. on any failure the server log, the diffs and the built tree are uploaded, so a red run names its
#      own cause instead of reporting an exit status;
#   6. and jobs `windows-inputs` + `dropin-windows` do the same for the WINDOWS asset, through the
#      archive's own `Start.cmd`, with a PowerShell twin of the shell harness. See "WHAT THE SECOND JOB
#      ADDS" below.
#
# WHAT THE SECOND JOB ADDS: THE WINDOWS ARCHIVE, WHICH HAD NEVER BEEN EXECUTED.
#   release.yml publishes two Windows assets and a `Start.cmd`, and until job `dropin-windows` existed no
#   gate in this repository had opened one. The Linux harness's own "what this does NOT cover" block named
#   the missing piece as "a Windows runner and a PowerShell twin". Both now exist:
#     windows-inputs  (ubuntu)  builds the WINDOWS archive with release.yml's own staging and packer, and
#                               builds the stock tree with scripts/build-stock-tree.sh ONCE, recording a
#                               path+sha256 manifest and its digest;
#     dropin-windows  (windows) downloads both, VERIFIES the tree it extracted is the tree the Linux job
#                               measured (file count, every per-file digest, the manifest's digest), lays the
#                               archive over it, and boots it with the ARCHIVE'S OWN `Start.cmd` under a hard
#                               30 s readiness bound that polls GET /version.
#   Three scenarios run: start-cmd/full, start-cmd/minimal (the only input that exercises the boot-time
#   config rewrite, i.e. P0-C's mechanism, now measured on NTFS) and foreign-cwd/full (the binary run from a
#   directory that is not the tree, which `Start.cmd` cannot do because it cds).
#
# WHY THE WINDOWS JOBS LIVE IN THIS FILE RATHER THAN IN THEIR OWN. The Windows job consumes two artifacts
# that must be built from THE SAME COMMIT as the Linux scenarios: the archive (this commit's binary) and the
# stock tree (this commit's pinned baseline). `needs:` inside one workflow makes that a graph GitHub
# enforces; two workflows would make it a convention, and a convention is what silently tests a different
# tree. The header's separate-workflow argument (a distinct concurrency group and a distinct timeout) still
# holds for the Windows job: it carries its own `timeout-minutes` sized from a measured run.
#
# WHAT THIS DOES NOT COVER, stated so a green is not read as more (the same list is in
# docs/dropin-qualification.md):
#   - PACKAGING FIDELITY. The archive is assembled from release.yml's staging steps, but it is NOT the
#     release workflow's artifact: no `checksums.txt`, no upload, no publish, no tag-derived version
#     string (`-X main.version` names the COMMIT, so BUILD-INFO and `gotavern version` name the tree the
#     gate measured rather than a tag that may never be cut), and only the linux/amd64 and windows/amd64
#     assets of the six canonical ones. `release.yml` remains the only producer of shipped bytes and
#     `release-install-smoke.yml` remains the gate that always has them. A green here is evidence about
#     the ARCHIVE LAYOUT plus the BINARY, not about the release pipeline.
#   - The windows/ARM64 asset. The Windows runner is x64, and that asset's arch is a one-line matrix row.
#   - GRACEFUL SHUTDOWN ON WINDOWS. SIGTERM has no Windows equivalent that reaches a console application,
#     so `scripts/qualify-dropin.ps1` stops the server with `taskkill /T /F` and SAYS SO: the restart it
#     then measures is a crash-recovery restart (a stronger persistence claim, and the stale-lock state
#     docs/startup-state-machine.md lists as untested), but the `signal.Notify` -> `running.Close` path is
#     not exercised there. Named, not implied.
#   - A GOROUTINE DUMP ON WINDOWS. Windows has no SIGQUIT and Go maps CTRL_C_EVENT/CTRL_BREAK_EVENT to
#     `os.Interrupt`, so a hung Windows boot can only be diagnosed from the log and the binary's own stage
#     trace. The ps1 prints how many stage lines the boot produced on every run and says so when it is 0.
#   - Updater EGRESS is sampled (two socket samples), not proven absent; the MUTATION half of P0-C is
#     proven exactly by recursive hashes and a `git status` per extension repository.
#   - `install.sh` is not executed here: `release-qualification.yml` runs the installer against a
#     loopback mirror, and duplicating it in a per-push gate would pay for the same claim twice.
#   - `install.ps1` is not executed here: `scripts/qualify-install-windows.ps1` runs it on a Windows runner
#     in `release-install-smoke.yml`, for the installer's own Windows-only behaviour.
#
# WHY A SEPARATE WORKFLOW RATHER THAN A JOB IN ci.yml. Two reasons, both about the gate being useful:
#   * ci.yml triggers on `main` only (AGENTS.md "Working mode" removed the pull_request trigger, and no
#     task pushes anything but `lane/**` before the lead merges). A gate that first runs on the merge
#     commit can never be shown RED before it judges anything, so its teeth would be unprovable without
#     poisoning `main` -- the exact shape of "a gate that cannot fail is decoration".
#   * `verify` is MEASURED at ~3.6 min with a 30-minute bound (its own comment). This job builds FOUR
#     stock trees and boots a server EIGHT times; sharing verify's bound would let one wedged boot spend
#     the budget of thirteen unrelated checks and report "verify failed".
# It therefore carries its own concurrency group and its own `timeout-minutes`, sized from the measured
# run quoted on the job below.
#
# TEETH. A green here means the four scenarios ran; whether they CAN fail was demonstrated by mutating
# them (see docs/dropin-qualification.md "Can this gate fail?") with the red run ids named there.

on:
  push:
    branches:
      - main
      - 'lane/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dropin-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dropin-current-head:
    runs-on: ubuntu-latest
    # SIZED FROM THE MEASURED RUN, and the measurement keeps its run id in docs/dropin-qualification.md.
    # Measured on 40173675219: 49 s door to door for the whole job -- checkout + toolchain 14 s, the archive
    # build 17 s, and the four drop-in scenarios 4 s, 3 s, 3 s and 2 s. Fifteen minutes is ~18x that. The
    # variance a bound must absorb here is a COLD runner (module and toolchain download on a cache miss)
    # and a slower disk for the four stock-tree builds -- NOT a slow boot: a boot that does not become ready
    # fails at the harness's own 30 s readiness poll, which is never widened, and red run 40174700084 shows
    # it doing exactly that with a goroutine dump naming the blocked frames (AGENTS 33). A wedged step fails
    # this job instead of holding a runner for GitHub's 6-hour default.
    #
    # RAISED 15 -> 25 BY THE Q21 PACKAGED HAND-BACK, and the size is measured rather than guessed. This job's
    # own four scenarios are ~49 s door to door (run 40173675219, quoted above). The hand-back adds ONE
    # driver, measured twice:
    #   * LOCAL DRY RUN against a release-shaped archive on a contended Windows host (the slowest environment
    #     this step will ever run in): GoTavern half 41.9 s, name/tree extraction 1.1 s, pinned half 139.7 s,
    #     judge 1.1 s = 183.8 s for the new steps, verdict `match`;
    #   * CI on ubuntu, the same driver: 63-65 s per iteration over 20 iterations (Browser differential run
    #     41201570520).
    # The one-off setup it needs -- pinned checkout, node, cached npm installs, Playwright apt packages on a
    # cache hit -- is Browser differential's own setup, measured there at well under a minute when its three
    # caches hit. The hand-back's cost is dominated by pinned's cold frontend compile, whose budget is the
    # probe's own PINNED_READY_MS=300000 (a real readiness poll, never a sleep). 25 = the 15 min this job was
    # sized at plus the LOCAL measured upper bound plus cold-cache/variance headroom; a wedged leg still fails
    # at the probe's own deadlines, not at this bound.
    timeout-minutes: 25
    env:
      # THE PIN IS THE AUTHORITY FILE'S VALUE, named once for the cache keys and the pinned checkout exactly
      # as browser-differential.yml names it. The composite action ASSERTS the value it is given against
      # upstream/SILLYTAVERN_COMMIT, so a transcription error fails there instead of measuring another oracle.
      PINNED_BASELINE_COMMIT: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # =============================================================================================
      # Q21 HAND-BACK INPUTS.
      #
      # THE HAND-BACK BOOTS THE ORIGINAL PINNED NODE SERVER over a tree the ARCHIVE's binary wrote, so this
      # job needs what the four drop-in scenarios do not: the pinned checkout, its node_modules, the browser
      # harness and a Playwright browser. They are added HERE rather than in a separate workflow so the
      # archive, the pinned tree and the hand-back all come from ONE commit and ONE build.
      #
      # NONE OF THIS BOOTS A SERVER, and every server the hand-back does boot disables the desktop launch:
      # tests/browser/q21-data-handback.mjs passes `--browserLaunchEnabled false` at both of its GoTavern
      # spawn sites, run-against-pinned.mjs passes it to the pinned server, and the repository's source gate
      # (tests/browser/browser-launch-gate.mjs) fails if either stops doing so.
      # =============================================================================================
      - uses: ./.github/actions/checkout-pinned
        with:
          commit: ${{ env.PINNED_BASELINE_COMMIT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0

      # THE SAME THREE CACHES AS Browser differential, with the same keys, so this job reuses the installs
      # that workflow already proved rather than resolving a second dependency graph.
      - name: Cache the pinned server's node_modules for the hand-back
        id: q21-cache-pinned-modules
        uses: actions/cache@v4
        with:
          path: .reference/SillyTavern/node_modules
          key: ${{ runner.os }}-pinned-node-modules-${{ env.PINNED_BASELINE_COMMIT }}-${{ hashFiles('.reference/SillyTavern/package-lock.json') }}

      - name: Cache the browser harness for the hand-back
        id: q21-cache-harness-modules
        uses: actions/cache@v4
        with:
          path: tests/browser/node_modules
          key: ${{ runner.os }}-harness-node-modules-${{ hashFiles('tests/browser/package-lock.json') }}

      - name: Cache the Playwright browser for the hand-back
        id: q21-cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('tests/browser/package-lock.json') }}

      - name: Install the pinned server's dependencies for the hand-back
        # A CACHE HIT SKIPS THE INSTALL, and the log says which branch ran so the persistence is visible
        # rather than implied (AGENTS.md "Persist expensive CI work").
        run: |
          set -euo pipefail
          if [ "${{ steps.q21-cache-pinned-modules.outputs.cache-hit }}" = "true" ]; then
            echo "pinned node_modules: CACHE HIT -- npm ci SKIPPED"
          else
            echo "pinned node_modules: cache MISS -- installing from the pinned checkout's own manifest"
            cd .reference/SillyTavern
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          fi

      - name: Install the browser harness for the hand-back
        run: |
          set -euo pipefail
          if [ "${{ steps.q21-cache-harness-modules.outputs.cache-hit }}" = "true" ]; then
            echo "tests/browser/node_modules: CACHE HIT -- npm ci SKIPPED"
          else
            echo "tests/browser/node_modules: cache MISS -- npm ci"
            ( cd tests/browser && npm ci --no-audit --no-fund )
          fi
          if [ "${{ steps.q21-cache-playwright.outputs.cache-hit }}" = "true" ]; then
            # THE BROWSER BUNDLE IS NOT THE OS PACKAGES: `install --with-deps` is download + apt, and a cache
            # hit covers only the download, so the apt half still runs (browser-differential records why).
            echo "playwright chromium: CACHE HIT -- download SKIPPED, OS packages still ensured"
            ( cd tests/browser && npx playwright install-deps chromium )
          else
            echo "playwright chromium: cache MISS -- downloading the browser and its OS packages"
            ( cd tests/browser && npx playwright install --with-deps chromium )
          fi

      - name: Prove the hand-back harness cannot open a desktop browser (source gate)
        # THE GATE THE OPERATOR'S DESKTOP WINDOW PRODUCED. It scans tests/browser/**/*.mjs and fails if any
        # GoTavern/pinned server spawn omits `--browserLaunchEnabled false` or any Playwright launch omits an
        # explicit `headless: true`. It needs no browser and no server, so it runs here BEFORE anything is
        # built or booted: a harness regression fails this packaged gate in seconds, not after the archive.
        run: node tests/browser/browser-launch-gate.mjs

      - name: Assemble the release-shaped archive from THIS commit
        id: package
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: amd64
        run: |
          set -eu
          commit="$(git rev-parse HEAD)"
          short="$(printf '%s' "$commit" | cut -c1-12)"
          rm -rf stage dist-dropin
          mkdir -p stage dist-dropin
          # release.yml's `Build the release binary`, with a COMMIT-derived version string instead of a
          # tag: `gotavern version` and BUILD-INFO.txt must name the tree this gate measured.
          go build -trimpath -ldflags="-s -w -X main.version=dropin-${short}" \
            -o stage/gotavern ./cmd/gotavern
          # release.yml's `Assemble the archive contents`: binary + licence + notices + launcher, and the
          # tokenizer tree at src/tokenizers, which upstream reads by that relative path
          # (src/endpoints/tokenizers.js:251-254). Not shipped here: anything the release does not ship.
          cp LICENSE THIRD_PARTY_NOTICES.txt start.sh stage/
          mkdir -p stage/src
          cp -R upstream/tokenizers stage/src/tokenizers
          {
            printf 'GoTavern drop-in qualification archive\n'
            printf 'commit %s\n' "$commit"
            printf 'target linux/amd64\n'
            printf '\n'
            printf 'This is NOT a published release asset. It is assembled in this run, from the commit\n'
            printf 'above, with release.yml build-job staging and release.yml own packer (tar -czf),\n'
            printf 'so that the drop-in gate can execute a release-SHAPED artifact on every push.\n'
            printf '\n'
            ./stage/gotavern version || true
          } > stage/BUILD-INFO.txt
          # release.yml asserts these too, and a drop-in tree is precisely where such a file does damage.
          test ! -e stage/config.yaml
          test ! -e stage/data
          test ! -e stage/extensions
          chmod +x stage/gotavern stage/start.sh
          # release.yml's `Create the canonical archive`, same invocation, different output name so this
          # artifact cannot be mistaken for the shipped one.
          ( cd stage && tar -czf ../dist-dropin/gotavern-linux-amd64-dropin.tar.gz . )
          test -s dist-dropin/gotavern-linux-amd64-dropin.tar.gz
          ls -l dist-dropin/gotavern-linux-amd64-dropin.tar.gz
          sha256sum dist-dropin/gotavern-linux-amd64-dropin.tar.gz
          echo "archive=${PWD}/dist-dropin/gotavern-linux-amd64-dropin.tar.gz" >> "$GITHUB_OUTPUT"
          echo "commit=${commit}" >> "$GITHUB_OUTPUT"

      - name: Assert the archive's LAYOUT and modes before anything boots
        # THE ARCHIVE IS THE INPUT TO EVERY CLAIM BELOW, so its shape is asserted rather than assumed. The
        # expected member list is a TRANSCRIPTION of release.yml's build-job staging, which is the one
        # drift surface this step has: if release.yml starts staging something else, this gate is testing
        # a layout that no longer ships, and the failure says so and names both lists.
        run: |
          set -eu
          layout="$(mktemp -d)"
          tar -xzf "${{ steps.package.outputs.archive }}" -C "$layout"
          actual="$( cd "$layout" && find . -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort | tr '\n' ' ' )"
          expected="BUILD-INFO.txt LICENSE THIRD_PARTY_NOTICES.txt gotavern src start.sh "
          if [ "$actual" != "$expected" ]; then
            echo "the archive top level is not release.yml's staging:" >&2
            echo "  expected: ${expected}" >&2
            echo "  actual:   ${actual}" >&2
            echo "The expected list is transcribed from release.yml build-job staging (binary, LICENSE," >&2
            echo "THIRD_PARTY_NOTICES.txt, launcher, BUILD-INFO.txt, src/tokenizers). If release.yml changed," >&2
            echo "this gate is measuring a layout that does not ship: update the staging AND this list." >&2
            exit 1
          fi
          test -x "$layout/gotavern" || { echo "the archive's gotavern is not executable" >&2; exit 1; }
          test -x "$layout/start.sh" || { echo "the archive's start.sh is not executable" >&2; exit 1; }
          # The tokenizer tree is compared against the vendored baseline, not against a typed constant:
          # a number here would be a second copy of a fact the tree already holds.
          archived="$( cd "$layout/src/tokenizers" && find . -type f | wc -l )"
          baseline="$( cd upstream/tokenizers && find . -type f | wc -l )"
          if [ "$archived" -ne "$baseline" ]; then
            echo "the archive carries ${archived} tokenizer file(s); the vendored baseline has ${baseline}" >&2
            exit 1
          fi
          echo "archive layout: ${actual}"
          echo "tokenizer files: ${archived} (equal to upstream/tokenizers)"
          rm -rf "$layout"

      - name: 'Smoke 0/4 -- the ARCHIVE binary against a LONG-LIVED user directory'
        # THE SMOKE TEST A USER ACTUALLY RUNS, done by this job instead of by a person at a keyboard.
        # Every scenario below starts from a freshly seeded tree, so none of them can answer "does my
        # existing SillyTavern directory still work after I swap the backend". This step extracts the
        # SAME archive the four scenarios use, points the long-lived-tree test at the binary INSIDE it,
        # and lets that test build a tree shaped like a used install -- a V3 card with a real chara
        # chunk, a chat history under chats/<avatar>/ with twelve turns, a 30-entry world book, a
        # 40-prompt preset in use, extension state, persona, backgrounds with metadata, a backup and two
        # files the product has no opinion about -- then asserts, through the routes the pinned frontend
        # builds: the card's own bytes, its thumbnail, the character list, every planted chat message,
        # every world entry, the settings that carry the preset and the extension state, the background
        # list and body, the background thumbnail, the persona list and the persona avatar; and that
        # EVERY planted file is byte-identical after the boot.
        #
        # -count=1 because Go answers `ok (cached)` for a test whose inputs did not change, and a cached
        # pass is not evidence that the archive booted (AGENTS.md verification rule 1).
        run: |
          set -eu
          smoke="$(mktemp -d)"
          tar -xzf "${{ steps.package.outputs.archive }}" -C "$smoke"
          test -x "$smoke/gotavern" || { echo "the archive's gotavern is not executable" >&2; exit 1; }
          echo "smoking the archive's own binary: $smoke/gotavern"
          GOTAVERN_BINARY="$smoke/gotavern" go test ./tests/e2e \
            -run '^TestLongLivedTreeBootsAndServesItsAssets$' -count=1 -v
          rm -rf "$smoke"

      - name: 'Drop-in qualification 1/4 -- cwd-root, pristine pinned config'
        # The documented path: the binary sits in the SillyTavern directory, CWD is that directory, and
        # the API must return the USER'S OWN seeded character, chat and settings.
        run: |
          set -eu
          start=$(date +%s)
          sh scripts/qualify-dropin.sh --archive "${{ steps.package.outputs.archive }}" \
            --layout cwd-root --config full --port 8797
          echo "scenario cwd-root/full passed in $(( $(date +%s) - start ))s"

      - name: 'Drop-in qualification 2/4 -- cwd-root, a USED (trimmed) config.yaml'
        # The tree a user actually has after running SillyTavern once. This is the only input that makes
        # startup merge the pinned defaults back in, which is P0-C's mechanism: the rewrite must keep the
        # user's `extensions.autoUpdate: false`, not adopt the pinned `true`.
        run: |
          set -eu
          start=$(date +%s)
          sh scripts/qualify-dropin.sh --archive "${{ steps.package.outputs.archive }}" \
            --layout cwd-root --config minimal --port 8798
          echo "scenario cwd-root/minimal passed in $(( $(date +%s) - start ))s"

      - name: 'Drop-in qualification 3/4 -- foreign CWD, pristine pinned config'
        # Launched from somewhere else, with the binary in the tree. Measured behaviour (not derivation):
        # the runtime root FOLLOWS THE TREE, so the user still gets their data -- and the run must not
        # modify or delete any pre-existing file while doing it.
        run: |
          set -eu
          start=$(date +%s)
          sh scripts/qualify-dropin.sh --archive "${{ steps.package.outputs.archive }}" \
            --layout foreign-cwd --config full --port 8799
          echo "scenario foreign-cwd/full passed in $(( $(date +%s) - start ))s"

      - name: 'Drop-in qualification 4/4 -- foreign CWD, a USED (trimmed) config.yaml'
        # The fourth combination. Kept because it is the only one where a TRIMMED config meets a foreign
        # CWD: the config is rewritten by the merge and the pre-existing-file assertions still apply.
        run: |
          set -eu
          start=$(date +%s)
          sh scripts/qualify-dropin.sh --archive "${{ steps.package.outputs.archive }}" \
            --layout foreign-cwd --config minimal --port 8800
          echo "scenario foreign-cwd/minimal passed in $(( $(date +%s) - start ))s"

      - name: 'Hand the PACKAGED tree back to pinned Node (Q21) -- AGENTS.md 38'
        id: q21
        # THE CLAIM THE OTHER SCENARIOS CANNOT MAKE. They boot the archive over a planted tree and assert the
        # product READS a user's data; none asks whether the ORIGINAL server opens a tree THE PRODUCT WROTE and
        # keeps the same conversation running. This runs the SAME committed driver the Browser differential
        # runs (tests/browser/q21-data-handback.mjs; judge tests/oracle/q21/judge-handback.mjs), with
        # GOTAVERN_BINARY pointed at the binary INSIDE THE ARCHIVE THIS JOB BUILT, and the pinned half booted by
        # run-against-pinned.mjs over the SAME data root.
        #
        # THE ARCHIVE IS THE INPUT, NOT THE WORKING TREE: tar-extracting it and running `<archive>/gotavern`
        # makes the step exercise the release-shaped layout -- including `src/tokenizers` beside the binary,
        # which is where the runtime resolves exact tokenization from -- rather than a `go build` output that a
        # real user never has.
        #
        # NO SLEEP READINESS: both halves poll their server's own `/version` (bounded), and the probe's waits
        # are the named conditions recorded in `report.conditions`. No desktop browser can be launched: the
        # probe passes `--browserLaunchEnabled false` at both GoTavern boots and run-against-pinned passes it to
        # pinned, so this step is also what keeps tests/browser/browser-launch-gate.mjs satisfied.
        #
        # THE STEP ALWAYS EXITS 0 AND RECORDS $failures; the judge step below is the gate. That keeps the two
        # failure classes apart -- "a leg could not be driven" (counter) and "the evidence refuses the claim"
        # (judge) -- instead of losing the judge when the first leg crashes.
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/dropin-q21"
          rm -rf "$work"; mkdir -p "$work/legs" "$work/binary"
          tar -xzf "${{ steps.package.outputs.archive }}" -C "$work/binary"
          test -x "$work/binary/gotavern" || { echo "::error::the packaged archive has no executable gotavern"; exit 1; }
          test -d "$work/binary/src/tokenizers" || { echo "::error::the packaged archive has no src/tokenizers beside the binary"; exit 1; }
          tree="$work/tree"
          rm -rf "$tree"; mkdir -p "$tree"
          failures=0
          started=$(date +%s)
          if GOTAVERN_BINARY="$work/binary/gotavern" node tests/browser/q21-data-handback.mjs \
              --data-root "$tree" --report "$work/legs/q21-gotavern.json"; then
            echo "the GoTavern half wrote its tree with the packaged binary in $(( $(date +%s) - started ))s"
          else
            echo "::error::the GoTavern half of the packaged hand-back failed"
            failures=$((failures + 1))
          fi
          node --input-type=commonjs -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); fs.writeFileSync(process.argv[2], JSON.stringify(r.writtenTree ?? {}))" "$work/legs/q21-gotavern.json" "$work/legs/q21-tree.json"
          Q21_NAME=$(node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); process.stdout.write(r.stagedCard?.ownName ?? '')" "$work/legs/q21-gotavern.json")
          started=$(date +%s)
          # PINNED_READY_MS is raised from a measurement, not for comfort: a cold pinned boot on a fresh runner
          # spends its readiness budget compiling the frontend, and the 90 s default expires while the process is
          # healthy (the Browser differential records the same measurement on the same code path).
          if PINNED_READY_MS="${PINNED_READY_MS:-300000}" Q21_CHARACTER_NAME="$Q21_NAME" Q21_EXPECTED_TREE="$work/legs/q21-tree.json" \
              node tests/browser/run-against-pinned.mjs q21-data-handback.mjs -- --data-root "$tree" --report "$work/legs/q21-pinned.json"; then
            echo "pinned Node opened and continued the tree the packaged binary wrote ($Q21_NAME) in $(( $(date +%s) - started ))s"
          else
            echo "::error::pinned Node could not continue the tree the packaged binary wrote"
            failures=$((failures + 1))
          fi
          echo "q21_failures=$failures" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Judge the packaged hand-back
        # A LEG THAT PRODUCED NO REPORT CANNOT SUPPORT A CLAIM, and a leg that judged zero rows is not a match:
        # judge-handback.mjs names the rows each direction requires, refuses `match` on an all-zero count and
        # exits 2 when a report is missing. Both directions are required (Go-writes -> pinned reads -> pinned
        # writes -> Go reads, and pinned-writes -> Go reads -> Go writes -> pinned reads).
        #
        # `always()`: the hand-back step always exits 0, but an EARLIER scenario failure (or a crash before the
        # reports are written) must still produce a red HERE rather than a skipped step that reads as "not
        # judged". The failed condition, if any, is printed by name with what it observed.
        if: always()
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/dropin-q21"
          status=0
          if [ "${{ steps.q21.outcome }}" != "success" ]; then
            echo "::error::the hand-back step did not complete (outcome=${{ steps.q21.outcome }}), so nothing is claimed about the packaged hand-back"
            status=1
          elif [ "${{ steps.q21.outputs.q21_failures }}" != "0" ]; then
            echo "::error::a packaged hand-back leg failed to complete; the reports are judged below"
            status=1
          fi
          for leg in gotavern pinned; do
            report="$work/legs/q21-$leg.json"
            if [ ! -f "$report" ]; then
              echo "::error::the $leg half produced no report, so nothing is claimed about the hand-back"
              status=1
              continue
            fi
            node -e "const fs=require('fs'); const r=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); const leg=process.argv[2]; console.log(leg+': '+(r.steps||[]).map(s=>(s.ok?'ok ':'FAIL ')+s.name).join(', ')); const bad=(r.conditions||[]).filter(c=>c.ok!==true); for (const c of bad) console.error(leg+': CONDITION FAILED '+c.name+' -- waited for '+c.waitedFor+'; observed '+JSON.stringify(c.observed).slice(0,900)); if (r.failure) { console.error(leg+': '+r.failure); process.exit(1) }" "$report" "$leg" || status=1
          done
          if [ -f "$work/legs/q21-gotavern.json" ] && [ -f "$work/legs/q21-pinned.json" ]; then
            node tests/oracle/q21/judge-handback.mjs \
              "$work/legs/q21-gotavern.json" "$work/legs/q21-pinned.json" \
              --out "$work/legs/q21-verdict.json" || { echo "::error::the packaged hand-back judge refused or found a mismatch"; status=1; }
          else
            echo "::error::the hand-back judge cannot run without both leg reports"
            status=1
          fi
          exit "$status"

      - name: Report failure context
        # The harness prints its own server log and goroutine dump; what it cannot show is the tree it
        # built and which scenario left what behind, which is what a reader needs when the FIXTURE is
        # the suspect.
        if: failure()
        run: |
          set -u
          echo "::group::the archive under test"
          ls -l dist-dropin 2>/dev/null || echo "(no archive was produced)"
          sha256sum dist-dropin/*.tar.gz 2>/dev/null || true
          echo "::endgroup::"
          echo "::group::drop-in work trees (failure keeps the tree; success removes it)"
          for work in .dropin-work/*; do
            [ -d "$work" ] || continue
            echo "--- ${work} ---"
            find "$work" -maxdepth 2 -mindepth 1 -printf '%y %p\n' 2>/dev/null | LC_ALL=C sort | head -80 || true
          done
          echo "::endgroup::"
          echo "::group::diffs the harness wrote"
          for diff in .dropin-work/*/*.diff; do
            [ -f "$diff" ] || continue
            echo "--- ${diff} ---"
            tail -120 "$diff" || true
          done
          echo "::endgroup::"

      - name: Upload the evidence of a failing run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dropin-failure-evidence
          path: |
            .dropin-work/*/server.log
            .dropin-work/*/*.diff
            .dropin-work/*/*.before
            .dropin-work/*/*.after
            ${{ runner.temp }}/dropin-q21/**
          if-no-files-found: warn
          retention-days: 7

  # ---------------------------------------------------------------------------------------------------
  # THE WINDOWS HALF. See "WHAT THE SECOND JOB ADDS" and "WHY THE WINDOWS JOBS LIVE IN THIS FILE" above.
  # ---------------------------------------------------------------------------------------------------
  windows-inputs:
    # EVERYTHING PLATFORM-DEPENDENT IS BUILT HERE, ON LINUX, EXACTLY AS release.yml BUILDS IT. The shipped
    # Windows asset is a `GOOS=windows` cross-compile produced on an ubuntu runner and zipped with `zip -qr`;
    # compiling it on the Windows runner instead would gate a build that is not the one users download.
    runs-on: ubuntu-latest
    # MEASURED on the runs recorded in docs/dropin-qualification.md: 1-2 min for the cross-compile, the
    # archive assembly, one stock-tree build (a ~1000-file copy) and the manifest. Fifteen minutes is ~8x,
    # and the variance a bound must absorb is a COLD module cache, not a slow step.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Assemble the release-shaped WINDOWS archive from THIS commit
        id: package
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        run: |
          set -eu
          commit="$(git rev-parse HEAD)"
          short="$(printf '%s' "$commit" | cut -c1-12)"
          rm -rf stage-win dist-dropin-win windows-inputs
          mkdir -p stage-win dist-dropin-win windows-inputs
          # release.yml's `Build the release binary`, windows row: the same `suffix` rule and ldflags, with a
          # COMMIT-derived version string so `gotavern version` and BUILD-INFO.txt name the tree measured.
          go build -trimpath -ldflags="-s -w -X main.version=dropin-${short}" \
            -o stage-win/gotavern.exe ./cmd/gotavern
          # release.yml's `Assemble the archive contents`, windows row -- LAUNCHER=Start.cmd is what makes
          # the launcher part of the artifact this job opens.
          cp LICENSE THIRD_PARTY_NOTICES.txt Start.cmd stage-win/
          mkdir -p stage-win/src
          cp -R upstream/tokenizers stage-win/src/tokenizers
          # release.yml also appends `./stage/gotavern* version || true` here. On ubuntu that cannot
          # execute a .exe, so it writes a bash error into the file; this archive describes itself instead.
          # Nothing in this gate reads BUILD-INFO.txt, and the difference is named rather than hidden.
          {
            printf 'GoTavern drop-in qualification archive (windows/amd64)\n'
            printf 'commit %s\n' "$commit"
            printf 'target windows/amd64\n'
            printf '\n'
            printf 'This is NOT a published release asset. It is assembled in this run, from the commit\n'
            printf 'above, with release.yml build-job staging and release.yml own packer (zip -qr).\n'
          } > stage-win/BUILD-INFO.txt
          # release.yml asserts these too, and a drop-in tree is precisely where such a file does damage.
          test ! -e stage-win/config.yaml
          test ! -e stage-win/data
          test ! -e stage-win/extensions
          # release.yml's `Create the canonical archive`, windows branch: same invocation, different output
          # name so this artifact cannot be mistaken for the shipped one.
          ( cd stage-win && zip -qr ../dist-dropin-win/gotavern-windows-amd64-dropin.zip . )
          test -s dist-dropin-win/gotavern-windows-amd64-dropin.zip
          ls -l dist-dropin-win/gotavern-windows-amd64-dropin.zip
          sha256sum dist-dropin-win/gotavern-windows-amd64-dropin.zip

      - name: Assert the WINDOWS archive's layout, bytes and launcher before anything boots
        # THE ARCHIVE IS THE INPUT TO EVERY CLAIM THE WINDOWS JOB MAKES, so its shape is asserted HERE, on
        # the runner that builds it, before a Windows runner spends time on it. The expected member list is
        # a TRANSCRIPTION of release.yml's windows matrix row, which is the one drift surface this step
        # has: if release.yml stages something else for windows, this gate is opening a layout that no
        # longer ships, and the failure names both lists.
        run: |
          set -eu
          layout="$(mktemp -d)"
          unzip -q dist-dropin-win/gotavern-windows-amd64-dropin.zip -d "$layout"
          actual="$( cd "$layout" && find . -mindepth 1 -maxdepth 1 -printf '%f\n' | LC_ALL=C sort | tr '\n' ' ' )"
          expected="BUILD-INFO.txt LICENSE Start.cmd THIRD_PARTY_NOTICES.txt gotavern.exe src "
          # SORTED BY LC_ALL=C, i.e. BYTE order: `Start.cmd` comes before `THIRD_PARTY_NOTICES.txt`
          # ('S' < 'T') and `gotavern.exe` after both (lowercase sorts after uppercase). Do not "tidy" this
          # into human alphabetical order: run 40179957841 went red on exactly that mis-transcription.
          if [ "$actual" != "$expected" ]; then
            echo "the WINDOWS archive top level is not release.yml's staging:" >&2
            echo "  expected: ${expected}" >&2
            echo "  actual:   ${actual}" >&2
            echo "The expected list is transcribed from release.yml's windows matrix row (gotavern.exe," >&2
            echo "LICENSE, THIRD_PARTY_NOTICES.txt, Start.cmd, BUILD-INFO.txt, src/tokenizers). If" >&2
            echo "release.yml changed, this gate is measuring a layout that does not ship: update the" >&2
            echo "staging AND this list." >&2
            exit 1
          fi
          # A PE HEADER, NOT A FILE NAME. A mis-labelled ELF would pass every name-based check here and
          # then fail on the Windows runner with "is not a valid Win32 application", which reads as a
          # harness defect instead of the packaging defect it is.
          if [ "$(head -c 2 "$layout/gotavern.exe")" != "MZ" ]; then
            echo "the archive's gotavern.exe does not begin with the PE magic 'MZ'" >&2
            exit 1
          fi
          # THE LAUNCHER IS THE USER PATH, so its bytes are asserted here as well as at boot: cmd.exe is
          # known to misparse some LF-only batch files, and the member paths must be what `zip -qr` wrote on
          # a Linux runner (they become the tree's paths on Windows).
          if ! grep -q $'\r' "$layout/Start.cmd"; then
            echo "the archived Start.cmd has no CR bytes: it would reach a Windows user LF-only" >&2
            exit 1
          fi
          grep -q 'cd /d "%~dp0"' "$layout/Start.cmd" || { echo "Start.cmd does not cd to its own directory" >&2; exit 1; }
          grep -qF '"%~dp0gotavern.exe" %*' "$layout/Start.cmd" || { echo "Start.cmd does not run %~dp0gotavern.exe with %*" >&2; exit 1; }
          if unzip -l dist-dropin-win/gotavern-windows-amd64-dropin.zip | grep -q '\\'; then
            echo "the zip carries a backslash-separated member path; release.yml's zip -qr writes '/'" >&2
            exit 1
          fi
          archived="$( cd "$layout/src/tokenizers" && find . -type f | wc -l )"
          baseline="$( cd upstream/tokenizers && find . -type f | wc -l )"
          if [ "$archived" -ne "$baseline" ]; then
            echo "the archive carries ${archived} tokenizer file(s); the vendored baseline has ${baseline}" >&2
            exit 1
          fi
          echo "windows archive layout: ${actual}"
          echo "windows archive tokenizer files: ${archived} (equal to upstream/tokenizers)"
          rm -rf "$layout"

      - name: Build the stock SillyTavern tree ONCE, and record what its bytes are
        # THE TREE IS BUILT HERE AND ONLY HERE. A PowerShell twin of scripts/build-stock-tree.sh would be a
        # SECOND source of truth for the pinned-placement derivation, and a twin that drifts from the Linux
        # tree would make the Windows gate measure a different fixture -- a false gate. So the same script
        # runs once, and the Windows job RECEIVES the result and ASSERTS it: the file count, every
        # per-file digest, and the digest of the manifest itself. `scripts/qualify-dropin.ps1` refuses
        # rather than boots if any of the three disagree, so a truncated or filtered transfer cannot pass
        # as "the stock tree" (AGENTS.md verification rule 11).
        run: |
          set -eu
          rm -rf work-win
          mkdir -p work-win
          sh scripts/build-stock-tree.sh work-win/tree | sed 's/^/  /'
          # NORMALISE the fixture extension's git stat cache BEFORE the manifest is taken: `git status`
          # refreshes .git/index the first time it runs in a freshly built repository, so a manifest taken
          # before that would record bytes the Windows-side extraction can only reproduce by luck.
          git -C work-win/tree/public/scripts/extensions/third-party/stock-example-extension status --porcelain > work-win/extstatus.normalized
          # ASCII-ONLY PATHS. The Windows side compares a manifest sorted by ORDINAL, which equals the byte
          # order of `LC_ALL=C sort` only for ASCII. If a baseline bump ever adds a non-ASCII name, that
          # comparison needs revisiting, and this refuses instead of comparing two different orderings.
          if ( cd work-win/tree && find . -type f -printf '%P\n' | LC_ALL=C grep -q '[^ -~]' ); then
            echo "the stock tree contains a non-ASCII path; the cross-host manifest comparison assumes ASCII" >&2
            exit 1
          fi
          ( cd work-win/tree && find . -type f -printf '%P\n' | LC_ALL=C sort | while IFS= read -r p; do
              printf '%s  %s\n' "$(sha256sum -- "$p" | cut -d' ' -f1)" "$p"
            done ) > work-win/stock-tree.manifest
          echo "stock tree files: $(wc -l < work-win/stock-tree.manifest)"
          ( cd work-win && sha256sum stock-tree.manifest > stock-tree.manifest.sha256 && cat stock-tree.manifest.sha256 )
          tar -czf work-win/stock-tree.tar.gz -C work-win tree
          ls -l work-win/stock-tree.tar.gz
          # A FLAT input directory, so the artifact's restore path cannot depend on upload-artifact's
          # least-common-ancestor rule being one thing rather than another.
          cp dist-dropin-win/gotavern-windows-amd64-dropin.zip windows-inputs/
          cp work-win/stock-tree.tar.gz work-win/stock-tree.manifest work-win/stock-tree.manifest.sha256 windows-inputs/
          ls -l windows-inputs

      - name: Upload the Windows archive and the stock tree for the Windows job
        uses: actions/upload-artifact@v4
        with:
          name: dropin-windows-inputs
          path: windows-inputs/*
          if-no-files-found: error
          retention-days: 7

      - name: Report failure context
        if: failure()
        run: |
          set -u
          echo "::group::what this job produced before it failed"
          ls -l windows-inputs dist-dropin-win work-win 2>/dev/null || true
          echo "::endgroup::"

  dropin-windows:
    needs: windows-inputs
    runs-on: windows-latest
    # SIZED FROM MEASURED REALITY, not from hope. The job extracts three ~45 MB stock trees, hashes ~1000
    # files per scenario, and boots a server twice per scenario. The readiness bound is the harness's own
    # 30 s poll and is never widened (rule 33), so the only variance a job bound has to absorb is a slow
    # Windows runner disk and a cold PowerShell start -- not a slow boot. A wedged step fails here instead
    # of holding a runner for GitHub's 6-hour default.
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dropin-windows-inputs
          path: windows-inputs

      - name: Report the inputs this job is about to execute
        # PRINTED, so a green is attached to specific bytes: the archive's digest, the stock tree's file
        # count and its manifest digest are what the three scenarios below actually ran against.
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($required in 'gotavern-windows-amd64-dropin.zip', 'stock-tree.tar.gz', 'stock-tree.manifest', 'stock-tree.manifest.sha256') {
            $path = Join-Path 'windows-inputs' $required
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { throw "missing input: $path" }
            "{0,-40} {1,12} bytes" -f $required, (Get-Item -LiteralPath $path).Length
          }
          "archive sha256: $((Get-FileHash -Algorithm SHA256 -LiteralPath 'windows-inputs/gotavern-windows-amd64-dropin.zip').Hash.ToLowerInvariant())"
          "stock tree file count (recorded on Linux): $((Get-Content -LiteralPath 'windows-inputs/stock-tree.manifest').Count)"
          "stock tree manifest digest (recorded on Linux): $(Get-Content -LiteralPath 'windows-inputs/stock-tree.manifest.sha256' -Raw)"

      - name: 'Windows drop-in 1/3 -- Start.cmd, pristine pinned config'
        # THE DOCUMENTED WINDOWS USER PATH: the archive's own Start.cmd, whose `cd /d "%~dp0"` is what gives
        # a user the tree as their CWD. The API must return the USER'S OWN seeded character, chat and
        # settings, and boot must not rewrite a config.yaml that already parses.
        run: |
          $ErrorActionPreference = 'Stop'
          $start = Get-Date
          pwsh -NoProfile -File scripts/qualify-dropin.ps1 `
            -Archive windows-inputs/gotavern-windows-amd64-dropin.zip `
            -StockTreeTar windows-inputs/stock-tree.tar.gz `
            -StockTreeManifest windows-inputs/stock-tree.manifest `
            -Layout start-cmd -Config full -Port 8797
          $status = $LASTEXITCODE
          if ($status -ne 0) { throw "scenario start-cmd/full FAILED with exit $status" }
          "scenario start-cmd/full passed in $([int]((Get-Date) - $start).TotalSeconds)s"

      - name: 'Windows drop-in 2/3 -- Start.cmd, a USED (trimmed) config.yaml'
        # The tree a user has after running SillyTavern once. This is the only input that makes startup
        # merge the pinned defaults back in, which is P0-C's mechanism: the rewrite must keep the user's
        # `extensions.autoUpdate: false`, not adopt the pinned `true` -- measured on NTFS for the first
        # time, where the atomic rewrite is a rename on a different filesystem than the Linux gate's.
        run: |
          $ErrorActionPreference = 'Stop'
          $start = Get-Date
          pwsh -NoProfile -File scripts/qualify-dropin.ps1 `
            -Archive windows-inputs/gotavern-windows-amd64-dropin.zip `
            -StockTreeTar windows-inputs/stock-tree.tar.gz `
            -StockTreeManifest windows-inputs/stock-tree.manifest `
            -Layout start-cmd -Config minimal -Port 8798
          $status = $LASTEXITCODE
          if ($status -ne 0) { throw "scenario start-cmd/minimal FAILED with exit $status" }
          "scenario start-cmd/minimal passed in $([int]((Get-Date) - $start).TotalSeconds)s"

      - name: 'Windows drop-in 3/3 -- a foreign CWD, pristine pinned config'
        # NOT REACHABLE THROUGH Start.cmd (it cds), so this is the one scenario that runs gotavern.exe
        # directly. It exists to re-measure on NTFS the behaviour the Linux gate measured: the runtime root
        # follows the INSTALL root, not the CWD, so a user who launches from elsewhere still gets their own
        # config/data -- and no pre-existing file may be modified or deleted while doing it.
        run: |
          $ErrorActionPreference = 'Stop'
          $start = Get-Date
          pwsh -NoProfile -File scripts/qualify-dropin.ps1 `
            -Archive windows-inputs/gotavern-windows-amd64-dropin.zip `
            -StockTreeTar windows-inputs/stock-tree.tar.gz `
            -StockTreeManifest windows-inputs/stock-tree.manifest `
            -Layout foreign-cwd -Config full -Port 8799
          $status = $LASTEXITCODE
          if ($status -ne 0) { throw "scenario foreign-cwd/full FAILED with exit $status" }
          "scenario foreign-cwd/full passed in $([int]((Get-Date) - $start).TotalSeconds)s"

      - name: Report failure context
        # The harness prints its own server log and the stage lines the boot managed; what it cannot show is
        # which scenario left what behind, which is what a reader needs when the FIXTURE is the suspect.
        # NOTHING HERE IS TRUNCATED SILENTLY: the file counts are stated next to the listing.
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          if (-not (Test-Path -LiteralPath '.dropin-work-win')) { "no .dropin-work-win was created"; exit 0 }
          foreach ($work in @(Get-ChildItem -LiteralPath '.dropin-work-win' -Directory)) {
            "::group::$($work.Name)"
            $files = @(Get-ChildItem -LiteralPath $work.FullName -Recurse -File -Force -ErrorAction SilentlyContinue)
            "files under this work directory: $($files.Count)"
            foreach ($log in @($files | Where-Object { $_.Name -like 'server.*.log' })) {
              "--- $($log.FullName) ---"
              Get-Content -LiteralPath $log.FullName -Tail 200 | ForEach-Object { $_ }
            }
            foreach ($diff in @($files | Where-Object { $_.Name -like '*.before' -or $_.Name -like '*.after' -or $_.Name -like '*.manifest.recomputed' -or $_.Name -like '*.stability' })) {
              "--- $($diff.FullName) ($((Get-Content -LiteralPath $diff.FullName).Count) lines) ---"
            }
            "::endgroup::"
          }

      - name: Upload the evidence of a failing Windows run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dropin-windows-failure-evidence
          path: |
            .dropin-work-win/*/server.out.log
            .dropin-work-win/*/server.err.log
            .dropin-work-win/*/*.before
            .dropin-work-win/*/*.after
            .dropin-work-win/*/version.json
          if-no-files-found: warn
          retention-days: 7