# THE LONG-LIVED CORPUS QUALIFICATION — Beta 1's answer to "it works on a fresh install".
#
# WHAT IT RUNS. `tools/build-longlived-corpus.mjs` builds a deterministic, synthetic, NO-PRIVATE-DATA SillyTavern
# tree (AGENTS 51/56) at one of three sizes, `tools/longlived/verify.mjs` re-walks it and asserts its surfaces by
# name, and `tests/browser/longlived-qualify.mjs` boots the CANDIDATE GoTavern binary and the PINNED Node
# SillyTavern over two COPIES of that tree, drives the long-lived journey (resume an existing chat -> send -> swipe
# -> switch preset/world/temperature/character -> reload repeatedly -> save -> restart -> resume -> continue), then
# judges browser-observable state, provider request BYTES and persisted disk state, and proves the judge has teeth
# by mutating the run's own artefacts. The Go half (`tests/e2e/longlived_corpus_test.go`) runs in the same job:
# generation determinism, the loader's named refusal of a drifted tree, and a boot of the shipped binary over a
# corpus copy.
#
# WHY IT IS ITS OWN WORKFLOW. `whole-session.yml` proves a fresh-install journey; this one exists because Beta 1 must
# qualify LONG-LIVED session data. Mixing it into the fresh-install surface would make a red unable to say which
# shape failed, and the sizes want different budgets.
#
# SIZES:
#   small   (<5 MB)   push and the default dispatch: fast CI, both browser subjects, full comparator + teeth.
#   medium  (~50 MB)  dispatch only: the full qualification over long histories (2400-message chats).
#   large   (>100 MB) nightly schedule or dispatch only: generator determinism (byte-identical rebuild) + the
#                     loader + the Go boot gate. A browser drive over 5000-message chats would spend an hour loading
#                     history without adding an assertion; that is declared here, not implied.
#
# WHAT A GREEN RUN DOES NOT PROVE, stated so the matrix can quote it: the provider is a recording peer, not a real
# provider (AGENTS 22); real user data is never present (the corpus is synthetic); the large size is not
# browser-driven; and the pinned leg needs the pinned checkout with its node_modules (a machine without it records
# the pinned legs as not-observed and the verdict is NOT a pass).
#
# RELEASE EVIDENCE (alpha.15). This workflow is a required release gate at
# docs/release-manifest.json, and the gate is specifically the MEDIUM tier: the default dispatch (size=small) runs
# only the fast tier and leaves medium-corpus SKIPPED while the RUN still concludes success, which is exactly the
# plausible-looking evidence the release verifier must refuse. The medium job therefore writes a FIXED-NAME artifact
# (longlived-medium-evidence) whose embedded document carries the tier marker (`medium`), the head SHA, the leg
# verdicts, the comparator teeth result and the sha256 of the 20-extension manifest; the verifier downloads that
# artifact, reads release-evidence.json out of it and checks the marker and the SHA. The LARGE tier is a nightly
# schedule / large-dispatch RAIL (generator determinism + loader + Go boot only; the browser driver refuses large by
# design and that refusal is documented at tests/browser/longlived-qualify.mjs:115-119). Large is NOT a same-SHA
# release gate: a nightly run predates the release candidate, so requiring it would make a release depend on timing
# rather than on evidence. A release manager must dispatch the MEDIUM tier at CANDIDATE_SHA:
#
#   gh workflow run longlived.yml --ref main -f size=medium
#
# CONCURRENCY. The group separates dispatch runs from push/schedule runs by input size and event, and a dispatch is
# never cancelled in progress: a release-evidence dispatch must not be silently cancelled by an unrelated push to
# main (which is what the previous single group allowed).

name: GoTavern long-lived corpus qualification

on:
  workflow_dispatch:
    inputs:
      size:
        description: 'Corpus size to qualify'
        type: choice
        options: [small, medium, large]
        default: small
  push:
    paths:
      - 'tools/build-longlived-corpus.mjs'
      - 'tools/longlived/**'
      - 'tests/browser/longlived-*.mjs'
      - 'tests/e2e/longlived_corpus_test.go'
      - 'tests/e2e/longlived_schema_test.go'
      - 'tests/e2e/longlived_complex_test.go'
      - 'tests/e2e/longlived_complex_writes_test.go'
      - 'internal/longlivedfixture/**'
      - 'cmd/build-longlived/**'
      - 'docs/longlived-complex-fixture.md'
      - '.github/workflows/longlived.yml'
  schedule:
    # Nightly at 05:23 UTC: the large-corpus generator/loader/Go gate. A scheduled run is the only routine run whose
    # green covers the large size.
    - cron: '23 5 * * *'

permissions:
  contents: read

concurrency:
  # The size/event suffix keeps a release-evidence medium dispatch in its OWN group: a push run (small) or a later
  # scheduled large run must not cancel it. cancel-in-progress is false for dispatches so an operator's evidence run
  # completes whatever else lands.
  group: longlived-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.size || github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

env:
  PINNED_BASELINE_COMMIT: 06bde939fb1e9c4c8d8641d810f0a916b5bce127

jobs:
  # ---------------------------------------------------------------------------------------------------------------
  # SMALL: the fast gate. Both browser subjects, the comparator, the teeth proof, and the Go corpus gate.
  # ---------------------------------------------------------------------------------------------------------------
  small-corpus:
    if: ${{ github.event_name != 'schedule' && (github.event_name != 'workflow_dispatch' || inputs.size == 'small') }}
    runs-on: ubuntu-latest
    # SIZED FROM THE DRIVES, not a round number: two corpus generations (small, with a determinism rebuild), the Go
    # gate, two pinned boots (the pinned server compiles its frontend libraries on a cold checkout), and four
    # browser legs. The probe's own deadlines (120 s server, 90 s reply, 60 s chat resume) are the first line of
    # defence; this bounds a wedged browser instead of holding a runner for the service maximum.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/checkout-pinned
        with:
          commit: ${{ env.PINNED_BASELINE_COMMIT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # THE SAME THREE CACHES, KEYED THE SAME WAY, as `whole-session.yml`: a hit SKIPS an install, so the key has to
      # PROVE the identity of what it restores (pinned commit plus its lockfile, the harness lockfile, the Playwright
      # download). No `restore-keys`: a partial restore reports cache-hit=false while handing back an older tree.
      - name: Cache the pinned server's node_modules
        id: cache-pinned-modules
        uses: actions/cache@v4
        with:
          path: .reference/SillyTavern/node_modules
          key: ${{ runner.os }}-pinned-node-modules-${{ env.PINNED_BASELINE_COMMIT }}-${{ hashFiles('.reference/SillyTavern/package-lock.json') }}

      - name: Cache the harness node_modules
        id: cache-harness-modules
        uses: actions/cache@v4
        with:
          path: tests/browser/node_modules
          key: ${{ runner.os }}-harness-node-modules-${{ hashFiles('tests/browser/package-lock.json') }}

      - name: Cache the Playwright browser download
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('tests/browser/package-lock.json') }}

      - name: Install the pinned server's dependencies
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-pinned-modules.outputs.cache-hit }}" = "true" ]; then
            echo "pinned server node_modules: CACHE HIT for ${{ env.PINNED_BASELINE_COMMIT }} -- install SKIPPED"
          else
            echo "pinned server node_modules: cache MISS -- installing from the pinned checkout's own manifest"
            cd .reference/SillyTavern
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          fi

      - name: Install the browser harness
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-harness-modules.outputs.cache-hit }}" = "true" ]; then
            echo "tests/browser/node_modules: CACHE HIT -- npm ci SKIPPED"
          else
            echo "tests/browser/node_modules: cache MISS -- npm ci"
            (cd tests/browser && npm ci --no-audit --no-fund)
          fi
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            echo "playwright chromium: CACHE HIT -- browser download SKIPPED, OS packages still ensured"
            (cd tests/browser && npx playwright install-deps chromium)
          else
            echo "playwright chromium: cache MISS -- downloading the browser and its OS packages"
            (cd tests/browser && npx playwright install --with-deps chromium)
          fi

      - name: Which setup branches this run took
        run: |
          echo "pinned server node_modules cache-hit: ${{ steps.cache-pinned-modules.outputs.cache-hit }}"
          echo "harness node_modules cache-hit:       ${{ steps.cache-harness-modules.outputs.cache-hit }}"
          echo "playwright browsers cache-hit:        ${{ steps.cache-playwright.outputs.cache-hit }}"
          echo "(true = the install above was skipped; false or empty = it ran)"

      - name: Build the candidate binary
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p .browser-bin
          go build -trimpath -o .browser-bin/gotavern ./cmd/gotavern
          echo "GOTAVERN_BINARY=${PWD}/.browser-bin/gotavern" >> "$GITHUB_ENV"
          echo "GOTAVERN_REFERENCE=${PWD}/.reference/SillyTavern" >> "$GITHUB_ENV"

      # THE CORPUS IS GENERATED ONCE and shared by the Go gate and the browser driver: generating it twice would pay
      # for the same bytes twice, and the determinism rebuild inside the generator is the assertion that they are the
      # same bytes.
      - name: Generate the small corpus (deterministic rebuild asserted in-run)
        run: |
          set -euo pipefail
          corpus="$RUNNER_TEMP/longlived-corpus-small"
          schema="$RUNNER_TEMP/longlived-corpus-small-schema.json"
          node tools/build-longlived-corpus.mjs --size small --out "$corpus" --seed corpus-ci --force --verify-deterministic \
            --schema-out "$schema"
          echo "GOTAVERN_LONGLIVED_CORPUS=$corpus" >> "$GITHUB_ENV"
          echo "GOTAVERN_LONGLIVED_SIZE=small" >> "$GITHUB_ENV"
          echo "GOTAVERN_LONGLIVED_SCHEMA=$schema" >> "$GITHUB_ENV"

      # THE SHARED CORPUS SCHEMA. Both shipped generators (the Node corpus here and the Go instance in
      # internal/longlivedfixture) emit the same `gotavern-corpus-schema` v1 document: per-file path/size/sha256/class,
      # derived counts, feature flags, markers and a tree digest. This step proves the tree the browser leg is
      # about to drive is the tree the manifest describes -- the "the tree you drive is the manifest you were given"
      # property, instead of two generators that merely look alike. The schema is written OUTSIDE the corpus tree on
      # purpose: the disk probe excludes only `manifest.json`, so a schema inside it would change the tree being measured.
      - name: Corpus schema gate (the generated tree matches the shared schema)
        run: |
          set -euo pipefail
          node tools/longlived/verify-corpus-schema.mjs \
            --corpus "$GOTAVERN_LONGLIVED_CORPUS" \
            --schema "$GOTAVERN_LONGLIVED_SCHEMA" \
            --report "$RUNNER_TEMP/longlived-corpus-small-schema-verification.json"

      - name: Loader gate (the corpus matches its manifest and every surface is present)
        run: |
          set -euo pipefail
          node tools/longlived/verify.mjs --corpus "$GOTAVERN_LONGLIVED_CORPUS" > "$RUNNER_TEMP/longlived-verify.json"
          cat "$RUNNER_TEMP/longlived-verify.json" | python3 -c 'import json,sys; v=json.load(sys.stdin); print("loader ok:", v["ok"], "checks:", len(v["checks"])); sys.exit(0 if v["ok"] else 1)'

      - name: Go gate (boot the shipped binary over the corpus copy and preserve it)
        run: |
          set -euo pipefail
          go test ./tests/e2e -run '^TestLongLivedCorpus$' -count=1 -v

      # THE NEW LONG-TERM GOAL'S GATE. The corpus above is a small committed tree; this step builds
      # the far larger deterministic instance (internal/longlivedfixture: 32 PNG cards, 39 year-spanning
      # chats with branches/swipes, 8 world books with the largest at 400 entries, 8 presets, 3 groups,
      # themes/quick replies/personas/backgrounds, extension state, legacy migration input, unknown files)
      # and asserts what the user actually cares about: every planted byte survives the boot
      # (one declared startup mutation is allowed and value-checked: the pinned legacy-secrets migration),
      # and the frontend's own routes serve the cards, chats, world book, presets, groups and assets.
      # The fixture is synthetic and strictly SFW (internal/longlivedfixture/sfw.go).
      - name: Complex-instance gate (boot, preserve, serve, migrate, write, corrupt, refuse, roll back)
        run: |
          set -euo pipefail
          # Every scenario on the synthetic complex instance: boot/data-safety/routes, migration
          # (dry-run leaves the source alone, real run copies every byte, migrated install boots),
          # unknown-field preservation on a world write, and a corrupt world that is refused rather
          # than repaired. One regex so a new TestComplex* scenario cannot silently drop out.
          go test ./tests/e2e -run '^TestComplex' -count=1 -v

      # THE CROSS-LAYER BRIDGE. One test builds BOTH corpora with the shipped generators (the Go complex-small
      # instance and the Node small corpus), verifies each against its own schema with the JS consumer, compares
      # the two and names every difference class, then runs the mutation teeth. It is the executable answer to
      # "can one deterministic corpus feed Go, Node, browser and provider-wire tests": the measured decision is
      # TWO_CORPORA_SHARED_SCHEMA, because neither corpus is a superset of the other (44 Go-only files with 10
      # feature surfaces, 66 JS-only files with 2). Collapsing them would delete coverage, so the bridge proves
      # schema identity instead of claiming corpus identity.
      - name: Shared corpus-schema bridge (Go + Node corpora, verify, compare, teeth)
        run: |
          set -euo pipefail
          go test ./tests/e2e -run '^TestLongLivedCorpusSchemaBridge' -count=1 -v

      - name: Drive the long-lived journey on both subjects and judge it
        env:
          PINNED_READY_MS: '180000'
        run: |
          set -euo pipefail
          node tests/browser/longlived-qualify.mjs --size small --corpus "$GOTAVERN_LONGLIVED_CORPUS" \
            --out-dir "$RUNNER_TEMP/longlived-small"

      - name: Publish the verdict on the job summary
        if: always()
        run: |
          set -uo pipefail
          verdict="$RUNNER_TEMP/longlived-small/longlived-verdict.json"
          if [ ! -s "$verdict" ]; then
            echo "::error::the driver produced no longlived-verdict.json, so there is no machine-readable verdict"
            exit 1
          fi
          status=0
          node tools/longlived/summarise-verdict.mjs --verdict "$verdict" --label "long-lived corpus (small)" >> "$GITHUB_STEP_SUMMARY" || status=$?
          exit "$status"

      - name: Upload the legs, verdict, comparison and teeth
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longlived-small-${{ github.run_id }}
          path: ${{ runner.temp }}/longlived-small/**
          retention-days: 14
          if-no-files-found: warn

  # ---------------------------------------------------------------------------------------------------------------
  # MEDIUM: dispatch only. The full qualification over long histories (~50 MB, 2400-message chats).
  # ---------------------------------------------------------------------------------------------------------------
  medium-corpus:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.size == 'medium' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-pinned
        with:
          commit: ${{ env.PINNED_BASELINE_COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache the pinned server's node_modules
        id: cache-pinned-modules
        uses: actions/cache@v4
        with:
          path: .reference/SillyTavern/node_modules
          key: ${{ runner.os }}-pinned-node-modules-${{ env.PINNED_BASELINE_COMMIT }}-${{ hashFiles('.reference/SillyTavern/package-lock.json') }}
      - name: Cache the harness node_modules
        id: cache-harness-modules
        uses: actions/cache@v4
        with:
          path: tests/browser/node_modules
          key: ${{ runner.os }}-harness-node-modules-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: Cache the Playwright browser download
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: Install the pinned server's dependencies
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-pinned-modules.outputs.cache-hit }}" = "true" ]; then echo "pinned node_modules: CACHE HIT"; else
            cd .reference/SillyTavern
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          fi
      - name: Install the browser harness
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-harness-modules.outputs.cache-hit }}" = "true" ]; then echo "harness node_modules: CACHE HIT"; else (cd tests/browser && npm ci --no-audit --no-fund); fi
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then (cd tests/browser && npx playwright install-deps chromium); else (cd tests/browser && npx playwright install --with-deps chromium); fi
      - name: Build the candidate binary
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p .browser-bin
          go build -trimpath -o .browser-bin/gotavern ./cmd/gotavern
          echo "GOTAVERN_BINARY=${PWD}/.browser-bin/gotavern" >> "$GITHUB_ENV"
          echo "GOTAVERN_REFERENCE=${PWD}/.reference/SillyTavern" >> "$GITHUB_ENV"
      - name: Generate the medium corpus (deterministic rebuild asserted in-run)
        run: |
          set -euo pipefail
          corpus="$RUNNER_TEMP/longlived-corpus-medium"
          schema="$RUNNER_TEMP/longlived-corpus-medium-schema.json"
          node tools/build-longlived-corpus.mjs --size medium --out "$corpus" --seed corpus-ci --force --verify-deterministic \
            --schema-out "$schema"
          echo "GOTAVERN_LONGLIVED_CORPUS=$corpus" >> "$GITHUB_ENV"
          echo "GOTAVERN_LONGLIVED_SIZE=medium" >> "$GITHUB_ENV"
          echo "GOTAVERN_LONGLIVED_SCHEMA=$schema" >> "$GITHUB_ENV"

      # The same shared-schema property the small job proves, applied to the tier that carries the release-evidence
      # artifact: the ~50 MB / 2400-message corpus the browser legs drive must be the tree its manifest describes.
      - name: Corpus schema gate (the generated tree matches the shared schema)
        run: |
          set -euo pipefail
          node tools/longlived/verify-corpus-schema.mjs \
            --corpus "$GOTAVERN_LONGLIVED_CORPUS" \
            --schema "$GOTAVERN_LONGLIVED_SCHEMA" \
            --report "$RUNNER_TEMP/longlived-corpus-medium-schema-verification.json"

      - name: Loader gate
        run: |
          set -euo pipefail
          node tools/longlived/verify.mjs --corpus "$GOTAVERN_LONGLIVED_CORPUS"
      - name: Go gate over the medium corpus
        run: |
          set -euo pipefail
          go test ./tests/e2e -run '^TestLongLivedCorpus$' -count=1 -v
      # THE 20 PINNED THIRD-PARTY EXTENSIONS ON THE COMPLEX INSTANCE. The extensions are third-party
      # repositories pinned by commit in tests/browser/third-party-extensions.lock.json; they are NOT
      # committed (licences/sizes; rule 56 keeps third-party payloads out of the tree). This step
      # materialises them into a temporary data root the way the pinned install route would and then
      # asserts the backend contract on the complex tree: discover lists all 20, every manifest and entry
      # script is served byte-for-byte from the user extensions directory, and the roster/world/settings
      # still work with them present. Extension CONTENT stays on the runner; only the names/pins/counts
      # manifest is uploaded, which is why this is SFW-safe.
      - name: Install the 20 pinned third-party extensions into a temp data root
        run: |
          set -euo pipefail
          node tools/longlived/install-pinned-extensions.mjs \
            --data-root "$RUNNER_TEMP/pinned-extensions" \
            --out "$RUNNER_TEMP/pinned-extensions-manifest.json"
          echo "GOTAVERN_PINNED_EXTENSIONS=$RUNNER_TEMP/pinned-extensions/default-user/extensions" >> "$GITHUB_ENV"
      - name: Complex instance with the 20 pinned extensions (discover, assets, settings, data)
        run: |
          set -euo pipefail
          go test ./tests/e2e -run '^TestComplexWithPinnedThirdPartyExtensions$' -count=1 -v
      - name: Upload the pinned-extension manifest (names, pins, counts and digests only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longlived-pinned-extensions-${{ github.run_id }}
          path: ${{ runner.temp }}/pinned-extensions-manifest.json
          retention-days: 14
          if-no-files-found: warn
      - name: Drive the long-lived journey on both subjects and judge it
        env:
          PINNED_READY_MS: '240000'
        run: |
          set -euo pipefail
          node tests/browser/longlived-qualify.mjs --size medium --corpus "$GOTAVERN_LONGLIVED_CORPUS" \
            --out-dir "$RUNNER_TEMP/longlived-medium"
      - name: Publish the verdict on the job summary
        if: always()
        run: |
          set -uo pipefail
          verdict="$RUNNER_TEMP/longlived-medium/longlived-verdict.json"
          if [ ! -s "$verdict" ]; then
            echo "::error::the driver produced no longlived-verdict.json"; exit 1
          fi
          status=0
          node tools/longlived/summarise-verdict.mjs --verdict "$verdict" --label "long-lived corpus (medium)" >> "$GITHUB_STEP_SUMMARY" || status=$?
          exit "$status"
      - name: Upload the legs, verdict, comparison and teeth
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longlived-medium-${{ github.run_id }}
          path: ${{ runner.temp }}/longlived-medium/**
          retention-days: 14
          if-no-files-found: warn
      # =============================================================================================================
      # THE FIXED-NAME RELEASE EVIDENCE. docs/release-manifest.json requires this workflow, the medium-corpus JOB,
      # and THIS artifact, reading its embedded release-evidence.json: the tier marker (`medium`), the head SHA, the
      # leg verdicts, the comparator teeth result and the 20-extension manifest digest. The step is success-only, so
      # a failed qualification produces NO evidence artifact (and a run with no artifact is refused by the verifier).
      # The assertions below are not decoration: if the verdict is not `ok`, if its size is not medium, or if the
      # 20-extension manifest is missing/mismatched, the step fails rather than writing evidence that looks green.
      # =============================================================================================================
      - name: Write the fixed-name release evidence (tier, head SHA, legs, teeth, extension-manifest digest)
        run: |
          set -euo pipefail
          verdict="$RUNNER_TEMP/longlived-medium/longlived-verdict.json"
          extensions="$RUNNER_TEMP/pinned-extensions-manifest.json"
          out="$RUNNER_TEMP/longlived-medium-evidence"
          mkdir -p "$out"
          test -s "$verdict" || { echo "::error::no longlived-verdict.json; refusing to write release evidence"; exit 1; }
          test -s "$extensions" || { echo "::error::no pinned-extensions-manifest.json; refusing to write release evidence"; exit 1; }
          node - "$verdict" "$extensions" "$out/release-evidence.json" <<'JS'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const [verdictPath, extensionsPath, outPath] = process.argv.slice(2);
          const headSha = process.env.GITHUB_SHA;
          const verdict = JSON.parse(fs.readFileSync(verdictPath, 'utf8'));
          const extensionBytes = fs.readFileSync(extensionsPath);
          const extensions = JSON.parse(extensionBytes.toString('utf8'));
          if (verdict.schema !== 'gotavern-longlived-verdict') throw new Error(`unexpected verdict schema ${JSON.stringify(verdict.schema)}`);
          if (verdict.size !== 'medium') throw new Error(`the verdict's size is ${JSON.stringify(verdict.size)}, not medium: a non-medium tier must not produce the release evidence`);
          if (verdict.ok !== true) throw new Error('the medium qualification verdict is not ok; refusing to write release evidence');
          if (verdict.teeth?.ok !== true) throw new Error('the comparator teeth proof is not ok; refusing to write release evidence');
          if (extensions.installed !== extensions.expected || extensions.installed !== 20) throw new Error(`the pinned-extension manifest records installed=${extensions.installed} expected=${extensions.expected}; the release rail requires the 20-extension roster`);
          if (!/^[0-9a-f]{64}$/.test(String(verdict.corpus?.treeSha256 ?? ''))) throw new Error('the verdict carries no corpus tree sha256');
          const evidence = {
            schemaVersion: 1,
            kind: 'gotavern-longlived-corpus-evidence',
            workflow: 'GoTavern long-lived corpus qualification',
            headSha,
            event: process.env.GITHUB_EVENT_NAME,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            size: verdict.size,
            ok: verdict.ok,
            corpus: { size: verdict.corpus.size, files: verdict.corpus.files, bytes: verdict.corpus.bytes, treeSha256: verdict.corpus.treeSha256 },
            legs: (verdict.legReports ?? []).map((leg) => ({ name: `${leg.subject}-${leg.phase}`, skipped: leg.skipped === true, exitCode: leg.exitCode ?? null })),
            comparator: verdict.comparison ? { ok: verdict.comparison.ok, verdict: verdict.comparison.verdict } : null,
            comparatorTeeth: { ok: verdict.teeth.ok },
            pinnedExtensions: { count: extensions.installed, expected: extensions.expected, lockSha256: extensions.lock?.sha256 ?? null, manifestSha256: crypto.createHash('sha256').update(extensionBytes).digest('hex') },
          };
          if (evidence.legs.length < 4) throw new Error(`only ${evidence.legs.length} leg(s) were recorded; the medium qualification runs four subject legs plus comparison and teeth`);
          if (!/^[0-9a-f]{64}$/.test(String(evidence.pinnedExtensions.manifestSha256))) throw new Error('the extension manifest digest is not a sha256');
          fs.writeFileSync(outPath, `${JSON.stringify(evidence, null, 2)}\n`);
          console.log(`release evidence: head=${headSha} size=${evidence.size} legs=${evidence.legs.length} teeth=${evidence.comparatorTeeth.ok} extensions=${evidence.pinnedExtensions.count} digest=${evidence.pinnedExtensions.manifestSha256}`);
          JS
      - name: Upload the fixed-name release evidence (tier marker, head SHA, digests)
        uses: actions/upload-artifact@v4
        with:
          name: longlived-medium-evidence
          path: ${{ runner.temp }}/longlived-medium-evidence/release-evidence.json
          retention-days: 90
          if-no-files-found: error

  # ---------------------------------------------------------------------------------------------------------------
  # LARGE: nightly schedule or dispatch only. Generator determinism + loader + the Go boot gate; NOT a browser drive,
  # declared rather than implied.
  # ---------------------------------------------------------------------------------------------------------------
  large-corpus:
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.size == 'large') }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate the large corpus (byte-identical rebuild asserted)
        run: |
          set -euo pipefail
          corpus="$RUNNER_TEMP/longlived-corpus-large"
          node tools/build-longlived-corpus.mjs --size large --out "$corpus" --seed corpus-ci --force --verify-deterministic
          echo "GOTAVERN_LONGLIVED_CORPUS=$corpus" >> "$GITHUB_ENV"
          echo "GOTAVERN_LONGLIVED_SIZE=large" >> "$GITHUB_ENV"
      - name: Loader gate (the large tree matches its manifest, size class measured)
        run: |
          set -euo pipefail
          node tools/longlived/verify.mjs --corpus "$GOTAVERN_LONGLIVED_CORPUS" | tee "$RUNNER_TEMP/longlived-large-verify.json"
      - name: Go gate (boot the shipped binary over the large corpus copy)
        run: |
          set -euo pipefail
          go test ./tests/e2e -run '^TestLongLivedCorpus$' -count=1 -v
      - name: Publish the measurement on the job summary
        if: always()
        run: |
          set -uo pipefail
          verdict="$RUNNER_TEMP/longlived-large-verify.json"
          if [ ! -s "$verdict" ]; then
            echo "::error::the large-corpus loader produced no verdict"; exit 1
          fi
          status=0
          node tools/longlived/summarise-verdict.mjs --verdict "$verdict" --label "long-lived corpus (large)" >> "$GITHUB_STEP_SUMMARY" || status=$?
          exit "$status"
      - name: Upload the large-corpus measurement
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: longlived-large-${{ github.run_id }}
          path: ${{ runner.temp }}/longlived-large-*.json
          retention-days: 14
          if-no-files-found: warn
