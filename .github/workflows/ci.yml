name: GoTavern CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: .reference/SillyTavern
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Pin npm build tool
        run: |
          npm install --global npm@11.17.0 --no-audit --no-fund
          test "$(npm --version)" = 11.17.0
      - name: Test observer comparison harness
        run: node --test tests/oracle/compare-observations.test.mjs
      - name: Rebuild pinned assets, inventories, and Node oracle
        run: node tools/build-generated-lib.mjs .reference/SillyTavern
      - name: Verify generated results are committed
        run: |
          git diff --exit-code -- docs/api-inventory.md docs/config-inventory.md upstream/generated upstream/manifests/generated.sha256 tests/oracle/sillytavern-1.19.0-fresh-start.json tests/oracle/sillytavern-1.19.0-config-init.json tests/oracle/sillytavern-1.19.0-user-storage-roundtrip.json tests/oracle/sillytavern-1.19.0-cookie-secret.json tests/oracle/sillytavern-1.19.0-system-prompt-migration.json tests/oracle/sillytavern-1.19.0-user-data-migration.json tests/oracle/sillytavern-1.19.0-public-overrides-migration.json tests/oracle/sillytavern-1.19.0-security-settings.json tests/oracle/sillytavern-1.19.0-group-metadata-migration.json tests/oracle/sillytavern-1.19.0-character-disk-cache.json tests/oracle/sillytavern-1.19.0-flat-secrets.json tests/oracle/sillytavern-1.19.0-upload-cleanup.json

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify upstream asset manifests
        run: |
          go run ./tools/assetmanifest -root upstream/public -output upstream/manifests/public.sha256 -check
          go run ./tools/assetmanifest -root upstream/default -output upstream/manifests/default.sha256 -check
          go run ./tools/assetmanifest -root upstream/generated -output upstream/manifests/generated.sha256 -check
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build CLI
        run: go build -trimpath -o gotavern ./cmd/gotavern
      - name: Verify embedded assets
        run: ./gotavern assets verify

  cross-compile:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
          - goos: windows
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cross-compile release target
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        shell: bash
        run: |
          suffix=''
          if [ "$GOOS" = windows ]; then suffix='.exe'; fi
          mkdir -p dist
          go build ./...
          go build -trimpath -ldflags='-s -w' -o "dist/gotavern-${GOOS}-${GOARCH}${suffix}" ./cmd/gotavern
