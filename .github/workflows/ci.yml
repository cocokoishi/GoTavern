name: GoTavern CI

on:
  push:
    branches: [main]
  pull_request:

  # A NIGHTLY FULL PARITY RUN, and a way for an agent to ask for one on purpose. Until this existed the full
  # oracle could only be triggered by a commit that happened to touch a shared input, so "run everything" was
  # never a decision anyone could make -- it was a side effect. The full sweep belongs on a schedule and on
  # request; a push keeps the narrowed selection the `changes` job below describes.
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:
    inputs:
      probes:
        description: 'Comma-separated probe scripts to re-record, or empty for EVERY probe'
        required: false
        default: ''
      oracle_concurrency:
        description: 'Probe parallelism for this run; empty uses the generator default (3).'
        required: false
        default: ''
permissions:
  contents: read

# Only the newest commit on a branch needs verifying. Without this, five pushes in
# twenty minutes queued five full runs (~30 min each) and the answer about HEAD
# arrived hours later, while the machine sat waiting. A superseded run is cancelled
# because its result can no longer change what ships; a run is never cancelled on a
# pull request, where the individual commit is the thing under review.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # The oracle job re-records every fixture on Linux and requires a zero diff. It is the only
  # slow job (~30 min, because it boots the pinned server for dozens of probes twice), so running
  # it for a documentation or harness-only push means the answer about that commit arrives half an
  # hour later than it needed to. This gate decides whether the commit can possibly have changed a
  # fixture, and the oracle job is skipped when it cannot.
  #
  # WHY Go CHANGES ARE NOT IN THE LIST: the oracle job re-records fixtures from the PINNED server
  # and regenerates inventories from the PINNED source, and the diff it checks is
  # docs/api-inventory.md, docs/config-inventory.md, upstream/generated, the generated manifest and
  # tests/oracle. A change to internal/ or cmd/ cannot affect any of those, and it is already covered
  # by the verify job, which replays every fixture through the Go implementation. Including them
  # made every product commit wait ~35-40 minutes -- the oracle runs 104 probe runs twice at
  # concurrency 3 -- for an answer that could not change.
  #
  # The failure mode this fixes is real: for a stretch of this project's history no run completed
  # at all, because every push queued behind an oracle job and the verdict never arrived. A gate
  # that keeps failing to report is worse than a slower gate that reports.
  #
  # The first attempt at this gate was itself unparseable and broke CI for a minute, so it is now
  # validated with a real YAML parser before it is pushed rather than by reading the indentation.
  changes:
    runs-on: ubuntu-latest
    # MEASURED: 0.1 min on every recent run (it checks out and greps a diff). Ten minutes leaves two
    # orders of magnitude of headroom and bounds a wedged `git` instead of allowing GitHub's 360-minute
    # default to sit on a runner.
    timeout-minutes: 10
    outputs:
      oracle: ${{ steps.diff.outputs.oracle }}
      probes: ${{ steps.diff.outputs.probes }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        name: Which probes must re-record, if any?
        # TWO DECISIONS, because a full oracle run is now measured in HOURS: it re-records every
        # declared probe TWICE, and each run boots the pinned server. On a push that changed one route
        # that is most of this repository's CI cost for no extra information.
        #
        #   oracle=false              nothing a fixture depends on changed.
        #   oracle=true, probes=""    run EVERY probe -- when the change can move any fixture
        #                             (tools/lib/**, tools/oracle/**, the generator, the inventories input,
        #                             upstream/**), and on a schedule or by dispatch, which is the only
        #                             place a full re-record happens.
        #   oracle=true, probes=<csv> re-record ONLY those probes: whose SCRIPT changed, plus every
        #                             probe whose DECLARED fixture changed (resolved by grepping the
        #                             declarations, so the mapping cannot drift from the probes).
        #
        # WHAT A NARROWED RUN DOES NOT PROVE, because the previous sentence here ("the zero-diff check
        # still covers EVERY fixture, so a skipped probe whose output would have moved still fails") was
        # FALSE: the gate diffs the working tree against the commit, and a probe that never ran left its
        # fixture byte-identical by construction. A skipped probe is UNVERIFIED, not verified-equal. This
        # job must therefore select probes generously when in doubt, and the scheduled/dispatched full
        # sweep is the only run whose green covers the whole oracle.
        run: |
          set -eu
          event="${{ github.event_name }}"
          # A DISPATCH MAY NAME ITS SCOPE. Empty means every probe (a full parity sweep); a comma-separated list
          # means exactly those. This is how an agent asks for the expensive proof deliberately, instead of
          # waiting for a commit that happens to touch a shared input.
          if [ "${event}" = "workflow_dispatch" ] && [ -n "${{ inputs.probes }}" ]; then
            echo "dispatched run: re-recording the requested probes"
            echo "oracle=true" >> "$GITHUB_OUTPUT"
            echo "probes=${{ inputs.probes }}" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${event}" = "schedule" ] || [ "${event}" = "workflow_dispatch" ]; then
            echo "scheduled or dispatched run: re-recording every probe"
            echo "oracle=true" >> "$GITHUB_OUTPUT"
            echo "probes=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base="${{ github.event.before }}"
          if [ -z "${base}" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            base="$(git rev-parse 'HEAD^' 2>/dev/null || echo '')"
          fi
          if [ -z "${base}" ]; then
            echo "no parent commit to diff against; running the oracle"
            echo "oracle=true" >> "$GITHUB_OUTPUT"
            echo "probes=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "${base}" HEAD)"
          echo "${changed}"
          if ! printf '%s\n' "${changed}" | grep -qE '^(tools/probe-|tools/lib/|tools/oracle/|tools/build-generated-lib[.]mjs|tools/generate-upstream-inventories[.]mjs|tests/oracle/|tests/provider-wire/scenarios/|upstream/)'; then
            echo "oracle=false" >> "$GITHUB_OUTPUT"
            echo "probes=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # tools/oracle/** is the EXECUTION CORE: it decides how many times every probe runs, which
          # failures are reported and which fixture is compared, so it can move any fixture without
          # touching a probe. It belongs in the shared-input list for the same reason tools/lib/** does;
          # without it a change to the module alone selected NO probe and skipped the oracle entirely.
          if printf '%s\n' "${changed}" | grep -qE '^(tools/lib/|tools/oracle/|tools/build-generated-lib[.]mjs|tools/generate-upstream-inventories[.]mjs|upstream/)'; then
            echo "a shared input changed; re-recording every probe"
            echo "oracle=true" >> "$GITHUB_OUTPUT"
            echo "probes=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          probes=""
          for path in ${changed}; do
            case "${path}" in
              tools/probe-*.mjs) probes="${probes} $(basename "${path}")" ;;
                # A NEW SCENARIO INPUT IS A FIXTURE INPUT. tests/provider-wire/scenarios/*.json is discovered by
                # probe-provider-wire.mjs, so adding one changes that fixture. Without this arm the selection saw only a
                # Go/test change, ran no provider-wire recording, and 74 waiting inputs sat unrecorded while the job
                # reported on probe-backends -- the bounded-selector lesson in workflow form.
                tests/provider-wire/scenarios/*.json) probes="${probes} probe-provider-wire.mjs" ;;
            esac
          done
          for path in ${changed}; do
            case "${path}" in
              tests/oracle/*.json)
                fixture="$(basename "${path}")"
                owners="$(grep -l "fixture=${fixture}" tools/probe-*.mjs 2>/dev/null | xargs -r -n1 basename || true)"
                if [ -z "${owners}" ]; then
                  echo "fixture ${fixture} is declared by no probe; re-recording everything"
                  echo "oracle=true" >> "$GITHUB_OUTPUT"
                  echo "probes=" >> "$GITHUB_OUTPUT"
                  exit 0
                fi
                probes="${probes} ${owners}"
                ;;
            esac
          done
          selected="$(printf '%s\n' ${probes} | sort -u | tr '\n' ',' | sed 's/,$//')"
          echo "oracle=true" >> "$GITHUB_OUTPUT"
          echo "probes=${selected}" >> "$GITHUB_OUTPUT"
      - name: Report the decision
        run: |
          echo "oracle job will run: ${{ steps.diff.outputs.oracle }}"
          echo "probes to re-record: '${{ steps.diff.outputs.probes }}' (empty means all)"

  oracle:
    needs: changes
    if: needs.changes.outputs.oracle == 'true'
    runs-on: ubuntu-latest
    # MEASURED REALITY, twice. docs/development-loop.md recorded 51 min for a full sweep; the first full
    # sweep after the reusable build root landed (run 40074538942) took ~96 min and THEN failed on a harness
    # guard, so it was a real full pass, not an early abort. 96 min against a 120 bound is 20% headroom, which
    # one slow runner or one retried probe eats. The decision is 180: ~1.9x the worst observed pass, and a
    # wedged probe still fails at three hours instead of GitHub's default six. The warm build root should pull
    # the next sweep back toward ~80 min; when a measured sweep settles, tighten to ~1.5x THAT and record it.
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: SillyTavern/SillyTavern
          ref: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
          path: .reference/SillyTavern
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Pin npm build tool
        run: |
          npm install --global npm@11.17.0 --no-audit --no-fund
          test "$(npm --version)" = 11.17.0
      - name: Compute the reusable build-root identity
        id: oracle-build-cache
        # THE KEY MUST PROVE WHAT IT RESTORES, not merely suggest it: the pinned commit, the sha256 of the
        # reference package-lock.json that actually produced node_modules, and the Node that installed it.
        # A key that only LOOKED right would restore a tree built from a different dependency graph and hand
        # it to the recorder -- which is worse than re-paying the install, because the fixture bytes would
        # then be produced by dependencies nobody recorded with.
        run: |
          set -eu
          pinned="$(git -C .reference/SillyTavern rev-parse HEAD)"
          lock_hash="$(sha256sum .reference/SillyTavern/package-lock.json | cut -d' ' -f1)"
          node_version="$(node --version)"
          key="oracle-buildroot-${RUNNER_OS}-${node_version}-${pinned}-${lock_hash}"
          echo "pinned=${pinned}" >> "$GITHUB_OUTPUT"
          echo "lock_hash=${lock_hash}" >> "$GITHUB_OUTPUT"
          echo "key=${key}" >> "$GITHUB_OUTPUT"
          echo "reusable build root key: ${key}"
      - name: Restore the reusable oracle build root
        id: oracle-build-root
        # The build root lives in runner.temp, OUTSIDE the checkout: the generator refuses to wipe a path
        # that is the repository, the reference checkout, or an ancestor of either, because the rebuild
        # path starts with `rm -rf` (tools/oracle/build-root.mjs:isSafeBuildRoot).
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/oracle-build
          key: ${{ steps.oracle-build-cache.outputs.key }}
      - name: Restore the npm cache
        # Restoring ~/.npm does not change WHAT is installed (the lockfile does), only how much of it has
        # to be downloaded again.
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: oracle-npm-${{ runner.os }}-${{ steps.oracle-build-cache.outputs.lock_hash }}
          restore-keys: |
            oracle-npm-${{ runner.os }}-
      - name: Test observer comparison harness
        run: node --test tests/oracle/compare-observations.test.mjs
      - name: Build the GoTavern binary a runtime probe drives
        # A probe that compares a GoTavern-written tree against a pinned-written one needs a GoTavern
        # BINARY, not just the repository. It cannot build one on the development host (the build cache
        # there filled a 149 GB disk), so the oracle job builds it here and exports GOTAVERN_BINARY for
        # any probe that asks. A probe that needs it and cannot find it must FAIL rather than skip.
        env:
          CGO_ENABLED: '0'
        run: |
          set -eu
          go build -trimpath -o .oracle-bin/gotavern ./cmd/gotavern
          echo "GOTAVERN_BINARY=${PWD}/.oracle-bin/gotavern" >> "$GITHUB_ENV"
      - name: Rebuild pinned assets, inventories, and Node oracle
        # GOTAVERN_ORACLE_PROBES narrows WHICH probes re-record; empty means every probe, which is
        # what a schedule/dispatch run and any shared-input change does. A narrowed run is cheaper AND
        # WEAKER: the probes it skipped keep their committed bytes and are not verified (see the
        # `changes` job), so this step must not be read as covering the fixtures it did not record.
        env:
          GOTAVERN_ORACLE_PROBES: ${{ needs.changes.outputs.probes }}
          GOTAVERN_ORACLE_CONCURRENCY: ${{ inputs.oracle_concurrency }}
          # THE REPEATED COST, PAID ONCE PER CACHE KEY INSTEAD OF ONCE PER RUN: the clone and the
          # dependency install are skipped when this directory is provably the pinned tree with the same
          # dependency graph, and the decision is printed in this step's log as
          # `build root: reuse ...` or `build root: rebuild ... (why)`.
          GOTAVERN_ORACLE_BUILD_ROOT: ${{ runner.temp }}/oracle-build
        run: node tools/build-generated-lib.mjs .reference/SillyTavern
      - name: Report the build-root persistence
        # A cache HIT must be visible in the log, or a reviewer can only ASSUME the persistence worked.
        # Both halves are printed: what the cache action decided, and what the generator actually did
        # with the directory (the authoritative answer, because a restored tree can still fail a check).
        if: always()
        run: |
          set -eu
          echo "cache restore for this key: cache-hit='${{ steps.oracle-build-root.outputs.cache-hit }}' ('' = miss, 'true' = exact match)"
          echo "matched key: '${{ steps.oracle-build-root.outputs.cache-matched-key }}'"
          lock="${{ runner.temp }}/oracle-build/.gotavern-oracle-build-lock.json"
          if [ -f "${lock}" ]; then
            echo "build root lock present: $(cat "${lock}" | tr -d '\n')"
          else
            echo "build root lock absent: the run did not finish building a reusable root (it will be rebuilt next time)"
          fi
      - name: Mark the reusable build root complete
        id: oracle-build-root-ready
        if: always()
        run: |
          if [ -f "${{ runner.temp }}/oracle-build/.gotavern-oracle-build-lock.json" ]; then
            echo "complete=true" >> "$GITHUB_OUTPUT"
          else
            echo "complete=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Save the reusable build root
        # NEVER CACHE A HALF-BUILT TREE. The lock file is written only after `npm ci` succeeds, so its
        # presence IS the completeness proof that the next run's reuse check will demand; without it the
        # save is skipped and the next run rebuilds. The `cache-hit != 'true'` guard is not decoration:
        # actions/cache/save FAILS on a key that already exists, which would turn a cache hit into a red job.
        if: always() && steps.oracle-build-root.outputs.cache-hit != 'true' && steps.oracle-build-root-ready.outputs.complete == 'true'
        # The cache is an OPTIMISATION: a save that loses a race with a concurrent run on the same key
        # (the nightly cron and a push can overlap) reports "Unable to reserve cache" and exits 1, which
        # would turn a healthy recording into a red job for a reason that changes no byte. The restore side
        # and the generator's own reuse check are what the correctness rests on, so a save failure is
        # swallowed here and remains visible in the log.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/oracle-build
          key: ${{ steps.oracle-build-cache.outputs.key }}
      - name: Capture the Linux re-record for retrieval
        # WHY THIS EXISTS. Some fixtures CANNOT be recorded faithfully on the Windows development host.
        # Re-recording the tokenizer corpus there altered 326 pre-existing anchors by decoding UTF-8 as
        # Latin-1 (`chunks` became mojibake while `ids` and the recorded content-length stayed
        # identical), reproduced twice, from the worktree root with absolute paths -- so it is the
        # recorder's own encoding, not a copy mistake. A Windows re-record of such a fixture is
        # therefore NOT evidence, and the change can only be finished with Linux-recorded bytes.
        #
        # The project has no Linux developer host on purpose (the working machine is weak; CI is the
        # recording authority), so those bytes are published as a patch the author can apply and commit.
        # The zero-diff gate below still decides whether the commit is right: this step adds a way to
        # RETRIEVE the authority's answer, not a way to skip it.
        #
        # It runs BEFORE the gate because the gate fails the job, and a diagnostic that appears only
        # when nothing is wrong is not a diagnostic.
        if: always()
        run: |
          set -eu
          git diff --binary -- tests/oracle docs/api-inventory.md docs/config-inventory.md upstream > oracle-rerecord.patch
          echo "re-record patch bytes: $(wc -c < oracle-rerecord.patch)"
          git diff --stat -- tests/oracle docs/api-inventory.md docs/config-inventory.md upstream
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oracle-linux-rerecord
          path: oracle-rerecord.patch
          retention-days: 14
          if-no-files-found: warn
      - name: Verify generated results are committed
        run: |
          git diff --exit-code -- \
            docs/api-inventory.md \
            docs/config-inventory.md \
            upstream/generated \
            upstream/manifests/generated.sha256 \
            tests/oracle

  # The E (browser events/final state) and C (cancel/streaming) surfaces are what separate a
  # `partial` area from a `compatible` one -- docs/surface-coverage.md: "The chat-completions row
  # became `compatible` only after the fifth surface was MEASURED". Until this job existed, every
  # one of those claims rested on artifacts CI never read.
  #
  # IT CANNOT RECOMPUTE A COMPARISON FROM ITS LEGS AND MUST NOT PRETEND TO. The leg files are
  # gitignored deliberately -- tests/browser/.gitignore says why: "a committed leg invites someone to
  # treat a known divergence as the expected value". An earlier version of this job did recompute and
  # failed with ENOENT, having passed when tried by hand only because the untracked legs were on that
  # machine: the working tree, not the repository.
  #
  # What it checks instead, in tools/verify-browser-comparisons.mjs: that the committed artifacts are
  # coherent with themselves and with the claim they underwrite -- no unexplained divergence, the
  # provider-wire claim actually true, and the faithfulness guards still holding. A `compatible` row
  # resting on a false core claim is the failure mode this catches.
  browser-evidence:
    runs-on: ubuntu-latest
    # MEASURED: 0.2 min (it reads committed artifacts and recomputes their claims; it boots nothing).
    # Ten minutes bounds a wedged read instead of GitHub's 360-minute default.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Verify the browser comparison artifacts support their claims
        run: node tools/verify-browser-comparisons.mjs

  verify:
    runs-on: ubuntu-latest
    # MEASURED: 158 s door to door (docs/development-loop.md) and 3.6 min on the recent runs of this file;
    # the step list is gofmt + assets verify + the ORACLE EXECUTION CORE tests + `go test ./...` + vet +
    # `go build` + `gotavern assets verify` + six cross-compiles. Thirty minutes is 8x the measurement, so a
    # cold module cache or a slow runner still fits, and a wedged compile fails at 30 min rather than 6 h.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify compatibility documents cite committed oracle fixtures
        run: node tools/verify-oracle-citations.mjs
      - name: Test the oracle execution core
        # The double-run policy and the probe-execution primitive are CONTROL-PLANE code: they decide how many
        # times every probe runs, what happens when a run fails, and whether an empty selection is a success.
        # Until these tests existed, the policy function was defined and called from NOWHERE, so 118
        # declarations executed twice in every mode and GOTAVERN_ORACLE_DOUBLE_RUN had no effect -- and no CI
        # job could see it, because a fixture records what a probe OBSERVED, never how many times it ran.
        # These tests use injected fakes: no probe process, no browser, no network, a few hundred milliseconds.
        #
        # THE ARGUMENT IS A GLOB, NOT A DIRECTORY, BECAUSE A DIRECTORY DOES NOT DISCOVER ANYTHING. Measured on
        # the Node version this workflow pins (24.19.0): `node --test tests/oracle/` loads the directory as a
        # MODULE and dies with `Cannot find module .../tests/oracle`, running zero tests. A step like that fails
        # loudly for the wrong reason or, once it is "fixed" by wrapping it in `|| true`, passes while running
        # nothing -- the same class as `go test -run` matching no test. `node --test <glob>` discovers both files
        # here (and bash expands the glob before Node sees it), so this step cannot silently test nothing.
        run: node --test tests/oracle/*.test.mjs
      - name: Verify the release channel classifier decides tags correctly
        # `release.yml` and `docker.yml` both ask scripts/classify-version-tag.sh whether a tag is stable, and the
        # answer decides two things users feel: whether a tag becomes a GitHub PRE-release (so it is not what
        # `releases/latest/download/...`, and therefore every fresh install, fetches) and whether it moves the
        # Docker `:latest` alias. Neither behaviour can be observed without cutting a tag, which must never be
        # done experimentally on a release repository -- so the rule is a script with a table test, and this step
        # is what makes the table actually run.
        run: bash scripts/test-classify-version-tag.sh
      - name: Verify Go formatting
        # AGENTS.md requires gofmt on every change, and until this step nothing in CI enforced it:
        # `go build` and `go vet` both accept an unformatted file, so a formatting defect could land
        # and only surface as reviewer noise in the next lane's diff.
        #
        # This checks the COMMITTED bytes, because the checkout here is Linux/LF. Local `gofmt -l` in
        # a Windows work tree lists files with nothing wrong with them: core.autocrlf checks them out
        # as CRLF and gofmt then rewrites the whole file. Measured: `gofmt -l` over an LF checkout of
        # HEAD reports ZERO offenders while the same command in the CRLF work tree reported 308.
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi
          echo "all Go files are gofmt-clean"
      - name: Verify upstream asset manifests
        run: |
          go run ./tools/assetmanifest -root upstream/public -output upstream/manifests/public.sha256 -check
          go run ./tools/assetmanifest -root upstream/default -output upstream/manifests/default.sha256 -check
          go run ./tools/assetmanifest -root upstream/generated -output upstream/manifests/generated.sha256 -check
          go run ./tools/assetmanifest -root upstream/tokenizers -output upstream/manifests/tokenizers.sha256 -check
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build CLI
        run: go build -trimpath -o gotavern ./cmd/gotavern
      - name: Verify embedded assets
        run: ./gotavern assets verify
      - name: Cross-platform compile check
        # WHY THIS REPLACED A SIX-JOB MATRIX. The matrix built the real release binary for six
        # GOOS/GOARCH pairs on EVERY push, in six separate jobs -- six checkouts, six Go setups, six
        # module caches restored, for a fact (`does this package set compile on this platform?`) that
        # one job can answer with a cached toolchain. The release workflow is what actually produces
        # the six canonical archives, so building them here was duplicated work at six times the
        # overhead.
        #
        # `go build ./...` compiles every package (no link step, no output tree) under the target
        # platform, which is exactly what catches a platform-specific file being wrong -- the failure
        # mode the matrix existed for. CGO is off everywhere, as in distribution.
        #
        # A real cross-compile of the CLI remains available on demand: `Release` builds and publishes
        # all six canonical archives on a tag, and `Release qualification` builds the linux-amd64
        # archive in order to EXECUTE it (extract, boot, update, roll back). Neither is a per-push
        # gate, which is the point.
        shell: bash
        run: |
          set -euo pipefail
          export CGO_ENABLED=0
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            export GOOS="${target%%/*}" GOARCH="${target##*/}"
            echo "::group::go build ./... for ${GOOS}/${GOARCH}"
            go build ./...
            echo "::endgroup::"
          done
          echo "all six release platforms compile"
