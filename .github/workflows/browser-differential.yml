# Runs the browser differential against the CURRENT commit and REPORTS whether the committed comparison
# artefacts still describe it.
#
# WHY THIS EXISTS. Every other browser job only READS the committed *-comparison.json artefacts: the legs
# are gitignored by design, so no gate can recompute a comparison in CI and `verify-browser-comparisons`
# can only check an artefact against itself. The consequence was that an artefact recorded months ago kept
# asserting provider-wire parity for the current tree, and nothing could notice that HEAD had moved. This
# job closes that by RUNNING the drives (pinned SillyTavern at the baseline commit on one leg, the Go HEAD
# binary on the other) and diffing each freshly produced comparison against the committed one, field by
# field, with tools/browser-evidence/freshness.mjs.
#
# IT DOES NOT COMMIT. Its output is the fresh artefacts (uploaded) plus a freshness verdict per artefact in
# the job summary. Refreshing a committed artefact stays a human/agent decision: the diff names the field
# that moved, and the re-record is `git diff` away once somebody has read why it moved.
#
# IT IS NOT A SCHEDULED GATE ON `main`. The verifier step IS fatal (a fresh artefact that does not support
# its own claim is a defect), but the freshness comparison is report-only: a nightly job that is red every
# night for a known-stale artefact is a red everybody learns to ignore, which is the failure mode a gate
# like this is supposed to prevent.
#
# COST. Each source costs six browser drives (stream, cancel, non-stream x two legs) plus a generation
# pair, so a full sweep is ~30-60 minutes. Narrow it with the `sources` input.
#
# SETUP IS PERSISTED, NOT REPEATED. Three actions/cache entries (pinned server node_modules, harness
# node_modules, Playwright's browser download) are restored before the installs and let an install step
# SKIP, and each key is composed so a hit can only mean "this is the install this run would have made":
# the pinned commit + that checkout's lockfile for the reference, the harness lockfile for the harness
# and for the browser bundle. Measured on run 40068803201 (no cache), setup was only 1.2 minutes, so the
# saving today is small; what the cache really buys is that the dependency state is stated by a key
# instead of implied by whatever the runner image happens to carry, and that the setup cost does not
# grow with every dependency the harness acquires.
#
# WHAT A HIT CAN STILL HIDE, stated because a skip is a decision not to run something:
#   * a cached node_modules that is INCOMPLETE -- the key proves which install it should be, never that
#     the archive is intact. A truncated cache restores, skips `npm ci`, and fails later inside a drive;
#   * for Playwright, the OS packages are NOT cached (they are apt-installed), which is why a browser-cache
#     hit still runs `playwright install-deps` rather than skipping the whole step;
#   * a stale cache whose key still matches cannot happen by construction (the key contains the commit and
#     the lockfile hash, and no restore-keys are configured), but a cache written by a DIFFERENT workflow
#     with the same key could. The key prefix per cache is that guard, and it is why the three prefixes
#     differ.

name: Browser differential

on:
  # A PUSH THAT CHANGES THE ASSET GATE MUST PROVE THE ASSET GATE. The picture surface has its own files and
  # its own cheap drive (two browser boots and one comparison, ~5 minutes), and it is the ONE surface whose
  # evidence could not be produced any other way: this workflow has no `push` trigger, `workflow_dispatch`
  # cannot be fired from a branch that does not have it on the default branch, and a lane that adds a gate it
  # cannot run is a gate nobody has seen execute (AGENTS.md 7). A push run therefore narrows itself to the
  # asset surface -- see the `MODE` env in the job -- so this costs minutes, not the hour a full sweep costs.
  push:
    paths:
      - 'tests/browser/asset-probe.mjs'
      - 'tests/browser/compare-asset-legs.mjs'
      # THE HELPER HARNESS PROVES ITSELF ON A PUSH THAT TOUCHES IT (AGENTS.md 7/47): the same reasoning as
      # the asset entries above, one surface over -- a lane that adds a gate it cannot run is a gate nobody
      # has seen execute.
      - 'tests/browser/helper-probe.mjs'
      - 'tests/browser/compare-helper-legs.mjs'
      - 'tests/browser/url-recorder.mjs'
      - 'tools/browser-evidence/other-surfaces.mjs'
      - 'tools/verify-browser-comparisons.mjs'
      # THE FILE THAT SERVES THE BROWSER'S IMAGES MUST RE-PROVE THE BROWSER'S IMAGES. Without this entry, a
      # change to the thumbnail handler -- the handler that answered 404 for every avatar while every gate
      # stayed green -- would not run the one gate that can see it. It is also what makes the mutation in the
      # companion commit observable at all, instead of a local edit no CI run could see.
      - 'internal/server/thumbnails.go'
      # THE WORKFLOW ITSELF. Measured: commit 555cbdc fixed the asset step's missing directory and started
      # NO browser run, because only the four files above were listed -- so the fix to this gate went
      # unverified by this gate, which is the same defect as a fix travelling with its gate. The
      # pull_request list already had this entry; the push list did not.
      - '.github/workflows/browser-differential.yml'
  # A PULL REQUEST THAT TOUCHES THE HARNESS MUST RE-PROVE THE EVIDENCE. Changing the drive, the
  # comparators, the catalogue or the verifier changes what the committed artefacts MEAN, so the sweep
  # this job performs is exactly the review question -- and it is the only way to run this workflow before
  # it exists on the default branch, since workflow_dispatch cannot be triggered from a branch that does
  # not have it there. Paths are limited to the harness itself: a Go change is covered by the CI lanes and
  # by the nightly run below, and a browser sweep on every server commit would cost an hour per push.
  pull_request:
    paths:
      - 'tests/browser/generation-probe.mjs'
      - 'tests/browser/sources.mjs'
      - 'tests/browser/compare-*-legs.mjs'
      - 'tests/browser/preset-kit.mjs'
      - 'tests/browser/capture-preset.mjs'
      - 'tests/browser/helper-probe.mjs'
      - 'tests/browser/compare-helper-legs.mjs'
      - 'tests/browser/url-recorder.mjs'
      - 'tests/browser/preset-gate-selftest.mjs'
      - 'tests/browser/run-against-pinned.mjs'
      - 'tests/browser/catalog.test.mjs'
      - 'tools/browser-evidence/**'
      - 'tools/verify-browser-comparisons.mjs'
      - '.github/workflows/browser-differential.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Which surface to re-record: generation | stream | cancel | preset | assets | helper | all'
        required: true
        default: 'all'
        type: choice
        options: [generation, stream, cancel, preset, assets, helper, all]
      sources:
        description: 'Comma-separated source ids (custom, groq, mistralai, ...), or empty for every source with a committed artefact'
        required: false
        default: ''
      commit_artifacts:
        # THE ONLY REASON THIS WORKFLOW MAY WRITE. A `preset` run produces two files that are EVIDENCE and
        # must live in the tree: the captured complex-preset fixture and the comparison artefact built from
        # it. They are committed by a separate, tiny job (`publish-preset`) that has write permission and
        # does nothing else, so the differential job itself stays read-only.
        description: 'Commit the captured preset fixture and its comparison artefact back to this branch'
        required: false
        default: false
        type: boolean
  schedule:
    # Nightly, off-peak and at a non-round minute. The freshness report is the thing that tells us the
    # committed evidence has drifted from HEAD; without a schedule it only runs when someone remembers.
    - cron: '43 5 * * *'

permissions:
  contents: read

concurrency:
  group: browser-differential-${{ github.ref }}
  cancel-in-progress: false

# THE BASELINE IS ONE STRING, used by the reference checkout AND by the cache keys below. Two literals
# would let a cache populated for one pinned tree be restored against a checkout of another: the keys are
# the only thing that distinguishes "the install this cache holds" from "the install this run needs".
env:
  PINNED_BASELINE_COMMIT: 06bde939fb1e9c4c8d8641d810f0a916b5bce127

jobs:
  differential:
    runs-on: ubuntu-latest
    # SIZED FROM THE MEASUREMENT, not from a round number. Run 40068803201 (the first full sweep, before
    # any cache) recorded its setup in 1.2 minutes total and was still inside the drive step at 25.5
    # minutes, with 15 sources x 8 browser drives to pay for; the whole job is projected at ~45 minutes.
    # 90 = twice that projection, which tolerates one slow source without letting a wedged browser hold a
    # runner for hours. The probe also has its own deadlines (30 s server wait, 60 s settings-ready, 60 s
    # quiescence, 60 s settle, 30 s connect), so a hung page normally fails in a few minutes and this cap
    # is the backstop rather than the first line of defence.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # THE PINNED REFERENCE IS THE ORACLE, at the baseline commit AGENTS.md names. Same checkout the
      # oracle job uses, so the two lanes cannot drift onto different baselines.
      - uses: actions/checkout@v4
        with:
          repository: SillyTavern/SillyTavern
          ref: ${{ env.PINNED_BASELINE_COMMIT }}
          path: .reference/SillyTavern
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ---------------------------------------------------------------------------------------------------
      # PERSISTENT SETUP. Three caches, each keyed so that a hit PROVES the install is the one this run
      # needs, because a hit SKIPS the install:
      #
      #   pinned server node_modules  <- pinned COMMIT + that checkout's own package-lock.json hash.
      #       The commit is what pins the tree (and therefore the manifest); the lockfile hash is what
      #       pins the dependency graph resolved from it. A baseline bump changes the commit, a lockfile
      #       change changes the hash: either one misses and the install runs.
      #   harness node_modules        <- tests/browser/package-lock.json hash (+ OS).
      #       The harness's only dependency is @playwright/test at a pinned version, so the lockfile hash
      #       IS the install identity. A different Playwright version cannot hit this key.
      #   Playwright browsers         <- the same lockfile hash (+ OS).
      #       The browser bundle is versioned BY the Playwright package that downloads it, and the path is
      #       OS-specific, so lockfile + OS identifies the download exactly.
      #
      # NO `restore-keys`. A partial restore would hand back an older tree while reporting cache-hit=false,
      # and the two states ("restored something" and "this is the right something") would then differ only
      # inside npm's own behaviour. Exact keys make the skip condition and the key one and the same fact.
      # ---------------------------------------------------------------------------------------------------
      - name: Cache the pinned server's node_modules
        id: cache-pinned-modules
        uses: actions/cache@v4
        with:
          path: .reference/SillyTavern/node_modules
          key: ${{ runner.os }}-pinned-node-modules-${{ env.PINNED_BASELINE_COMMIT }}-${{ hashFiles('.reference/SillyTavern/package-lock.json') }}

      - name: Cache the harness node_modules
        id: cache-harness-modules
        uses: actions/cache@v4
        with:
          path: tests/browser/node_modules
          key: ${{ runner.os }}-harness-node-modules-${{ hashFiles('tests/browser/package-lock.json') }}

      - name: Cache the Playwright browser download
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('tests/browser/package-lock.json') }}

      # The pinned leg is served by the pinned checkout's OWN server.js, which needs its own node_modules
      # (the comparator also reads node-fetch from there to install the transport redirect hook).
      - name: Install the pinned server's dependencies
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-pinned-modules.outputs.cache-hit }}" = "true" ]; then
            echo "pinned server node_modules: CACHE HIT for ${{ env.PINNED_BASELINE_COMMIT }} -- install SKIPPED"
          else
            echo "pinned server node_modules: cache MISS -- installing from the pinned checkout's own manifest"
            cd .reference/SillyTavern
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          fi

      # The harness is pinned to the baseline's own Playwright version (tests/browser/package.json says
      # why: a newer driver changes wait semantics and makes the measurement incomparable).
      #
      # THE TWO HALVES OF THIS STEP ARE KEYED SEPARATELY, because they are cached separately: node_modules
      # by the lockfile, the browser bundle by the Playwright version that ships in that same lockfile. A
      # hit on one and a miss on the other must still produce a working pair, which is why the skip is
      # decided per half rather than for the step as a whole.
      - name: Install the browser harness
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-harness-modules.outputs.cache-hit }}" = "true" ]; then
            echo "tests/browser/node_modules: CACHE HIT -- npm ci SKIPPED"
          else
            echo "tests/browser/node_modules: cache MISS -- npm ci"
            (cd tests/browser && npm ci --no-audit --no-fund)
          fi
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            # THE BROWSER BUNDLE IS NOT THE OS PACKAGES. `install --with-deps` is download + apt; a cache hit
            # covers only the download, so the apt half still runs. Skipping it as well would make the job
            # depend on whatever the runner image happens to ship, which is the kind of implicit input that
            # turns a green run into a mystery failure the day the image changes.
            echo "playwright chromium: CACHE HIT -- browser download SKIPPED, OS packages still ensured"
            (cd tests/browser && npx playwright install-deps chromium)
          else
            echo "playwright chromium: cache MISS -- downloading the browser and its OS packages"
            (cd tests/browser && npx playwright install --with-deps chromium)
          fi

      - name: Which setup branches this run took
        run: |
          echo "pinned server node_modules cache-hit: ${{ steps.cache-pinned-modules.outputs.cache-hit }}"
          echo "harness node_modules cache-hit:       ${{ steps.cache-harness-modules.outputs.cache-hit }}"
          echo "playwright browsers cache-hit:        ${{ steps.cache-playwright.outputs.cache-hit }}"
          echo "(true = the install above was skipped; false or empty = it ran)"

      # The catalogue's own contract: complete rows, every artefact claimed by exactly one source, and
      # ignore patterns that cover every leg name the harness writes. Cheap, and it fails before any
      # browser starts.
      - name: Catalogue and .gitignore contract
        run: node --test tests/browser/catalog.test.mjs

      - name: Build the binaries the drives run
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p .browser-bin
          go build -trimpath -o .browser-bin/gotavern ./cmd/gotavern
          go build -trimpath -o .browser-bin/mock-provider ./tools/mock-provider
          echo "GOTAVERN_BINARY=${PWD}/.browser-bin/gotavern" >> "$GITHUB_ENV"
          echo "GOTAVERN_MOCK_PROVIDER_BINARY=${PWD}/.browser-bin/mock-provider" >> "$GITHUB_ENV"
          echo "GOTAVERN_REFERENCE=${PWD}/.reference/SillyTavern" >> "$GITHUB_ENV"

      # THE DRIVES. Each source is run on BOTH legs with the SAME drive (PROBE_SOURCE selects the
      # catalogue row), then the two legs are compared. The comparison is written straight into
      # tests/browser so the verifier below judges the FRESH artefact, not the committed one; the
      # committed version is saved first so freshness.mjs has something to compare against.
      - name: Record the selected drives
        id: record
        # A `preset`-only run must NOT fall into this step's "everything that is not generation is
        # streaming" branch and pay for fifteen sources' streaming drives. The preset lane has its own
        # steps below, and `all` still runs both. An `assets`-only run has its own step for the same reason.
        if: ${{ (github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) != 'preset' && (github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) != 'assets' && (github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) != 'helper' }}
        env:
          # A SCHEDULED RUN HAS NO INPUTS, so an empty mode means "everything": the nightly job is the
          # one that must compare every surface, and a `|| 'all'` here is what makes that true without a
          # second code path. A PUSH RUN is the asset gate proving itself (see `on.push`), so it narrows to
          # `assets` rather than paying an hour for fifteen sources it did not touch.
          MODE: ${{ inputs.mode || (github.event_name == 'push' && 'assets' || 'all') }}
          # THE HELPER SURFACE NARROWS ITSELF THE SAME WAY. On a push it runs only when the pushed commits
          # touch the helper harness (or this workflow, which the commit payload also contains); the
          # comparison is a substring over the commit JSON, so a commit MESSAGE that says helper runs it too
          # -- that costs minutes and can never make a wrong verdict right.
          MODE_HELPER: ${{ inputs.mode || (github.event_name == 'push' && (contains(toJSON(github.event.commits), 'tests/browser/helper-') && 'helper' || 'none') || 'all') }}
          SOURCES_CSV: ${{ inputs.sources }}
          # The committed artefacts were paced at 14 frames; keep the pace identical so a freshness
          # difference is about behaviour rather than about how many chunks the peer wrote.
          PROBE_FRAME_COUNT: '14'
          PROBE_FRAME_MS: '250'
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/browser-differential"
          mkdir -p "$work/legs" "$work/committed" "$work/failed"
          : > "$work/freshness.txt"

          list_sources() {
            # A source the probe CANNOT drive is excluded here rather than failing every sweep: workers_ai
            # is catalogued with `driveSupported: false` and its two artefacts carry an explicit
            # record-schema exemption in the verifier, so attempting to drive it would abort a run that has
            # nothing to learn from the attempt.
            node -e 'import("./tests/browser/sources.mjs").then(m => { const s = m.SOURCES.filter(x => x.evidence && x.evidence[process.argv[1]] && x.driveSupported !== false); console.log(s.map(x => x.id).join(" ")); })' "$1"
          }
          # THE ARTEFACT NAME COMES FROM THE CATALOGUE, not from string surgery on a slug. The first
          # version derived it with `replace(/^(generation|streaming)-/, "")` + `-comparison.json`, which
          # is right for every source EXCEPT custom: its artefact is `generation-comparison.json`, the
          # slice left `comparison.json`, and run 40068803201 therefore wrote
          # `generation-comparison.json-comparison.json` while leaving the real custom artefact untouched
          # -- a stale file, a junk file, and a freshness block for neither. The catalogue already knows
          # the exact file name, so it is asked instead.
          artifact_for() {
            node -e 'import("./tests/browser/sources.mjs").then(m => {
              const source = m.BY_ID.get(process.argv[1]);
              const file = source && source.evidence ? source.evidence[process.argv[2]] : null;
              if (!file) { console.error("no " + process.argv[2] + " artefact for " + process.argv[1]); process.exit(1); }
              console.log(file);
            })' "$1" "$2"
          }
          # One leg pair: the GoTavern leg builds/serves itself, the pinned leg is given the reference.
          record_pair() {
            local src="$1" tag="$2" mode="$3"
            local gv="$work/legs/$tag-gotavern.json" pn="$work/legs/$tag-pinned.json"
            if [ -n "$mode" ]; then
              PROBE_MODE="$mode" PROBE_SOURCE="$src" node tests/browser/generation-probe.mjs --report "$gv" || return 1
              PROBE_MODE="$mode" PROBE_SOURCE="$src" PROBE_PINNED_REDIRECT_FILE="$work/legs/redirect-$tag.json" \
                node tests/browser/run-against-pinned.mjs generation-probe.mjs -- --report "$pn" || return 1
            else
              PROBE_SOURCE="$src" node tests/browser/generation-probe.mjs --report "$gv" || return 1
              PROBE_SOURCE="$src" PROBE_PINNED_REDIRECT_FILE="$work/legs/redirect-$tag.json" \
                node tests/browser/run-against-pinned.mjs generation-probe.mjs -- --report "$pn" || return 1
            fi
          }
          save_committed() {
            local artifact="$1"
            if git cat-file -e "HEAD:tests/browser/$artifact" 2>/dev/null; then
              git show "HEAD:tests/browser/$artifact" > "$work/committed/$artifact"
            else
              : > "$work/committed/$artifact.absent"
            fi
          }

          if [ -z "${SOURCES_CSV// /}" ]; then
            if [ "$MODE" = "generation" ]; then SOURCES="$(list_sources generation)"; else SOURCES="$(list_sources streaming)"; fi
          else
            SOURCES="${SOURCES_CSV//,/ }"
          fi
          echo "sources: $SOURCES"
          echo "sources=$SOURCES" >> "$GITHUB_OUTPUT"
          failures=0

          for src in $SOURCES; do
            # The tag names the LEG FILES in $RUNNER_TEMP and may be anything unique; the ARTEFACT name
            # is the catalogue's own filename, because that is the only name a reader and the verifier
            # agree on.
            echo "::group::$src"
            if [ "$MODE" = "generation" ] || [ "$MODE" = "all" ]; then
              artifact="$(artifact_for "$src" generation)"
              save_committed "$artifact"
              if record_pair "$src" "gen-$src" ""; then
                if PROBE_SOURCE="$src" node tests/browser/compare-generation-legs.mjs "$work/legs/gen-$src-gotavern.json" "$work/legs/gen-$src-pinned.json" > "tests/browser/$artifact"; then
                  echo "recorded $artifact"
                else
                  echo "::error::$src: the generation comparison was judged UNFAITHFUL; see the comparator output in the uploaded legs"
                  cp "tests/browser/$artifact" "$work/failed/$artifact" || true
                  rm -f "tests/browser/$artifact"
                  failures=$((failures + 1))
                fi
              else
                echo "::error::$src: a generation leg failed to drive"
                failures=$((failures + 1))
              fi
            fi
            if [ "$MODE" != "generation" ]; then
              artifact="$(artifact_for "$src" streaming)"
              save_committed "$artifact"
              # The streaming artefact covers THREE surfaces (stream, cancel, non-stream), so all three
              # drives are recorded whatever the dispatch asked for; `mode` only chooses which artefacts
              # this run refreshes.
              if record_pair "$src" "stream-$src" "stream" \
                 && record_pair "$src" "cancel-$src" "cancel" \
                 && record_pair "$src" "nonstream-$src" ""; then
                PROBE_SOURCE="$src" node tests/browser/compare-streaming-legs.mjs \
                  "$work/legs/stream-$src-gotavern.json" "$work/legs/stream-$src-pinned.json" \
                  "$work/legs/cancel-$src-gotavern.json" "$work/legs/cancel-$src-pinned.json" \
                  "$work/legs/nonstream-$src-gotavern.json" "$work/legs/nonstream-$src-pinned.json" \
                  > "tests/browser/$artifact" || { echo "::error::$src: the streaming comparison refused"; failures=$((failures + 1)); }
                echo "recorded $artifact"
              else
                echo "::error::$src: a streaming/cancel/non-stream leg failed to drive"
                failures=$((failures + 1))
              fi
            fi
            echo "::endgroup::"
          done
          echo "failures=$failures" >> "$GITHUB_OUTPUT"

      # -------------------------------------------------------------------------------------------------
      # THE BROWSER ASSET DIFFERENTIAL (GOAL.md §8.4 Q3-Q7, AGENTS.md 42-46, ARCHITECTURE.md §35.2).
      #
      # WHAT IT ANSWERS: does a browser loading the unmodified pinned frontend DISPLAY the character-list
      # avatars, the chat-message avatars, the persona thumbnail and the background, on both legs?
      #
      # WHY IT IS SEPARATE FROM EVERY OTHER DRIVE HERE. The other drives compare requests and responses.
      # This one compares what a browser DECODED: `complete`, `naturalWidth`, the computed
      # `background-image`, and the browser's own "Failed to load resource" complaints. The defect that
      # prompted it -- `/thumbnail` 404 on GoTavern, 200 on pinned -- was already RECORDED in
      # extension-tavern-helper-comparison.json beside `differenceCount: 0`, because a `knownReason`
      # excused it and nothing asserted that an `<img>` decoded. A status allowlist therefore does not
      # exist in compare-asset-legs.mjs, and a thumbnail that is not 200/`image/*`/non-empty is a failure
      # on both legs (AGENTS.md 46).
      #
      # CHEAP: two browser boots and one comparison. It runs on a push that touches the asset gate itself
      # (see `on.push`), on `assets` dispatch, and on the nightly `all` sweep.
      # -------------------------------------------------------------------------------------------------
      - name: Record the asset legs (both legs)
        id: asset
        if: ${{ (github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) == 'assets' || (github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) == 'all' }}
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/browser-differential"
          # BOTH DIRECTORIES, because this step runs when `Record the selected drives` did NOT: on an
          # `assets` run that step is skipped, so its `mkdir -p "$work/committed"` never happened and the
          # first version of this block died on `asset-comparison.json.absent: No such file or directory`
          # (run 40201801282) -- a harness bug in the step, not a finding about the product.
          mkdir -p "$work/legs" "$work/committed"
          failures=0
          # The committed artefact is staged so the freshness report can compare it with the fresh one.
          if git cat-file -e "HEAD:tests/browser/asset-comparison.json" 2>/dev/null; then
            git show "HEAD:tests/browser/asset-comparison.json" > "$work/committed/asset-comparison.json"
          else
            : > "$work/committed/asset-comparison.json.absent"
          fi
          # BOTH LEGS STAGE THEIR OWN COPY OF THE SAME FIXTURE (a card PNG, a background PNG, a persona
          # PNG) from the same builder inside the probe, and the report records the digests. The comparator
          # refuses a pair whose fixtures differ, so "same fixture" is measured rather than asserted.
          # ONE DATA ROOT PER LEG, AND THE LEG'S SERVER MUST SERVE THE ONE THE PROBE STAGES. The first
          # version let run-against-pinned.mjs create its own root while the probe created a second one and
          # staged there, so the pinned leg read an empty tree: 0 character rows and the persona thumbnail
          # 404'd on pinned only (run 40202885055). `--data-root` is passed to the wrapper (which boots the
          # server on it) AND through `--` to the probe (which stages the fixture into it).
          tree_gotavern="$work/asset-tree-gotavern"
          tree_pinned="$work/asset-tree-pinned"
          rm -rf "$tree_gotavern" "$tree_pinned"
          mkdir -p "$tree_gotavern" "$tree_pinned"
          if node tests/browser/asset-probe.mjs --data-root "$tree_gotavern" --report "$work/legs/asset-gotavern-leg.json"; then
            echo "recorded the GoTavern asset leg"
          else
            echo "::error::the GoTavern asset leg failed to drive"
            failures=$((failures + 1))
          fi
          if node tests/browser/run-against-pinned.mjs asset-probe.mjs -- --data-root "$tree_pinned" --report "$work/legs/asset-pinned-leg.json"; then
            echo "recorded the pinned asset leg"
          else
            echo "::error::the pinned asset leg failed to drive"
            failures=$((failures + 1))
          fi
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          # A drive failure is reported above and judged below; this step does not mask it.
          exit 0

      - name: Compare the asset legs
        id: asset-compare
        if: ${{ (github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) == 'assets' || (github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) == 'all' }}
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/browser-differential"
          if [ "${{ steps.asset.outputs.failures }}" != "0" ]; then
            echo "::error::an asset leg failed to drive, so there is no comparison to judge"
            exit 1
          fi
          # The comparator prints the artefact on stdout and exits non-zero when a guard fails: the file is
          # still written, because a red artefact is the evidence for the finding.
          node tests/browser/compare-asset-legs.mjs \
            "$work/legs/asset-gotavern-leg.json" "$work/legs/asset-pinned-leg.json" \
            > tests/browser/asset-comparison.json

      # THE 酒馆助手 DIFFERENTIAL (AGENTS.md 47 and 50; GOAL.md Q8-Q12).
      #
      # WHAT WAS MISSING UNTIL NOW. extension-tavern-helper-comparison.json installs the pinned extension,
      # reaches user state, counts 32 extension containers and compares the requests the page makes -- and
      # never executes one line of helper script. The extension's architecture is user code in an
      # UNSANDBOXED same-origin srcdoc iframe whose bridge is property injection at document start
      # (src/iframe/predefine.js), with 25 static ../../../../../ imports of the host's own modules. This leg
      # installs the same pinned revision, opens a real chat, enables one probe script through the helper's
      # own API, and asserts the four things that make it effectively run: the iframe is present and not
      # sandboxed with window.parent.TavernHelper reachable inside it; the chat variable the script wrote
      # reached the CHAT FILE; the helper's own renderer produced the message DOM; and every URL those
      # iframes put into the DOM answered 200 with bytes.
      #
      # FOUR LEGS, NOT TWO. helper-on and helper-off for each subject: a comparison whose on and off runs are
      # identical is HARNESS NON-DISCRIMINATING and must fail itself (AGENTS.md 50), so the pair is recorded
      # together rather than trusted.
      - name: Record the helper legs (both subjects, helper on and off)
        id: helper
        if: ${{ env.MODE_HELPER == 'helper' || env.MODE_HELPER == 'all' }}
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/browser-differential"
          mkdir -p "$work/legs" "$work/committed"
          # Staged so the freshness report can compare the committed artefact with the fresh one.
          if git cat-file -e "HEAD:tests/browser/helper-comparison.json" 2>/dev/null; then
            git show "HEAD:tests/browser/helper-comparison.json" > "$work/committed/helper-comparison.json"
          else
            : > "$work/committed/helper-comparison.json.absent"
          fi
          failures=0
          # ONE DATA ROOT PER LEG, and the same --data-root is passed to the wrapper (which boots the server
          # on it) and through -- to the probe (which installs the extension into it). The asset lane paid for
          # this lesson in run 40202885055: two roots meant the pinned leg read an empty tree.
          for variant in on off; do
            for subject in gotavern pinned; do
              tree="$work/helper-tree-$subject-$variant"
              rm -rf "$tree"
              mkdir -p "$tree"
              report="$work/legs/helper-$subject-$variant.json"
              if [ "$subject" = "gotavern" ]; then
                if node tests/browser/helper-probe.mjs --data-root "$tree" --variant "$variant" --report "$report"; then
                  echo "recorded the $subject/$variant helper leg"
                else
                  echo "::error::the $subject/$variant helper leg failed to drive"
                  failures=$((failures + 1))
                fi
              else
                if node tests/browser/run-against-pinned.mjs helper-probe.mjs -- --data-root "$tree" --variant "$variant" --report "$report"; then
                  echo "recorded the $subject/$variant helper leg"
                else
                  echo "::error::the $subject/$variant helper leg failed to drive"
                  failures=$((failures + 1))
                fi
              fi
            done
          done
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          # A drive failure is reported above and judged below; this step does not mask it.
          exit 0

      - name: Compare the helper legs
        id: helper-compare
        if: ${{ env.MODE_HELPER == 'helper' || env.MODE_HELPER == 'all' }}
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/browser-differential"
          if [ "${{ steps.helper.outputs.failures }}" != "0" ]; then
            echo "::error::a helper leg failed to drive, so there is no comparison to judge"
            exit 1
          fi
          node tests/browser/compare-helper-legs.mjs \
            --gotavern-on "$work/legs/helper-gotavern-on.json" \
            --gotavern-off "$work/legs/helper-gotavern-off.json" \
            --pinned-on "$work/legs/helper-pinned-on.json" \
            --pinned-off "$work/legs/helper-pinned-off.json" \
            --out tests/browser/helper-comparison.json \
            > /dev/null
          echo "helper comparison written to tests/browser/helper-comparison.json"

      # -------------------------------------------------------------------------------------------------
      # THE COMPLEX-PRESET DIFFERENTIAL (AGENTS.md rule 8 and rule 9).
      #
      # TWO SCENARIOS, ONE ARTEFACT. `keep` drives the scenario at the smallest `openai_max_context` at
      # which the pinned frontend RETAINS the oldest history turn; `drop` drives it one token lower, where
      # the pinned frontend drops that turn. Both numbers are bisected from the pinned frontend itself
      # (capture-preset.mjs) and committed in the fixture, so the pair is a measured boundary rather than a
      # guess. The claim of the resulting artefact is: the SAME preset produces the same request BYTES on
      # both servers at BOTH sides of that boundary -- which cannot pass if a token count is off by one,
      # because the retained message set changes.
      #
      # The streaming/cancel surfaces are untouched by this lane: they are three-drive artefacts with their
      # own comparator, and mixing them in here would make one failure unattributable.
      # -------------------------------------------------------------------------------------------------
      - name: Capture the complex preset from the pinned frontend
        if: ${{ (github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) == 'preset' || (github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) == 'all' }}
        # THE CAPTURE NOW BISECTS BY SENDING. A dry assembly does not bind (run 40082539457: a pair one
        # token apart produced the drop shape on both legs), so the boundary is measured by driving the
        # real send against a recording peer -- ~30 sends instead of ~15 dry assemblies. 20 minutes is
        # several times the measured cost and still bounds a wedged page inside the job's own 90.
        timeout-minutes: 20
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/browser-differential"
          mkdir -p "$work/legs" "$work/committed"
          # The capture runs against the PINNED leg only: the fixture is what the pinned frontend held,
          # and both legs then replay it. `run-against-pinned` supplies --base-url and GOTAVERN_REFERENCE.
          # THE PATH IS ABSOLUTE ON PURPOSE: that wrapper spawns the capture with `cwd: tests/browser`, so
          # a relative --out would land in tests/browser/tests/browser/fixtures/.
          # THE SELF-CHECK RUNS FIRST, AND IT IS NOT OPTIONAL. `node --check` validates syntax only and
          # cannot see an undefined identifier; a plain import would boot a browser. This resolves the
          # module's top-level constants and exits, so a reference error fails here in under a second
          # instead of after the pinned server has booted.
          node tests/browser/capture-preset.mjs --self-check
          node tests/browser/run-against-pinned.mjs capture-preset.mjs -- \
            --out "$PWD/tests/browser/fixtures/preset-complex-settings.json"

      # THE PAIR IS MEASURED BY THE PINNED LEG THAT PRODUCES THE COMPARED REQUEST, not by the capture.
      # Seven runs failed because the boundary was measured by a merely similar procedure (first a dry
      # assembly, then the capture's own sends) and the drive's send assembled a different number of
      # messages at the same context. preset-boundary-search.mjs drives the pinned leg once per candidate
      # -- same program, same arguments, same clean state -- and records the provider request each one
      # produced, then writes the pair to preset-boundary.json.
      - name: Search the preset boundary with the pinned leg
        if: ${{ (github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) == 'preset' || (github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) == 'all' }}
        timeout-minutes: 25
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/browser-differential"
          mkdir -p "$work/legs" "$work/committed"
          node tests/browser/preset-boundary-search.mjs --self-check
          node tests/browser/preset-boundary-search.mjs --legs "$work/legs" --out "$work/preset-boundary.json"

      - name: Record the preset boundary pair (both legs)
        id: preset
        if: ${{ (github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) == 'preset' || (github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) == 'all' }}
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/browser-differential"
          boundary="$work/preset-boundary.json"
          if [ ! -f "$boundary" ]; then
            echo "::error::the pinned-leg boundary search produced no pair; the legs are not driven"
            echo "failures=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          keep=$(node -e 'console.log(require(process.argv[1]).keepContext)' "$boundary")
          drop=$(node -e 'console.log(require(process.argv[1]).dropContext)' "$boundary")
          echo "boundary measured by the pinned leg: keep=$keep drop=$drop"
          failures=0
          drive() {
            local variant="$1"
            local context="$2"
            echo "::group::preset $variant at max_context=$context"
            # The GoTavern leg builds and boots itself; the pinned leg is the reference checkout. The
            # source is `custom` because its peer travels in `custom_url` on BOTH legs, so neither leg can
            # reach a real provider (rule 14) and no transport redirect is needed.
            if ! PROBE_MODE=preset PROBE_SOURCE=custom PROBE_PRESET_VARIANT="$variant" PROBE_PRESET_CONTEXT="$context" \
              node tests/browser/generation-probe.mjs --report "$work/legs/preset-$variant-gotavern.json"; then
              echo "::error::preset $variant: the GoTavern leg failed to drive"
              failures=$((failures + 1))
            fi
            if ! PROBE_MODE=preset PROBE_SOURCE=custom PROBE_PRESET_VARIANT="$variant" PROBE_PRESET_CONTEXT="$context" \
              PROBE_PINNED_REDIRECT_FILE="$work/legs/redirect-preset-$variant.json" \
              node tests/browser/run-against-pinned.mjs generation-probe.mjs -- --report "$work/legs/preset-$variant-pinned.json"; then
              echo "::error::preset $variant: the pinned leg failed to drive"
              failures=$((failures + 1))
            fi
            echo "::endgroup::"
          }
          drive keep "$keep"
          drive drop "$drop"
          echo "failures=$failures" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Compare the preset legs
        # THE MODE GATE IS PART OF THIS CONDITION, not implied by the outputs of a step that may not have
        # run. `steps.preset.outputs.failures == '0'` alone is TRUE when `steps.preset` was skipped:
        # GitHub coerces a missing output to 0 and '0' to 0, so the two compare equal. Run 40073821604
        # (mode=stream) therefore executed this step with no preset legs recorded, failed on the missing
        # files, and took the streaming batch down with it. The condition now says exactly what it means:
        # the preset path runs only in a preset/all dispatch, and only when its recording reported success.
        if: ${{ ((github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) == 'preset' || (github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) == 'all') && steps.preset.outputs.failures == '0' }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/browser-differential"
          artifact=preset-complex-comparison.json
          if git cat-file -e "HEAD:tests/browser/$artifact" 2>/dev/null; then
            git show "HEAD:tests/browser/$artifact" > "$work/committed/$artifact"
          else
            # The freshness report distinguishes "this run did not produce it" from "there was nothing
            # committed to compare against", so a first run says which by writing the marker the report
            # already understands instead of leaving the loop to guess from a missing file.
            : > "$work/committed/$artifact.absent"
          fi
          # The comparator prints the artefact on stdout whether the verdict is equal or not, and exits
          # non-zero for BOTH an unfaithful differential and a genuine mismatch. The file is kept either
          # way (uploaded as evidence) but only an exit 0 lets the publish job commit it.
          node tests/browser/compare-preset-legs.mjs \
            "$work/legs/preset-keep-gotavern.json" "$work/legs/preset-keep-pinned.json" \
            "$work/legs/preset-drop-gotavern.json" "$work/legs/preset-drop-pinned.json" \
            --boundary "$work/preset-boundary.json" \
            > "tests/browser/$artifact"

      - name: Prove the preset gate has teeth
        # Same two-part condition as the comparator above: this step proves the gate has teeth by
        # mutating the recorded legs, so it cannot run when there are no preset legs.
        if: ${{ ((github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) == 'preset' || (github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) == 'all') && steps.preset.outputs.failures == '0' }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/browser-differential"
          node tests/browser/preset-gate-selftest.mjs \
            "$work/legs/preset-keep-gotavern.json" "$work/legs/preset-keep-pinned.json" \
            "$work/legs/preset-drop-gotavern.json" "$work/legs/preset-drop-pinned.json" \
            --boundary "$work/preset-boundary.json"

      - name: Stage the preset evidence for publishing
        if: ${{ inputs.commit_artifacts }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publish/tests/browser/fixtures"
          cp tests/browser/preset-complex-comparison.json "$RUNNER_TEMP/publish/tests/browser/"
          cp tests/browser/fixtures/preset-complex-settings.json "$RUNNER_TEMP/publish/tests/browser/fixtures/"

      - name: Upload the preset evidence to publish
        if: ${{ inputs.commit_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: preset-evidence
          path: ${{ runner.temp }}/publish
          retention-days: 14

      # THE VERIFIER, against the artefacts this run just produced. This is the step that can fail the
      # job: a freshly recorded artefact that does not support its own claim is a defect in the product
      # or in the harness, not a stale document.
      - name: Verify the FRESH artefacts support their claims
        if: ${{ !cancelled() && (steps.record.outputs.failures == '0' || steps.record.outputs.failures == '') && (steps.preset.outputs.failures == '0' || steps.preset.outputs.failures == '') && (steps.asset.outputs.failures == '0' || steps.asset.outputs.failures == '') && (steps.helper.outputs.failures == '0' || steps.helper.outputs.failures == '') }}
        run: node tools/verify-browser-comparisons.mjs

      # FRESHNESS: does the fresh artefact still say what the committed one says? Report-only, with the
      # verdict written to the job summary and the files uploaded.
      - name: Freshness report (committed vs freshly recorded)
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/browser-differential"
          {
            echo '### Browser differential freshness'
            echo
            echo "Run mode: \`${{ (github.event_name == 'push' && 'assets' || (inputs.mode || 'all')) }}\`, sources: \`${{ steps.record.outputs.sources || '(none recorded)' }}\`"
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          stale=0
          fresh=0
          missing=0
          for committed in "$work"/committed/*; do
            artifact="$(basename "$committed")"
            case "$artifact" in
              *.absent) continue ;;
            esac
            if [ ! -f "tests/browser/$artifact" ]; then
              echo "NOT-RECORDED $artifact (this run did not produce it)" | tee -a "$GITHUB_STEP_SUMMARY"
              missing=$((missing + 1))
              continue
            fi
            if node tools/browser-evidence/freshness.mjs "$committed" "tests/browser/$artifact" >> "$work/freshness.txt" 2>&1; then
              fresh=$((fresh + 1))
            else
              stale=$((stale + 1))
            fi
          done
          cat "$work/freshness.txt" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo
            echo "**$fresh fresh, $stale stale, $missing not re-recorded.**"
            echo
            if [ "$stale" -gt 0 ]; then
              echo 'A stale artefact is not a failure of this job by itself: it says the committed evidence no longer describes HEAD. Read the named field, decide whether the change is the product or the harness, and re-record by committing the uploaded file.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "freshness: $fresh fresh, $stale stale, $missing not re-recorded"

      - name: Upload the freshly recorded artefacts and legs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-differential-${{ github.run_id }}
          path: |
            tests/browser/*-comparison.json
            tests/browser/fixtures/preset-*.json
            ${{ runner.temp }}/browser-differential/**
          retention-days: 14
          if-no-files-found: warn

      # BOTH RECORDING STEPS, AND ONLY WHEN ONE OF THEM ACTUALLY FAILED. A skipped step reports an empty
      # output, so `!= '0'` alone would fail a `preset`-only run at the record step it never entered.
      - name: Fail if a drive could not be recorded or judged
        if: ${{ (steps.record.outputs.failures != '0' && steps.record.outputs.failures != '') || (steps.preset.outputs.failures != '0' && steps.preset.outputs.failures != '') || (steps.asset.outputs.failures != '0' && steps.asset.outputs.failures != '') || (steps.helper.outputs.failures != '0' && steps.helper.outputs.failures != '') }}
        run: |
          echo "::error::a drive could not be recorded or was judged unfaithful; see the group output above."
          echo "generation/stream failures: ${{ steps.record.outputs.failures }}"
          echo "preset failures:            ${{ steps.preset.outputs.failures }}"
          exit 1

  # THE ONLY JOB THAT MAY WRITE, and it does nothing but commit the preset evidence produced by the run
  # above. Keeping `contents: read` on the differential job means a compromised probe cannot push; keeping
  # the commit in its own job means the evidence is still committed by the SAME run that produced it, so a
  # green run and the committed bytes cannot describe different code (AGENTS.md rule 5).
  publish-preset:
    needs: differential
    if: ${{ inputs.commit_artifacts && needs.differential.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/download-artifact@v4
        with:
          name: preset-evidence
          path: .
      - name: Commit the captured fixture and its comparison artefact
        run: |
          set -euo pipefail
          git config user.name 'gotavern-ci'
          git config user.email 'ci@gotavern.invalid'
          git add tests/browser/fixtures/preset-complex-settings.json tests/browser/preset-complex-comparison.json
          if git diff --cached --quiet; then
            echo "the recorded evidence is byte-identical to the commit that produced it; nothing to publish"
            exit 0
          fi
          git commit -m "Record the complex-preset differential (run ${{ github.run_id }})

          Captured from the pinned frontend by capture-preset.mjs, driven on both legs at the bisected
          context boundary, compared byte-for-byte by compare-preset-legs.mjs, and published by the same
          run that proved the gate has teeth (preset-gate-selftest.mjs)."
          git push origin "HEAD:${{ github.ref_name }}"
          echo "committed: $(git rev-parse --short HEAD)"

