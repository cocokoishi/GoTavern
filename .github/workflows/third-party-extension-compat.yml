# THE THIRD-PARTY EXTENSION COMPATIBILITY GATE.
#
# WHAT IT ANSWERS. With exactly 20 real, popular, SFW SillyTavern client extensions pinned by commit in
# tests/browser/third-party-extensions.lock.json, does the unmodified pinned frontend activate them,
# persist their settings across a real server restart, disable and re-enable them, and uninstall them
# identically on stock SillyTavern and on GoTavern? Every extension is driven on BOTH subjects with the
# same probe, the same data-root shape, the same config bytes, the same browser and the same timeouts.
#
# WHY IT IS A SEPARATE WORKFLOW. The full corpus is ~20 pinned checkouts, two pinned server boots and
# four browser drives per extension; it does not belong in every PR. The lanes are:
#   * pull_request -> `selftest` + `sentinel` (two pinned extensions, minutes): a change to the harness or
#     the lock proves it still runs, without paying for the corpus;
#   * schedule / workflow_dispatch -> the full sharded corpus, then the aggregator that requires the
#     SET to be exactly the lock's 20;
#   * release -> `workflow_dispatch mode=full` at the release SHA; the release manifest requires this
#     workflow as a same-SHA gate, so publish refuses without it.
#
# WHAT MAKES THE VERDICT TRUSTWORTHY. The aggregator never trusts `conclusion == success`: it checks the
# observed extension set against the lock (no missing, no duplicate, no unexpected), the pinned commit per
# row, the lock SHA-256, the head SHA and run id every shard reports, and the capability verdicts. A
# shard that silently runs fewer extensions fails. The harness self-test mutates the things the gate
# guards (wrong product identity, 404-as-ready, port collision, listener ownership, forced leg failure,
# comparator mismatch, missing artifact, aggregator set) and requires each mutation to go red.

name: Third-party extension compatibility

on:
  pull_request:
    paths:
      - 'tests/browser/third-party-extensions.lock.json'
      - 'tests/browser/third-party-extensions.mjs'
      - 'tests/browser/third-party-extensions-run.mjs'
      - 'tests/browser/third-party-extensions-aggregate.mjs'
      - 'tests/browser/third-party-extensions-selftest.mjs'
      - 'tests/browser/extension-lifecycle-probe.mjs'
      - 'tests/browser/compare-extension-lifecycle.mjs'
      - 'tests/browser/port-lease.mjs'
      - 'tests/browser/install-pinned-extension.mjs'
      - 'tests/browser/run-against-pinned.mjs'
      - '.github/workflows/third-party-extension-compat.yml'
  push:
    paths:
      - 'tests/browser/third-party-extensions.lock.json'
      - 'tests/browser/third-party-extensions.mjs'
      - 'tests/browser/third-party-extensions-run.mjs'
      - 'tests/browser/third-party-extensions-aggregate.mjs'
      - 'tests/browser/third-party-extensions-selftest.mjs'
      - 'tests/browser/extension-lifecycle-probe.mjs'
      - 'tests/browser/compare-extension-lifecycle.mjs'
      - 'tests/browser/port-lease.mjs'
      - 'tests/browser/install-pinned-extension.mjs'
      - 'tests/browser/run-against-pinned.mjs'
      - '.github/workflows/third-party-extension-compat.yml'
  schedule:
    # Nightly, off the hour so it does not contend with the other nightly sweeps.
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full runs the 20-extension corpus; sentinel runs the two-extension PR smoke'
        type: choice
        options: [full, sentinel]
        default: full

permissions:
  contents: read

concurrency:
  group: third-party-extension-compat-${{ github.ref }}
  cancel-in-progress: false

env:
  PINNED_BASELINE_COMMIT: 06bde939fb1e9c4c8d8641d810f0a916b5bce127
  MODE: ${{ inputs.mode || 'full' }}
  # FOUR SHARDS IS A CONSTANT, NOT AN INPUT: the matrix below declares exactly these four, and the
  # aggregator refuses an artifact set that does not match the shardCount the shards themselves declare.
  # An input that changed the count without changing the matrix would be a silently missing-shard bug.
  SHARD_COUNT: '4'

jobs:
  # Cheap, no browser, no pinned boot: proves the judge and the aggregator can still refuse before any
  # expensive shard is paid for.
  selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache the harness node_modules
        id: cache-harness-modules
        uses: actions/cache@v4
        with:
          path: tests/browser/node_modules
          key: ${{ runner.os }}-harness-node-modules-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: Install the browser harness
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-harness-modules.outputs.cache-hit }}" = "true" ]; then
            echo "tests/browser/node_modules: CACHE HIT -- npm ci SKIPPED"
          else
            (cd tests/browser && npm ci --no-audit --no-fund)
          fi
      - name: Harness self-test (the gate's teeth)
        run: node tests/browser/third-party-extensions-selftest.mjs
      # THE COMPARATOR'S OWN TEETH. This file used to be referenced by nothing, so a change to the soak
      # guard's noise filter (the abort-costume fix) could land with its two new cases never executed. The
      # selftest spawns the real comparator against synthetic leg pairs and proves both directions: the
      # probe-aborted fetch is ignored, and the same message WITH a recorded API failure still fails.
      - name: Corpus comparator self-test (the soak guard's teeth)
        run: node tests/browser/extension-corpus-selftest.mjs

  # The PR lane's small, real drive: two pinned extensions through the whole lifecycle on both subjects.
  sentinel:
    needs: selftest
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'push' || (inputs.mode || 'full') == 'sentinel' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-pinned
        with:
          commit: ${{ env.PINNED_BASELINE_COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache the pinned server's node_modules
        id: cache-pinned-modules
        uses: actions/cache@v4
        with:
          path: .reference/SillyTavern/node_modules
          key: ${{ runner.os }}-pinned-node-modules-${{ env.PINNED_BASELINE_COMMIT }}-${{ hashFiles('.reference/SillyTavern/package-lock.json') }}
      - name: Cache the harness node_modules
        id: cache-harness-modules
        uses: actions/cache@v4
        with:
          path: tests/browser/node_modules
          key: ${{ runner.os }}-harness-node-modules-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: Cache the Playwright browser download
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: Install the pinned server's dependencies
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-pinned-modules.outputs.cache-hit }}" = "true" ]; then
            echo "pinned server node_modules: CACHE HIT -- install SKIPPED"
          else
            cd .reference/SillyTavern
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          fi
      - name: Install the browser harness
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-harness-modules.outputs.cache-hit }}" = "true" ]; then
            echo "tests/browser/node_modules: CACHE HIT -- npm ci SKIPPED"
          else
            (cd tests/browser && npm ci --no-audit --no-fund)
          fi
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            (cd tests/browser && npx playwright install-deps chromium)
          else
            (cd tests/browser && npx playwright install --with-deps chromium)
          fi
      - name: Build the subject and the recording peer
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p .browser-bin
          go build -trimpath -o .browser-bin/gotavern ./cmd/gotavern
          go build -trimpath -o .browser-bin/mock-provider ./tools/mock-provider
          echo "GOTAVERN_BINARY=${PWD}/.browser-bin/gotavern" >> "$GITHUB_ENV"
          echo "GOTAVERN_MOCK_PROVIDER_BINARY=${PWD}/.browser-bin/mock-provider" >> "$GITHUB_ENV"
          echo "GOTAVERN_REFERENCE=${PWD}/.reference/SillyTavern" >> "$GITHUB_ENV"
      - name: Sentinel lifecycle differential (two pinned extensions)
        run: |
          set -euo pipefail
          first="$(node -e "const l=require('./tests/browser/third-party-extensions.lock.json'); console.log(l.selected[0].name)")"
          second="$(node -e "const l=require('./tests/browser/third-party-extensions.lock.json'); console.log(l.selected[1].name)")"
          echo "sentinel extensions: $first, $second"
          node tests/browser/third-party-extensions-run.mjs \
            --shard-index 1 --shard-count 1 --names "$first,$second" \
            --work-root "$RUNNER_TEMP/ext-compat-sentinel"
      - name: Upload the sentinel evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-compat-sentinel
          path: ${{ runner.temp }}/ext-compat-sentinel
          if-no-files-found: warn
          retention-days: 30

  shard:
    needs: selftest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode || 'full') == 'full') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      # FAIL-FAST FALSE IS THE POINT: the run must report HOW MANY extensions broke, not stop at the first.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-pinned
        with:
          commit: ${{ env.PINNED_BASELINE_COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache the pinned server's node_modules
        id: cache-pinned-modules
        uses: actions/cache@v4
        with:
          path: .reference/SillyTavern/node_modules
          key: ${{ runner.os }}-pinned-node-modules-${{ env.PINNED_BASELINE_COMMIT }}-${{ hashFiles('.reference/SillyTavern/package-lock.json') }}
      - name: Cache the harness node_modules
        id: cache-harness-modules
        uses: actions/cache@v4
        with:
          path: tests/browser/node_modules
          key: ${{ runner.os }}-harness-node-modules-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: Cache the Playwright browser download
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: Install the pinned server's dependencies
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-pinned-modules.outputs.cache-hit }}" = "true" ]; then
            echo "pinned server node_modules: CACHE HIT -- install SKIPPED"
          else
            cd .reference/SillyTavern
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          fi
      - name: Install the browser harness
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-harness-modules.outputs.cache-hit }}" = "true" ]; then
            echo "tests/browser/node_modules: CACHE HIT -- npm ci SKIPPED"
          else
            (cd tests/browser && npm ci --no-audit --no-fund)
          fi
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            (cd tests/browser && npx playwright install-deps chromium)
          else
            (cd tests/browser && npx playwright install --with-deps chromium)
          fi
      - name: Build the subject and the recording peer
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p .browser-bin
          go build -trimpath -o .browser-bin/gotavern ./cmd/gotavern
          go build -trimpath -o .browser-bin/mock-provider ./tools/mock-provider
          echo "GOTAVERN_BINARY=${PWD}/.browser-bin/gotavern" >> "$GITHUB_ENV"
          echo "GOTAVERN_MOCK_PROVIDER_BINARY=${PWD}/.browser-bin/mock-provider" >> "$GITHUB_ENV"
          echo "GOTAVERN_REFERENCE=${PWD}/.reference/SillyTavern" >> "$GITHUB_ENV"
      - name: Run shard ${{ matrix.shard }} of ${{ env.SHARD_COUNT }}
        run: |
          set -euo pipefail
          node tests/browser/third-party-extensions-run.mjs \
            --shard-index ${{ matrix.shard }} --shard-count ${{ env.SHARD_COUNT }} \
            --work-root "$RUNNER_TEMP/ext-compat"
      - name: Upload the shard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-compat-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/ext-compat
          if-no-files-found: warn
          retention-days: 30

  # THE GATE. It does not trust the shards' conclusions: it requires the observed set to be exactly the
  # lock's 20, from one lock hash and one head SHA, with every capability verdict PASS or N/A.
  aggregate:
    needs: shard
    if: always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode || 'full') == 'full'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - name: Download every shard artifact
        uses: actions/download-artifact@v4
        with:
          pattern: extension-compat-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/ext-compat
      - name: Aggregate the corpus (set, lock hash, SHA, capability verdicts)
        run: |
          set -euo pipefail
          node tests/browser/third-party-extensions-aggregate.mjs \
            --shards "$RUNNER_TEMP/ext-compat" \
            --out-dir "$RUNNER_TEMP/ext-compat/evidence" \
            --expected-sha "$GITHUB_SHA" \
            --expected-run-id "$GITHUB_RUN_ID"
      - name: Print the compatibility matrix
        if: always()
        run: |
          set -uo pipefail
          if [ -f "$RUNNER_TEMP/ext-compat/evidence/matrix.md" ]; then
            cat "$RUNNER_TEMP/ext-compat/evidence/matrix.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f "$RUNNER_TEMP/ext-compat/evidence/summary.json" ]; then
            cat "$RUNNER_TEMP/ext-compat/evidence/summary.json"
          fi
      - name: Upload the release-gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-compat-evidence
          path: ${{ runner.temp }}/ext-compat/evidence
          if-no-files-found: warn
          retention-days: 90

  # REPRESENTATIVE CROSS-PLATFORM COVERAGE. The full 20-extension corpus is judged on Linux (the
  # reference platform). This job proves that the SAME lifecycle differential runs on Windows and on both
  # macOS architectures, because path handling, extension directories, filesystem casing, executable
  # naming, install scripts, browser startup and user-data locations are platform properties a Linux-only
  # run cannot observe. Two representative extensions are enough to exercise those paths; the corpus
  # itself stays on Linux so this job does not multiply the full cost by the runner matrix.
  cross-platform:
    needs: selftest
    if: ${{ github.event_name == 'workflow_dispatch' && (inputs.mode || 'full') == 'full' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
            binary: gotavern.exe
          - os: macos-15-intel
            platform: macos-amd64
            binary: gotavern
          - os: macos-14
            platform: macos-arm64
            binary: gotavern
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-pinned
        with:
          commit: ${{ env.PINNED_BASELINE_COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache the pinned server's node_modules
        id: cache-pinned-modules
        uses: actions/cache@v4
        with:
          path: .reference/SillyTavern/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-pinned-node-modules-${{ env.PINNED_BASELINE_COMMIT }}-${{ hashFiles('.reference/SillyTavern/package-lock.json') }}
      - name: Cache the harness node_modules
        id: cache-harness-modules
        uses: actions/cache@v4
        with:
          path: tests/browser/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-harness-node-modules-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: Cache the Playwright browser download
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/AppData/Local/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-ms-playwright-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: Install the pinned server's dependencies
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-pinned-modules.outputs.cache-hit }}" = "true" ]; then
            echo "pinned server node_modules: CACHE HIT -- install SKIPPED"
          else
            cd .reference/SillyTavern
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          fi
      - name: Install the browser harness
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-harness-modules.outputs.cache-hit }}" = "true" ]; then
            echo "tests/browser/node_modules: CACHE HIT -- npm ci SKIPPED"
          else
            (cd tests/browser && npm ci --no-audit --no-fund)
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            (cd tests/browser && npx playwright install --with-deps chromium)
          else
            (cd tests/browser && npx playwright install chromium)
          fi
      - name: Build the subject and the recording peer
        shell: bash
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p .browser-bin
          go build -trimpath -o ".browser-bin/${{ matrix.binary }}" ./cmd/gotavern
          go build -trimpath -o ".browser-bin/mock-provider${{ matrix.binary == 'gotavern.exe' && '.exe' || '' }}" ./tools/mock-provider
          echo "GOTAVERN_BINARY=${PWD}/.browser-bin/${{ matrix.binary }}" >> "$GITHUB_ENV"
          echo "GOTAVERN_MOCK_PROVIDER_BINARY=${PWD}/.browser-bin/mock-provider${{ matrix.binary == 'gotavern.exe' && '.exe' || '' }}" >> "$GITHUB_ENV"
          echo "GOTAVERN_REFERENCE=${PWD}/.reference/SillyTavern" >> "$GITHUB_ENV"
      - name: Representative lifecycle differential on ${{ matrix.platform }}
        shell: bash
        run: |
          set -euo pipefail
          first="$(node -e "const l=require('./tests/browser/third-party-extensions.lock.json'); console.log(l.selected[0].name)")"
          second="$(node -e "const l=require('./tests/browser/third-party-extensions.lock.json'); console.log(l.selected[1].name)")"
          echo "representative extensions on ${{ matrix.platform }}: $first, $second"
          node tests/browser/third-party-extensions-run.mjs \
            --shard-index 1 --shard-count 1 --names "$first,$second" --lifecycle-only \
            --work-root "$RUNNER_TEMP/ext-compat-${{ matrix.platform }}"
      - name: Upload the cross-platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-compat-${{ matrix.platform }}
          path: ${{ runner.temp }}/ext-compat-${{ matrix.platform }}
          if-no-files-found: warn
          retention-days: 30
  # ALL-20 SIMULTANEOUS AND CAPABILITY-CLUSTER DIFFERENTIALS. The per-extension shards judge one extension at
  # a time; real ecosystems fail in combination. This job loads all 20 at once (boot, every module loaded on
  # both subjects, settings page, character load, new chat, send, cancel, reload, restart) and then runs one
  # representative PAIR per capability cluster (prompt mutation, render/DOM, files/network, settings/events,
  # character/world, misc) so at least two extensions interact in every class. The runner refuses a set that
  # omits an expected extension and the comparator fails on a Go-only asset, status, shape or browser error.
  corpus:
    needs: selftest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode || 'full') == 'full') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-pinned
        with:
          commit: ${{ env.PINNED_BASELINE_COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache the pinned server's node_modules
        id: cache-pinned-modules
        uses: actions/cache@v4
        with:
          path: .reference/SillyTavern/node_modules
          key: ${{ runner.os }}-pinned-node-modules-${{ env.PINNED_BASELINE_COMMIT }}-${{ hashFiles('.reference/SillyTavern/package-lock.json') }}
      - name: Cache the harness node_modules
        id: cache-harness-modules
        uses: actions/cache@v4
        with:
          path: tests/browser/node_modules
          key: ${{ runner.os }}-harness-node-modules-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: Cache the Playwright browser download
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: Install the pinned server's dependencies
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-pinned-modules.outputs.cache-hit }}" = "true" ]; then
            echo "pinned server node_modules: CACHE HIT -- install SKIPPED"
          else
            cd .reference/SillyTavern
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          fi
      - name: Install the browser harness
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-harness-modules.outputs.cache-hit }}" = "true" ]; then
            echo "tests/browser/node_modules: CACHE HIT -- npm ci SKIPPED"
          else
            (cd tests/browser && npm ci --no-audit --no-fund)
          fi
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            (cd tests/browser && npx playwright install-deps chromium)
          else
            (cd tests/browser && npx playwright install --with-deps chromium)
          fi
      - name: Build the subject and the recording peer
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p .browser-bin
          go build -trimpath -o .browser-bin/gotavern ./cmd/gotavern
          go build -trimpath -o .browser-bin/mock-provider ./tools/mock-provider
          echo "GOTAVERN_BINARY=${PWD}/.browser-bin/gotavern" >> "$GITHUB_ENV"
          echo "GOTAVERN_MOCK_PROVIDER_BINARY=${PWD}/.browser-bin/mock-provider" >> "$GITHUB_ENV"
          echo "GOTAVERN_REFERENCE=${PWD}/.reference/SillyTavern" >> "$GITHUB_ENV"
      - name: All 20 extensions simultaneously (both subjects, restart)
        run: |
          set -euo pipefail
          node tests/browser/extension-corpus-run.mjs --mode all20 --work-root "$RUNNER_TEMP/ext-corpus-all20"
      - name: Capability-cluster pairs (both subjects)
        run: |
          set -euo pipefail
          node tests/browser/extension-corpus-run.mjs --mode clusters --work-root "$RUNNER_TEMP/ext-corpus-clusters"
      - name: Upload the all-20 and cluster evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-compat-corpus
          path: |
            ${{ runner.temp }}/ext-corpus-all20
            ${{ runner.temp }}/ext-corpus-clusters
          if-no-files-found: warn
          retention-days: 30

  # THE SOAK. A short lifecycle is not stability. This job drives the all-20 set for 30 minutes of repeated
  # send / cancel / reload / setting-toggle, recording subject RSS, API failure rate, latency p50/p95/p99,
  # browser errors and an orphan scan on both subjects, with a broad regression guard (Go RSS or p95 more
  # than 3x stock, or a Go-only 5xx) rather than a tight threshold that runner noise would turn red.
  soak:
    needs: selftest
    if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (inputs.mode || 'full') == 'full') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/checkout-pinned
        with:
          commit: ${{ env.PINNED_BASELINE_COMMIT }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Cache the pinned server's node_modules
        id: cache-pinned-modules
        uses: actions/cache@v4
        with:
          path: .reference/SillyTavern/node_modules
          key: ${{ runner.os }}-pinned-node-modules-${{ env.PINNED_BASELINE_COMMIT }}-${{ hashFiles('.reference/SillyTavern/package-lock.json') }}
      - name: Cache the harness node_modules
        id: cache-harness-modules
        uses: actions/cache@v4
        with:
          path: tests/browser/node_modules
          key: ${{ runner.os }}-harness-node-modules-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: Cache the Playwright browser download
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('tests/browser/package-lock.json') }}
      - name: Install the pinned server's dependencies
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-pinned-modules.outputs.cache-hit }}" = "true" ]; then
            echo "pinned server node_modules: CACHE HIT -- install SKIPPED"
          else
            cd .reference/SillyTavern
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          fi
      - name: Install the browser harness
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-harness-modules.outputs.cache-hit }}" = "true" ]; then
            echo "tests/browser/node_modules: CACHE HIT -- npm ci SKIPPED"
          else
            (cd tests/browser && npm ci --no-audit --no-fund)
          fi
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            (cd tests/browser && npx playwright install-deps chromium)
          else
            (cd tests/browser && npx playwright install --with-deps chromium)
          fi
      - name: Build the subject and the recording peer
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p .browser-bin
          go build -trimpath -o .browser-bin/gotavern ./cmd/gotavern
          go build -trimpath -o .browser-bin/mock-provider ./tools/mock-provider
          echo "GOTAVERN_BINARY=${PWD}/.browser-bin/gotavern" >> "$GITHUB_ENV"
          echo "GOTAVERN_MOCK_PROVIDER_BINARY=${PWD}/.browser-bin/mock-provider" >> "$GITHUB_ENV"
          echo "GOTAVERN_REFERENCE=${PWD}/.reference/SillyTavern" >> "$GITHUB_ENV"
      - name: Thirty-minute all-20 soak (both subjects)
        run: |
          set -euo pipefail
          node tests/browser/extension-corpus-run.mjs --mode soak --soak-minutes 30 --work-root "$RUNNER_TEMP/ext-corpus-soak"
      - name: Upload the soak evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-compat-soak
          path: ${{ runner.temp }}/ext-corpus-soak
          if-no-files-found: warn
          retention-days: 30
  # THE COST OF THE CORPUS, measured rather than guessed. Four fresh conditions on one runner: GoTavern
  # clean, GoTavern with all 20 installed, stock clean, stock with all 20 installed. Reports server boot,
  # RSS, /version and / latency, and browser time-to-settings-ready plus the all-20 asset-load moment, with
  # deltas and an explicit "unmeasured" record where a metric cannot be obtained. It makes NO speedup or
  # regression assertion: the numbers are evidence, not a marketing claim.
  overhead:
    needs: selftest
