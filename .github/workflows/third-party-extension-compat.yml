          echo "GOTAVERN_REFERENCE=${PWD}/.reference/SillyTavern" >> "$GITHUB_ENV"
      - name: Clean vs 20 extensions, both subjects
        run: |
          set -euo pipefail
          node tests/browser/extension-overhead.mjs --work-root "$RUNNER_TEMP/ext-overhead" --samples 20
      - name: Upload the overhead evidence
