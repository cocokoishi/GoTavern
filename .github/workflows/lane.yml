name: GoTavern Lane CI

# Per-lane verification, on GitHub's machines.
#
# WHY THIS WORKFLOW EXISTS. The development host is weak: a Go build or a package test there is
# slow enough that lanes stop running them and start guessing, and several lanes sharing one working
# tree broke each other's compiles. GitHub Actions is the authoritative environment (AGENTS.md
# "Where verification runs"), so each lane gets its own branch `lane/<name>`, pushes it, and reads
# ITS OWN run instead of competing for the main branch's single run.
#
# WHAT IT RUNS, and why this subset: `gofmt` (cheap, catches the formatting defect that build and vet
# both accept), `go build ./...`, `go vet ./...`, and `go test ./... -count=1`. That is exactly the
# set a lane needs to know whether its change compiles and its replay test passes. It deliberately
# does NOT run the cross-compile matrix, the Docker job, the browser evidence job or the oracle
# re-record job: those belong to main, and a lane's fixtures are re-recorded on Linux by the oracle
# job when the lane lands. A lane that changed a probe fixture should say so in its report so the
# Lead runs the oracle job on the merge commit.
#
# `-count=1` is not optional: the Go test cache answers `ok (cached)` for a test whose inputs have not
# changed, which has already produced a "passing" mutation run in this project.

on:
  push:
    branches:
      - 'lane/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    runs-on: ubuntu-latest
    # MEASURED: 1m52s - 2m20s on the lane runs of this workflow (gofmt, two Go builds, four release/binary
    # builds, vet, and the whole Go suite with -count=1). Thirty minutes is ~13x that, which absorbs a cold
    # module cache, while a wedged test or a hung build fails the lane at 30 min instead of GitHub's
    # 360-minute default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # FULL HISTORY, because one of the tests asks a question only git can answer: whether a run's
          # head_sha is an ANCESTOR of the commit the evidence ledger describes. Under the default
          # fetch-depth of 1 the answer is `exit 128` for every citation, and the gate correctly reports
          # "ancestry could not be verified" rather than a verdict -- correct, and useless. Measured on
          # 2026-10-26: the whole ledger was unverifiable for exactly this reason, on the rule most likely
          # to be violated. `filter: blob:none` keeps the extra cost to commits and trees.
          fetch-depth: 0
          filter: blob:none
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi
          echo "all Go files are gofmt-clean"
      - name: Build
        run: go build ./...
      - name: Build the binaries browser probes can run
        # The browser probes boot GoTavern from a REAL binary in a release-shaped install root, and
        # they used to build it themselves (`go build` inside the harness). On this project the build
        # host is the weak machine, so a lane that needs a binary must not compile one: it downloads
        # the one built here, from the exact commit under test, and passes it as GOTAVERN_BINARY.
        #
        # BOTH platforms are built, because a lane recording on the Windows development host needs a
        # Windows binary while the oracle job re-records on Linux. A release ASSET was the wrong answer
        # for this (it is a tag, not the code under review), and a local build was the answer that
        # filled a 149 GB disk. This is the durable one.
        run: |
          set -eu
          mkdir -p lane-binaries
          CGO_ENABLED=0 go build -trimpath -o lane-binaries/gotavern-linux-amd64 ./cmd/gotavern
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o lane-binaries/gotavern-windows-amd64.exe ./cmd/gotavern
          # The provider-wire probe ALSO drives a recording mock provider, so a provider lane needs
          # that binary as well. Building it here is what keeps the host out of the compile business
          # for every provider differential, not only the one that asked for it.
          CGO_ENABLED=0 go build -trimpath -o lane-binaries/mock-provider-linux-amd64 ./tools/mock-provider
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -o lane-binaries/mock-provider-windows-amd64.exe ./tools/mock-provider
          ls -l lane-binaries
      - name: Upload the binaries for browser probes
        uses: actions/upload-artifact@v4
        with:
          name: gotavern-lane-binaries
          path: lane-binaries/
          retention-days: 7
          if-no-files-found: error
      - name: Publish the binary the Go end-to-end test boots
        # tests/e2e boots the REAL binary over a socket instead of exporting route handlers for tests
        # (the lead's decision: the production path is only the production path if the shipped binary
        # carries it). Pointing it at the artifact this job just built means (a) the binary under test
        # IS the binary under review, and (b) `go test ./...` does not compile the server a second time.
        # The variable is otherwise read only by probes, which this workflow does not run.
        run: echo "GOTAVERN_BINARY=${PWD}/lane-binaries/gotavern-linux-amd64" >> "$GITHUB_ENV"
      - name: Vet
        run: go vet ./...
      - name: Test, and prove the tests actually ran
        # ONE test invocation, not two. The first version ran `go test ./... -count=1` and then a
        # second `go test ./internal/server -v` just to count `=== RUN` lines; on this project's
        # budget that is a duplicated full package compile and test for a number that can be counted
        # in the same pass.
        #
        # The counting itself is not decoration: a `-run` that matches nothing reports `ok`, and a
        # package that fails to COMPILE also produces no `=== RUN` line while the step can still look
        # green in the caller's reading. Both have happened here.
        #
        # THE OUTPUT IS NEVER DISCARDED. An earlier version piped the run through `tee ... >/dev/null`
        # under `set -e`; a failing test then aborted the script at the pipe, so the run printed NO
        # test name and NO assertion message -- a red that could not name its cause, which a lane
        # reported and which this project's rules forbid. The status is captured first, the tail is
        # always printed, and the exit code is decided afterwards.
        run: |
          set -uo pipefail
          # The RUNNER invokes this script as 'bash -e', so a failing 'go test' aborts the step
          # before a single line of the tail below is printed. An earlier fix that only removed -e
          # from this script's own 'set' line could not affect the runner's -e: measured, three red
          # lane runs printed an exit code and no test name. This step decides its own exit code,
          # so it turns the runner's -e off explicitly.
          set +e
          go test ./... -count=1 -v > /tmp/all-tests.log 2>&1
          status=$?
          executed="$(grep -c '^=== RUN' /tmp/all-tests.log || true)"
          echo "tests executed: $executed"
          echo "--- test log tail ---"
          tail -60 /tmp/all-tests.log
          # THE FAILING BLOCK IN FULL, NOT ITS TAIL.
          #
          # MEASURED TWICE, on two different gates. The ledger gate joins its problems with newlines inside one
          # error, and a lane that lost the failing message could name the TEST but not the ASSERTION -- a red
          # it could see and not read, which is AGENTS verification rule 7 in the reporting layer. `tail -60`
          # shows the end of the whole log, which for a long run is unrelated packages; the assertion lives
          # directly under its own `--- FAIL` line.
          #
          # `grep -A 40` prints each failure with the 40 lines that follow it, which is where t.Fatalf's message
          # and any subtest detail sit. It is bounded, so a pathological log cannot flood the runner.
          echo "--- failing blocks (each FAIL plus its next 40 lines) ---"
          grep -A 40 -E '^--- FAIL' /tmp/all-tests.log || echo "(no --- FAIL line; see the tail above)"
          # FAILING SUBTEST BLOCKS, WHICH `-A 40` CANNOT REACH.
          #
          # MEASURED on run 40474358782: `TestChatCompletionGenerateMatchesProviderWireCapture` has ~200
          # subtests, its three failures were the LAST ones, and `grep -A 40 '^--- FAIL'` printed the first forty
          # PASS lines of its sibling subtests instead -- so the diagnostic I added one commit earlier showed the
          # test name and not the reason, which is the exact defect it was written to fix, one layer down.
          #
          # Subtests are indented, so they need their own pattern, and six lines is enough for a t.Errorf message.
          echo "--- failing subtest blocks (each subtest FAIL plus its next 6 lines) ---"
          grep -A 6 -E '^[[:space:]]+--- FAIL' /tmp/all-tests.log | head -100 || true
          echo "--- failing tests ---"
          grep -E '^(--- FAIL|FAIL)' /tmp/all-tests.log || echo "(none named)"
          echo "--- failing test detail ---"
          grep -E '_test\.go:[0-9]+:' /tmp/all-tests.log | head -40 || true
          echo "--- failing subtests ---"
          grep -E '^\s+--- FAIL' /tmp/all-tests.log | head -20 || true
          if [ "$status" -ne 0 ]; then
            echo "go test exited $status"
            exit 1
          fi
          if [ "$executed" -eq 0 ]; then
            echo "no test executed at all -- refusing to report success"
            exit 1
          fi

      - name: DeepSeek canary (the one gate that reaches the real provider)
        # WHY THIS STEP EXISTS: every other provider gate in this workflow faces a mock, and AGENTS.md
        # rule 22 says a behaviour verified only against our own peer is unverified for production.
        # P0-A is the proof: the suite was green and a real DeepSeek key reached nothing. This boots
        # the shipped binary, stores the key through POST /api/secrets/write -- the route the frontend
        # uses -- and calls the real api.deepseek.com.
        #
        # NO SECRET IS REQUIRED FOR THE REACHABILITY HALF. The first version printed SKIPPED and exited 0
        # when DEEPSEEK_API_KEY was absent, which made the only gate that reaches the provider a line
        # nobody could act on. Without a key the script now sends its own obviously-invalid key and
        # REQUIRES a provider-origin rejection: an HTTP status plus the provider's own error body proves
        # DNS, TCP, the TLS handshake against the system roots, request framing and response parsing went
        # through the shipped binary. With a key it requires a real completion. Either way a transport
        # failure, an empty completion or the route's own error flag FAILS the step, and the log names
        # which mode ran.
        #
        # It writes nothing into the repository: the install root, the config, the data directory and
        # the secrets.json holding the key all live in a throwaway temp directory.
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          GOTAVERN_BINARY: ${{ github.workspace }}/lane-binaries/gotavern-linux-amd64
        run: node scripts/deepseek-canary.mjs

      - name: Live completion canary (a REAL completion, with no credential)
        # The DeepSeek step above can only prove reachability without a key. This step proves the COMPLETION half --
        # a real answer, over real TLS, from a real third-party host, through the shipped binary -- because
        # SillyTavern's pollinations source has an ANONYMOUS endpoint mode in which pinned sends the literal string
        # "anonymous" and never reads a secret (internal/server/pollinations_chat.go:12-13, :45, :52-59). No
        # credential exists in this repository, and none is needed for this.
        #
        # A third party can be down, so the taxonomy is explicit and printed: `ok` is a completion; PROVIDER-REFUSED
        # means the provider ANSWERED with its own error (the transport worked end to end, and the line says no
        # completion was produced); a transport failure, an empty response, or a server that never becomes ready
        # FAILS. Both the non-stream and the stream paths run, because they are different code in this product.
        env:
          GOTAVERN_BINARY: ${{ github.workspace }}/lane-binaries/gotavern-linux-amd64
        run: |
          node scripts/live-canary.mjs
          node scripts/live-canary.mjs --stream

      - name: Prove the fixture gates can refuse, and the asset guards can fail
        # WHY THIS RUNS HERE AND NOT ONLY IN ci.yml. `ci.yml` triggers on `push: branches: [main]` only, so its
        # `browser-evidence` job never runs on a lane branch -- and a gate that first executes after merge is a
        # gate nobody has seen run (AGENTS.md 7). Both self-tests are pure Node with no browser, no server and no
        # originals: they build their inputs in memory, so they cost seconds and they work on this runner.
        run: |
          node tools/fixture-gate-selftest.mjs
          node tests/browser/asset-gate-selftest.mjs
          # AND THE COMMITTED FIXTURES MUST STILL BE THE ONES THE MANIFEST DESCRIBES, which needs neither the
          # originals nor a rebuild: `--check` re-derives every digest from the tree.
          node tools/build-real-fixtures.mjs --check --out tests/browser/fixtures/real
          fixtures="$(git ls-files 'tests/browser/fixtures/real/preset-*.json' 'tests/browser/fixtures/real/card-*.png')"
          if [ -n "$fixtures" ]; then
            node tools/check-fixture-watermarks.mjs --allow-declared tests/browser/fixtures/real/real-fixture-manifest.json $fixtures
          else
            echo "no real fixtures are committed, so there is nothing to scan"
          fi



