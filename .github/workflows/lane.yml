name: GoTavern Lane CI

# Per-lane verification, on GitHub's machines.
#
# WHY THIS WORKFLOW EXISTS. The development host is weak: a Go build or a package test there is
# slow enough that lanes stop running them and start guessing, and several lanes sharing one working
# tree broke each other's compiles. GitHub Actions is the authoritative environment (AGENTS.md
# "Where verification runs"), so each lane gets its own branch `lane/<name>`, pushes it, and reads
# ITS OWN run instead of competing for the main branch's single run.
#
# WHAT IT RUNS, and why this subset: `gofmt` (cheap, catches the formatting defect that build and vet
# both accept), `go build ./...`, `go vet ./...`, and `go test ./... -count=1`. That is exactly the
# set a lane needs to know whether its change compiles and its replay test passes. It deliberately
# does NOT run the cross-compile matrix, the Docker job, the browser evidence job or the oracle
# re-record job: those belong to main, and a lane's fixtures are re-recorded on Linux by the oracle
# job when the lane lands. A lane that changed a probe fixture should say so in its report so the
# Lead runs the oracle job on the merge commit.
#
# `-count=1` is not optional: the Go test cache answers `ok (cached)` for a test whose inputs have not
# changed, which has already produced a "passing" mutation run in this project.

on:
  push:
    branches:
      - 'lane/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lane-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify Go formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt would rewrite these files:"
            echo "$unformatted"
            exit 1
          fi
          echo "all Go files are gofmt-clean"
      - name: Build
        run: go build ./...
      - name: Build the binary a browser probe can run
        # The browser probes boot GoTavern from a REAL binary in a release-shaped install root, and
        # they used to build it themselves (`go build` inside the harness). On this project the build
        # host is the weak machine, so a lane that needs a binary must not compile one: it downloads
        # the one built here, from the exact commit under test, and passes it as GOTAVERN_BINARY.
        #
        # A release ASSET was the wrong answer for this (it is a tag, not the code under review) and a
        # local build was the answer that filled a 149 GB disk. This is the durable one.
        run: go build -trimpath -o gotavern ./cmd/gotavern
      - name: Upload the binary for browser probes
        uses: actions/upload-artifact@v4
        with:
          name: gotavern-lane-binary
          path: gotavern
          retention-days: 7
          if-no-files-found: error
      - name: Vet
        run: go vet ./...
      - name: Test, and prove the tests actually ran
        # ONE test invocation, not two. The first version ran `go test ./... -count=1` and then a
        # second `go test ./internal/server -v` just to count `=== RUN` lines; on this project's
        # budget that is a duplicated full package compile and test for a number that can be counted
        # in the same pass.
        #
        # The counting itself is not decoration: a `-run` that matches nothing reports `ok`, and a
        # package that fails to COMPILE also produces no `=== RUN` line while the step can still look
        # green in the caller's reading. Both have happened here.
        run: |
          set -euo pipefail
          go test ./... -count=1 -v 2>&1 | tee /tmp/all-tests.log >/dev/null
          executed="$(grep -c '^=== RUN' /tmp/all-tests.log || true)"
          echo "tests executed: $executed"
          grep -E '^(--- )?(FAIL|ok  )' /tmp/all-tests.log | tail -15 || true
          if grep -q '^FAIL' /tmp/all-tests.log; then
            echo "at least one package failed"
            exit 1
          fi
          if [ "$executed" -eq 0 ]; then
            echo "no test executed at all -- refusing to report success"
            exit 1
          fi

