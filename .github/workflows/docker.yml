name: GoTavern Docker image

# The Docker path is a documented release path (ARCHITECTURE.md 5.4) and it was previously part of
# every push's CI. It is a build-and-smoke job -- it assembles the image and asserts `assets verify`
# INSIDE it, because `tokenizers/` is a directory beside the binary rather than an embedded asset and a
# container that forgot it answers tokenizer routes from the pinned fallback while still looking
# healthy -- and none of that can change unless the image's own inputs change.
#
# So it runs when the image could differ and on demand, not on every commit:
#   - pushes that touch the Dockerfile, .dockerignore, docker-compose or the installer scripts;
#   - a weekly schedule, which catches drift in the base image and in the pinned Node/npm used by the
#     upstream asset build;
#   - workflow_dispatch, for a deliberate check before a release.
#
# The assertion that matters is `docker run --rm <image> assets verify`, and the smoke test after it
# exercises a PINNED compatibility route (/version), not a GoTavern-invented one.

on:
  push:
    branches: [main]
    paths:
      - 'Dockerfile'
      - '.dockerignore'
      - 'docker-compose.yml'
      - 'install.sh'
      - 'install.ps1'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the release image
        run: docker build --tag gotavern:ci .
      - name: Verify embedded assets and the installed tokenizers tree
        run: docker run --rm gotavern:ci assets verify
      - name: Start the container and assert it serves a pinned route
        shell: bash
        run: |
          set -euo pipefail

          # Report what was seen, not only that it failed. The first run of this
          # job failed with a bare exit code, which left the cause to be
          # reconstructed from the image rather than read from the log.
          report_failure() {
            echo "::group::container state"
            docker inspect --format 'status={{.State.Status}} exit={{.State.ExitCode}} oom={{.State.OOMKilled}} error={{.State.Error}}' gotavern-docker-smoke || true
            echo "::endgroup::"
            echo "::group::container logs"
            docker logs gotavern-docker-smoke || true
            echo "::endgroup::"
          }

          docker run --detach --name gotavern-docker-smoke --publish 8000:8000 gotavern:ci

          # /version is a pinned public compatibility route: no session, no CSRF,
          # and it is in the pinned route set rather than invented for the probe.
          for attempt in $(seq 1 30); do
            state=$(docker inspect --format '{{.State.Status}}' gotavern-docker-smoke 2>/dev/null || echo missing)
            if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              echo "the container $state before it served /version"
              report_failure
              exit 1
            fi
            if docker exec gotavern-docker-smoke wget -q -O - http://127.0.0.1:8000/version > /tmp/gotavern-version.json 2>/dev/null; then
              echo "GET /version inside the container:"
              cat /tmp/gotavern-version.json
              exit 0
            fi
            sleep 2
          done
          echo "the container never answered /version within 60 seconds"
          report_failure
          exit 1
      - name: Stop the container
        if: always()
        run: docker rm --force gotavern-docker-smoke || true
