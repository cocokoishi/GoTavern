# THE WHOLE-SESSION DIFFERENTIAL — the surface `docs/compatibility-matrix.json`'s `whole-session-e2e` row names.
#
# WHAT IT RUNS. THREE journeys per subject, each over its own stock tree, then ONE comparator per journey:
#
#   1. `default` -- the fresh install. A browser journey over one tree -- boot, page load, settings read/change/save,
#      characters, open the card, a streamed turn, a swipe, save, a page RELOAD, a second turn, regenerate, continue --
#      then a SECOND process over the SAME tree that reopens the chat and takes another turn. Its resumed turn's prompt
#      order ENABLES chatHistory, so the resumed request is REQUIRED to carry the restored history.
#   2. `preset` -- the same journey with the committed DERIVATION of a real complex preset selected through the
#      frontend's own control (105 prompts / 109 order rows; AGENTS rule 56: the user's file is never committed, the
#      derivation is). The restart leg must read it back from the tree without selecting anything. This is the
#      configuration the OPEN Beta-1 item was observed under.
#   3. `preset-omit` -- a STRUCTURAL CONTROL generated at run time from the same committed bytes: the runtime prompt
#      order row's `chatHistory.enabled` is set false (the one field a user can toggle), which is the only branch in
#      which a history-free resumed request is CORRECT. Its verdict must then be `resumed-history-omitted-by-preset`
#      plus byte equality with pinned -- never a weakened assertion and never a silent pass.
#
# The resumed turn's request is attributed BY THE PEER ORDINAL ARMED IMMEDIATELY BEFORE THE CLICK in all three
# journeys (never `completions().at(-1)`), and journeys 2 and 3 also inject ONE helper-style quiet completion after the
# send: the single-system-message request the old selection would have captured. That makes the recorded failure
# mechanism reproducible and demonstrates it is not attributable to the send. docs/persistence-resume.md is the record.
#
# WHY IT IS ITS OWN WORKFLOW INSTEAD OF A SURFACE INSIDE `browser-differential.yml`. Every existing surface there is an
# EXPERIMENT on its own runtime; this one exists precisely because eight of those exist and none of them shares a
# session. Mixing it in would put the one stateful journey behind the same trigger and the same 150-minute budget as
# eighteen stateless ones, and a red could no longer say which shape failed without reading the log.
#
# WHAT A GREEN RUN DOES NOT PROVE, stated here because the matrix row will quote it: a real provider (the peer answers
# with markers), group chats, branches/checkpoints, multi-user, or a real user's data. The trees are fresh installs the
# server seeds itself, and the model is a recording peer.

name: GoTavern whole-session differential

on:
  workflow_dispatch:
  push:
    paths:
      - 'tests/browser/whole-session-probe.mjs'
      - 'tests/browser/compare-whole-session-legs.mjs'
      - 'tests/browser/whole-session-gate-selftest.mjs'
      - 'tests/browser/fixtures/real/preset-a.json'
      - 'tests/browser/fixtures/real/preset-b.json'
      - 'tests/browser/fixtures/real/real-fixture-manifest.json'
      - 'tests/browser/q20-persistence-drive.mjs'
      - 'tests/browser/q20-leg-runtime.mjs'
      - 'tests/browser/url-recorder.mjs'
      - 'tests/browser/seed-leg-config.mjs'
      - 'tests/browser/run-against-pinned.mjs'
      - '.github/workflows/whole-session.yml'

permissions:
  contents: read

# ONE RUN AT A TIME PER BRANCH, and a new push supersedes an older one: this job costs browser minutes, and a
# superseded run cannot change what ships.
concurrency:
  group: whole-session-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PINNED_BASELINE_COMMIT: 06bde939fb1e9c4c8d8641d810f0a916b5bce127

jobs:
  whole-session:
    runs-on: ubuntu-latest
    # SIZED FROM THE DRIVES, not from a round number: TWELVE browser legs (three journeys x two subjects x drive +
    # restart), four of which boot pinned Node (~40 s each) and all of which load the unmodified frontend, plus three
    # comparator invocations and two teeth proofs. The probe's own deadlines (120 s server, 90 s reply, 45 s chat load)
    # are the first line of defence; this is the backstop that bounds a wedged browser instead of holding a runner for
    # the service maximum.
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      # THE PINNED REFERENCE IS THE ORACLE, at the baseline commit AGENTS.md names — the same commit the oracle job and
      # the browser differential use, so no lane can drift onto a different baseline.
      - uses: ./.github/actions/checkout-pinned
        with:
          commit: ${{ env.PINNED_BASELINE_COMMIT }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # THE SAME THREE CACHES, KEYED THE SAME WAY, as `browser-differential.yml`: a hit SKIPS an install, so the key has
      # to PROVE the identity of what it restores (the pinned commit plus that checkout's lockfile, the harness
      # lockfile, the Playwright download) rather than merely suggest it. No `restore-keys`, for the reason recorded
      # there: a partial restore reports cache-hit=false while handing back an older tree.
      - name: Cache the pinned server's node_modules
        id: cache-pinned-modules
        uses: actions/cache@v4
        with:
          path: .reference/SillyTavern/node_modules
          key: ${{ runner.os }}-pinned-node-modules-${{ env.PINNED_BASELINE_COMMIT }}-${{ hashFiles('.reference/SillyTavern/package-lock.json') }}

      - name: Cache the harness node_modules
        id: cache-harness-modules
        uses: actions/cache@v4
        with:
          path: tests/browser/node_modules
          key: ${{ runner.os }}-harness-node-modules-${{ hashFiles('tests/browser/package-lock.json') }}

      - name: Cache the Playwright browser download
        id: cache-playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('tests/browser/package-lock.json') }}

      - name: Install the pinned server's dependencies
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-pinned-modules.outputs.cache-hit }}" = "true" ]; then
            echo "pinned server node_modules: CACHE HIT for ${{ env.PINNED_BASELINE_COMMIT }} -- install SKIPPED"
          else
            echo "pinned server node_modules: cache MISS -- installing from the pinned checkout's own manifest"
            cd .reference/SillyTavern
            if [ -f package-lock.json ]; then npm ci --no-audit --no-fund; else npm install --no-audit --no-fund; fi
          fi

      - name: Install the browser harness
        run: |
          set -euo pipefail
          if [ "${{ steps.cache-harness-modules.outputs.cache-hit }}" = "true" ]; then
            echo "tests/browser/node_modules: CACHE HIT -- npm ci SKIPPED"
          else
            echo "tests/browser/node_modules: cache MISS -- npm ci"
            (cd tests/browser && npm ci --no-audit --no-fund)
          fi
          if [ "${{ steps.cache-playwright.outputs.cache-hit }}" = "true" ]; then
            echo "playwright chromium: CACHE HIT -- browser download SKIPPED, OS packages still ensured"
            (cd tests/browser && npx playwright install-deps chromium)
          else
            echo "playwright chromium: cache MISS -- downloading the browser and its OS packages"
            (cd tests/browser && npx playwright install --with-deps chromium)
          fi

      - name: Which setup branches this run took
        run: |
          echo "pinned server node_modules cache-hit: ${{ steps.cache-pinned-modules.outputs.cache-hit }}"
          echo "harness node_modules cache-hit:       ${{ steps.cache-harness-modules.outputs.cache-hit }}"
          echo "playwright browsers cache-hit:        ${{ steps.cache-playwright.outputs.cache-hit }}"
          echo "(true = the install above was skipped; false or empty = it ran)"

      - name: Build the subject binary
        env:
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          mkdir -p .browser-bin
          go build -trimpath -o .browser-bin/gotavern ./cmd/gotavern
          echo "GOTAVERN_BINARY=${PWD}/.browser-bin/gotavern" >> "$GITHUB_ENV"
          echo "GOTAVERN_REFERENCE=${PWD}/.reference/SillyTavern" >> "$GITHUB_ENV"

      # THE LEGS. Three journeys, each with its own trees, and each journey's restart leg runs AFTER its drive leg over
      # the same tree -- "the new process read what the old one wrote" is only what was measured if that order holds.
      #
      # THE COUNTER IS WRITTEN ON EVERY FAILURE, not once at the end: a shell that dies mid-loop would otherwise leave
      # `failures=0` standing as a claim that every leg was recorded (the defect `browser-differential.yml` records for
      # run 40445569175, where six failed legs still produced a green step).
      - name: Record the legs (fresh install, complex preset, and the history-omitting control)
        id: legs
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/whole-session"
          mkdir -p "$work/legs"
          echo "failures=0" >> "$GITHUB_OUTPUT"
          record_failure() {
            echo "::error::$1"
            echo "failures=1" >> "$GITHUB_OUTPUT"
          }
          # Each journey is a name plus the probe arguments that define it. The preset file is the committed DERIVATION
          # (`tests/browser/fixtures/real/preset-a.json`); `--preset-chat-history omit` derives its structural control
          # inside the leg and records the one rewritten field with its before/after values.
          record_journey() {
            journey="$1"; shift
            for subject in gotavern pinned; do
              tree="$work/tree-$journey-$subject"
              rm -rf "$tree"; mkdir -p "$tree"
              # THE PER-SUBJECT DISCRIMINATOR (AGENTS rule 50). Each subject's first reply carries a different prefix,
              # so the comparator can require the two artefacts to DIFFER where the fixture put a difference instead of
              # proving parity between two runs the harness made identical.
              if [ "$subject" = "gotavern" ]; then prefix="WSG_"; else prefix="WSP_"; fi
              for phase in drive restart; do
                report="$work/legs/whole-session-$journey-$phase-$subject.json"
                # A FAILING LEG MUST NOT ABORT THE STEP. GitHub runs `run:` blocks under `bash -e`, so the call is
                # WRAPPED rather than merely followed by `status=$?`: measured in this workflow's first run
                # (41014268160), where the GoTavern drive leg's red ended the step and the other THREE legs never ran --
                # the pinned half of the differential was never recorded, and the step's own `failures` counter still
                # read 0 because the shell died before reaching `record_failure`. A loop that reports legs must attempt
                # every leg.
                if [ "$subject" = "gotavern" ]; then
                  if node tests/browser/whole-session-probe.mjs --phase "$phase" --data-root "$tree" \
                      --reply-prefix "$prefix" --report "$report" "$@"; then status=0; else status=$?; fi
                else
                  # `run-against-pinned.mjs` boots pinned Node over the SAME tree and owns its process; it supplies
                  # PROBE_BASE_URL and PROBE_SERVER_PID, which is how the restart leg's pid can differ from the drive
                  # leg's without this workflow ever touching a process it did not spawn.
                  if node tests/browser/run-against-pinned.mjs whole-session-probe.mjs -- --phase "$phase" \
                      --data-root "$tree" --reply-prefix "$prefix" --report "$report" "$@"; then status=0; else status=$?; fi
                fi
                if [ "$status" -eq 0 ]; then
                  echo "recorded the $journey/$subject/$phase leg"
                else
                  record_failure "the $journey/$subject/$phase leg failed to drive"
                fi
                # A LEG THAT WROTE NO REPORT IS THE ABSENCE OF EVIDENCE, and the comparator refuses rather than passing.
                if [ ! -s "$report" ]; then
                  record_failure "the $journey/$subject/$phase leg wrote no report at $report"
                fi
              done
            done
          }
          record_journey default
          record_journey preset \
            --preset tests/browser/fixtures/real/preset-a.json --preset-name preset-a \
            --helper-request-after-send
          record_journey preset-omit \
            --preset tests/browser/fixtures/real/preset-a.json --preset-name preset-a-no-chat-history \
            --preset-chat-history omit --helper-request-after-send
          exit 0

      # ONE COMPARATOR INVOCATION PER JOURNEY, over that journey's own four artefacts. The comparator derives the
      # history requirement from each leg's recorded prompt order, so the same program judges a required-history journey
      # and an omission control without being told which is which.
      - name: Compare the legs of each journey
        id: compare
        if: ${{ steps.legs.outputs.failures == '0' }}
        run: |
          set -uo pipefail
          work="$RUNNER_TEMP/whole-session"
          compare_journey() {
            journey="$1"; out="$2"
            missing=0
            for name in drive-gotavern drive-pinned restart-gotavern restart-pinned; do
              if [ ! -s "$work/legs/whole-session-$journey-$name.json" ]; then
                echo "::error::the $journey/$name leg produced no report, so nothing can be claimed about it"
                missing=$((missing + 1))
              fi
            done
            if [ "$missing" -ne 0 ]; then
              echo "::error::$missing leg report(s) missing for $journey; the comparator is not run against absent evidence"
              return 1
            fi
            node tests/browser/compare-whole-session-legs.mjs \
              --drive-go      "$work/legs/whole-session-$journey-drive-gotavern.json" \
              --drive-pinned  "$work/legs/whole-session-$journey-drive-pinned.json" \
              --restart-go    "$work/legs/whole-session-$journey-restart-gotavern.json" \
              --restart-pinned "$work/legs/whole-session-$journey-restart-pinned.json" \
              --out "$out"
          }
          compare_journey default     tests/browser/whole-session-comparison.json || exit 1
          compare_journey preset      "$work/whole-session-preset-comparison.json" || exit 1
          compare_journey preset-omit "$work/whole-session-preset-omission-comparison.json" || exit 1

      # DOES THE GATE HAVE TEETH? Mutations of THIS RUN's own artefacts, each required to produce its NAMED red on top of
      # a green baseline. Two runs, because the mutation set has two families: the preset journey's artefacts carry the
      # preset and the injected helper completion, so the resumed-turn mutations (J, M, N, O, P) are applicable there;
      # the default journey's artefacts prove the same guards on the fresh-install branch. A mutation whose
      # precondition a run does not carry is reported `not-applicable`, never counted as caught.
      - name: Prove the whole-session gate has teeth (preset journey)
        if: ${{ steps.legs.outputs.failures == '0' && steps.compare.outcome == 'success' }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/whole-session"
          node tests/browser/whole-session-gate-selftest.mjs \
            --drive-go      "$work/legs/whole-session-preset-drive-gotavern.json" \
            --drive-pinned  "$work/legs/whole-session-preset-drive-pinned.json" \
            --restart-go    "$work/legs/whole-session-preset-restart-gotavern.json" \
            --restart-pinned "$work/legs/whole-session-preset-restart-pinned.json" \
            --out "$work/whole-session-teeth-preset.json"

      - name: Prove the whole-session gate has teeth (fresh-install journey)
        if: ${{ steps.legs.outputs.failures == '0' && steps.compare.outcome == 'success' }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/whole-session"
          node tests/browser/whole-session-gate-selftest.mjs \
            --drive-go      "$work/legs/whole-session-default-drive-gotavern.json" \
            --drive-pinned  "$work/legs/whole-session-default-drive-pinned.json" \
            --restart-go    "$work/legs/whole-session-default-restart-gotavern.json" \
            --restart-pinned "$work/legs/whole-session-default-restart-pinned.json" \
            --out "$work/whole-session-teeth-default.json"

      - name: Prove the whole-session gate has teeth (history-omitting control journey)
        if: ${{ steps.legs.outputs.failures == '0' && steps.compare.outcome == 'success' }}
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/whole-session"
          node tests/browser/whole-session-gate-selftest.mjs \
            --drive-go      "$work/legs/whole-session-preset-omit-drive-gotavern.json" \
            --drive-pinned  "$work/legs/whole-session-preset-omit-drive-pinned.json" \
            --restart-go    "$work/legs/whole-session-preset-omit-restart-gotavern.json" \
            --restart-pinned "$work/legs/whole-session-preset-omit-restart-pinned.json" \
            --out "$work/whole-session-teeth-preset-omit.json"

      # A DRIVE THAT COULD NOT BE RECORDED OR JUDGED MUST FAIL THE JOB. Every other step above is gated on
      # `failures == '0'`, so a failed drive SKIPS the compares and nothing else would be red: that shape has shipped a
      # green run of a surface whose legs all died, twice in this repository's history.
      - name: Fail if a drive could not be recorded or judged
        if: ${{ always() && (steps.legs.outputs.failures != '0' || steps.compare.outcome == 'skipped' || steps.compare.outcome == 'failure') }}
        run: |
          echo "::error::a whole-session drive could not be recorded, or the comparison failed; see the group output above."
          echo "leg failures:       ${{ steps.legs.outputs.failures }}"
          echo "compare outcome:    ${{ steps.compare.outcome }}"
          exit 1

      - name: Upload the legs, the verdicts and the teeth reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: whole-session-${{ github.run_id }}
          path: |
            tests/browser/whole-session-comparison.json
            ${{ runner.temp }}/whole-session/**
          retention-days: 14
          if-no-files-found: warn
