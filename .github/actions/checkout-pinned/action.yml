# THE PINNED ORACLE CHECKOUT, in ONE place, because a pin that is fetched differently in five workflows is five
# different baselines waiting to disagree.
#
# WHY THIS EXISTS. During this release cycle a NEW surface carried a hand-transcribed pin whose last ten characters
# were transposed. Every oracle-backed job for that surface then failed inside `actions/checkout` with
#
#     fatal: remote error: upload-pack: not our ref <sha>
#
# which reads like an upstream repository problem, and it was diagnosed as one for a while: the SHA really was
# missing from upstream when queried, because the queried SHA was the transcription. A byte comparison against
# `upstream/SILLYTAVERN_COMMIT` settled it. Two things follow, and this action is both of them:
#
#   1. the pin is fetched by its advertised REF and then ASSERTED against the commit, so the ref is only a
#      transport and the SHA is the identity. A moved or rewritten upstream ref, a server that will not serve a
#      raw commit SHA, and a mistranscribed pin all fail HERE with an error that names the mismatch, instead of
#      somewhere downstream or -- worse -- against a tree that is not the pin;
#   2. the pin is fetched in exactly one place, so the five workflows cannot drift onto different baselines.
#
# WHAT THIS DOES NOT WEAKEN. The oracle identity is the COMMIT SHA, and the last step refuses to hand back a tree
# whose `git rev-parse HEAD` is anything else. `upstream/SILLYTAVERN_COMMIT` and every recording still name the
# same baseline; nothing here re-derives, re-records or tolerates a different tree.

name: Checkout the pinned SillyTavern oracle
description: Fetch the pinned SillyTavern commit (by ref, asserted by SHA) into a worktree path.

inputs:
  commit:
    description: The pinned SillyTavern commit SHA every oracle recording must resolve to.
    required: true
  path:
    description: Directory (relative to the workspace) to check the oracle out into.
    required: false
    default: .reference/SillyTavern

runs:
  using: composite
  steps:
    - name: Fetch the pinned commit by ref and assert it is the pinned commit
      shell: bash
      env:
        PINNED_COMMIT: ${{ inputs.commit }}
        DEST: ${{ inputs.path }}
      run: |
        set -euo pipefail

        if [ -z "${PINNED_COMMIT}" ]; then
          echo "::error::checkout-pinned was called with no commit; refusing to fetch an unpinned oracle"
          exit 1
        fi

        # The authoritative pin, written by the repository rather than by this workflow, so a transcription
        # error in a caller is caught here rather than diagnosed upstream.
        AUTHORITATIVE="$(tr -d '[:space:]' < upstream/SILLYTAVERN_COMMIT)"
        if [ "${PINNED_COMMIT}" != "${AUTHORITATIVE}" ]; then
          echo "::error::checkout-pinned was asked for ${PINNED_COMMIT} but upstream/SILLYTAVERN_COMMIT names ${AUTHORITATIVE}; refusing to fetch a baseline this repository does not pin"
          exit 1
        fi

        fetch_into() {
          rm -rf "$DEST"
          mkdir -p "$DEST"
          cd "$DEST"
          git init --quiet
          git remote add origin https://github.com/SillyTavern/SillyTavern
        }

        fetch_into
        fetched=""
        # 1) THE ADVERTISED REF. A transport that works even when the server will not serve a raw SHA.
        if git fetch --quiet --depth=1 origin refs/heads/release:refs/remotes/origin/release 2>/dev/null; then
          fetched="$(git rev-parse refs/remotes/origin/release)"
          echo "oracle: upstream refs/heads/release -> ${fetched}"
        else
          echo "oracle: upstream refs/heads/release could not be fetched; falling back to the pinned commit"
        fi

        # 2) THE PINNED COMMIT ITSELF, when the server will serve it. Reached when the upstream ref has moved
        # (or disappeared) but the object still exists -- in which case the pin is still satisfiable.
        if [ "$fetched" != "$PINNED_COMMIT" ]; then
          if [ -n "$fetched" ]; then
            echo "oracle: refs/heads/release is ${fetched}, not the pinned ${PINNED_COMMIT}; trying the commit"
          fi
          fetch_into
          if ! git fetch --quiet --depth=1 origin "$PINNED_COMMIT" 2>/dev/null; then
            echo "::error::the pinned oracle commit ${PINNED_COMMIT} could not be fetched from upstream refs/heads/release (${fetched:-unavailable}) or by SHA. Refusing to run against a different SillyTavern baseline."
            exit 1
          fi
          fetched="$(git rev-parse FETCH_HEAD)"
        fi

        # 3) THE ASSERTION. A ref is a transport; the SHA is the identity.
        if [ "$fetched" != "$PINNED_COMMIT" ]; then
          echo "::error::the oracle checkout resolved to ${fetched}, not the pinned ${PINNED_COMMIT}. Refusing to record against a different baseline."
          exit 1
        fi

        git checkout --quiet --detach "$PINNED_COMMIT"
        test "$(git rev-parse HEAD)" = "$PINNED_COMMIT"
        echo "oracle: checked out ${PINNED_COMMIT} (asserted; ${DEST})"
