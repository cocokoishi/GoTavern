# Docker path for GoTavern, required by ARCHITECTURE.md section 5.4.
#
# The image carries no live state: config.yaml and data/ are created inside the
# volume by the binary from its embedded pinned defaults, so replacing the
# container never overwrites an installation's characters, chats, worlds,
# settings or secrets.
services:
  gotavern:
    build:
      context: .
    image: gotavern:local
    # --listen true binds the container interface; the pinned default config
    # keeps whitelistMode on, which satisfies the startup security gate.
    #
    # --dataRoot is required: without it the relative `dataRoot: ./data` resolves
    # against the binary's own directory (/app), so the data root lands outside
    # the volume. The flag is honoured outside global mode per pinned
    # src/command-line.js:288-290. config.yaml is resolved from the working
    # directory, which is the volume below.
    # --browserLaunchEnabled false keeps the container headless (GOAL.md section 15.5). The shipped
    # config has browserLaunch.enabled: true, so without it a container start prints a launch attempt and
    # a failed-opener warning no user can act on; pinned's container has the same noise. This is a
    # recorded divergence limited to the container default.
    command: ["start", "--listen", "true", "--port", "8000", "--dataRoot", "/data/data", "--browserLaunchEnabled", "false"]
    ports:
      - "8000:8000"
    volumes:
      # The volume covers config.yaml AND the data root, so a container
      # replacement preserves the operator's configuration as well as their
      # characters, chats, worlds, settings and secrets.
      - gotavern-data:/data
    restart: unless-stopped
    healthcheck:
      # /version is a pinned public compatibility route: no session and no CSRF.
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:8000/version"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 5

volumes:
  gotavern-data:
